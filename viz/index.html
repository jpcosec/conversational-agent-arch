<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KB Atoms & Embeddings</title>
  <link rel="stylesheet" href="https://esm.sh/reactflow@11.11.4/dist/style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #f5f0e8; overflow: hidden; }
    .react-flow__attribution { display: none; }

    .toolbar {
      position: absolute; z-index: 10; top: 14px; left: 14px;
      background: rgba(13,21,38,.92); border: 1px solid #22304b; border-radius: 12px;
      padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      backdrop-filter: blur(8px);
    }
    .toolbar select {
      background: #0a0a0f; color: #f5f0e8; border: 1px solid #22304b; border-radius: 8px;
      padding: 5px 10px; font-size: 13px; font-family: inherit;
    }
    .toolbar .stats { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9aa7bd; }

    .fams { display: flex; gap: 8px; align-items: center; }
    .fam-chip {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;
      border: 1px solid #22304b; border-radius: 20px; padding: 4px 11px; font-size: 12px;
      transition: .15s; opacity: .45;
    }
    .fam-chip.on { opacity: 1; }
    .fam-chip .dot { width: 10px; height: 10px; border-radius: 50%; }

    .panel {
      position: absolute; z-index: 10; top: 14px; right: 14px; width: 330px;
      background: rgba(13,21,38,.92); border: 1px solid #22304b; border-radius: 12px;
      padding: 16px; font-size: 13px; max-height: 84vh; overflow-y: auto; backdrop-filter: blur(8px);
    }
    .panel h3 { font-size: 15px; margin-bottom: 4px; color: #f5f0e8; }
    .panel .id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9aa7bd; }
    .panel .k { color: #d4a574; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-top: 12px; font-weight: 600; }
    .panel .tag { display: inline-block; background: #22304b; border-radius: 5px; padding: 2px 7px; margin: 3px 3px 0 0; font-size: 11px; font-family: 'JetBrains Mono', monospace; }
    .panel .btn {
      margin-top: 14px; width: 100%; background: #d4a574; color: #0a0a0f; border: none;
      border-radius: 8px; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .panel .btn:hover { background: #e6a85c; }
    .muted { color: #6b7688; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "reactflow": "https://esm.sh/reactflow@11.11.4?deps=react@18.3.1,react-dom@18.3.1",
      "htm": "https://esm.sh/htm@3.1.1"
    }
  }
  </script>

  <script type="module">
    import React, { useState, useEffect, useCallback, useMemo } from "react";
    import { createRoot } from "react-dom/client";
    import ReactFlow, {
      ReactFlowProvider, Background, Controls, MiniMap, useReactFlow,
    } from "reactflow";
    import htm from "htm";
    const html = htm.bind(React.createElement);

    const FAM = {
      self:         { color: "#7cba7c", icon: "🧬" },
      domain:       { color: "#7fb3d5", icon: "📖" },
      conversation: { color: "#e6a85c", icon: "💬" },
      user:         { color: "#c97db9", icon: "👤" },
      none:         { color: "#9aa7bd", icon: "•" },
    };
    const KBS = [
      { file: "graph-donpeppe.json", label: "Don Peppe (pizzería)" },
      { file: "graph-antonia.json",  label: "Antonia (PSP Selfix)" },
      { file: "graph-reusable.json", label: "Reusable (arquitectura)" },
    ];

    function Panel({ node, onCenter }) {
      if (!node) return html`<div class="panel"><span class="muted">Click un nodo para ver detalle y centrar la vista.</span></div>`;
      const d = node.data;
      const fam = FAM[d.family] || FAM.none;
      return html`
        <div class="panel">
          <h3>${fam.icon} ${d.label}</h3>
          <div class="id">${node.id}</div>
          <div class="k">Modelo</div><div>${d.model}</div>
          <div class="k">Familia</div>
          <div><span style=${{display:"inline-block",width:10,height:10,borderRadius:"50%",background:fam.color,marginRight:6}}></span>${d.family}</div>
          <div class="k">Summary</div><div>${d.summary || html`<span class="muted">—</span>`}</div>
          <div class="k">Tags</div>
          <div>${(d.tags||[]).map(t => html`<span class="tag" key=${t}>${t}</span>`)}</div>
          <button class="btn" onClick=${() => onCenter(node)}>⊕ Centrar en este nodo</button>
        </div>`;
    }

    function Flow() {
      const [raw, setRaw] = useState({ nodes: [], edges: [], meta: {} });
      const [selected, setSelected] = useState(null);
      const [kb, setKb] = useState(KBS[0].file);
      const [active, setActive] = useState(() => new Set(Object.keys(FAM)));
      const rf = useReactFlow();

      useEffect(() => {
        fetch(kb).then(r => r.json()).then(g => {
          setRaw(g); setSelected(null);
          setActive(new Set(g.meta.families || Object.keys(FAM)));
          setTimeout(() => rf.fitView({ padding: 0.15, duration: 400 }), 50);
        });
      }, [kb]);

      const nodes = useMemo(
        () => raw.nodes.filter(n => active.has(n.data.family)),
        [raw, active]
      );
      const visibleIds = useMemo(() => new Set(nodes.map(n => n.id)), [nodes]);
      const edges = useMemo(
        () => raw.edges.filter(e => visibleIds.has(e.source) && visibleIds.has(e.target)),
        [raw, visibleIds]
      );

      const centerOn = useCallback((node) => {
        const n = raw.nodes.find(x => x.id === node.id);
        if (!n) return;
        rf.setCenter(n.position.x + 80, n.position.y + 20, { zoom: 1.6, duration: 500 });
      }, [raw, rf]);

      const onNodeClick = useCallback((_, node) => { setSelected(node); centerOn(node); }, [centerOn]);

      const toggleFam = (f) => setActive(prev => {
        const next = new Set(prev);
        next.has(f) ? next.delete(f) : next.add(f);
        return next;
      });

      const famList = raw.meta.families || [];

      return html`
        <${React.Fragment}>
          <div class="toolbar">
            <select value=${kb} onChange=${e => setKb(e.target.value)}>
              ${KBS.map(k => html`<option key=${k.file} value=${k.file}>${k.label}</option>`)}
            </select>
            <div class="fams">
              ${famList.map(f => {
                const fam = FAM[f] || FAM.none;
                return html`
                  <span key=${f} class=${"fam-chip" + (active.has(f) ? " on" : "")}
                        onClick=${() => toggleFam(f)}
                        style=${{ borderColor: active.has(f) ? fam.color : "#22304b" }}>
                    <span class="dot" style=${{ background: fam.color }}></span>${fam.icon} ${f}
                  </span>`;
              })}
            </div>
            <span class="stats">${nodes.length}/${raw.meta.count||0} atoms · ${edges.length} edges</span>
          </div>

          <${Panel} node=${selected} onCenter=${centerOn} />

          <${ReactFlow}
            nodes=${nodes} edges=${edges}
            onNodeClick=${onNodeClick}
            fitView minZoom=${0.1}
            proOptions=${{ hideAttribution: true }}>
            <${Background} color="#1a2338" gap=${26} />
            <${Controls} />
            <${MiniMap}
              nodeColor=${n => (FAM[n.data?.family] || FAM.none).color}
              maskColor="rgba(10,10,15,.7)"
              style=${{ background: "#0d1526", border: "1px solid #22304b" }} />
          <//>
        <//>`;
    }

    createRoot(document.getElementById("root")).render(
      html`<${ReactFlowProvider}><${Flow} /><//>`
    );
  </script>
</body>
</html>
