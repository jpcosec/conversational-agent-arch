namespaces:
  # Capa de arquitectura (alineada con las 3 secciones del catálogo spec2viz + negocio/ops)
  layer:
    meaning: "Capa arquitectónica, de negocio u operativa donde vive el concepto."
    examples:
      - layer:runtime       # kb_agent/* (motor conversacional)
      - layer:knowledge     # knowledge_base/*, modelos, taxonomy
      - layer:frontend      # frontends/* (UIs estáticas)
      - layer:business      # Reglas de producto, valor, glosario
      - layer:ops           # Operaciones, despliegue, testing, gobernanza
    use_when: "Aplica a todos los átomos para ubicarlos en el plano general del proyecto."

  # Rol en el ciclo del runtime
  role:
    meaning: "Función del actor dentro de la arquitectura del runtime."
    examples:
      - role:engine         # Ontologizador, Conversador, Policy
      - role:background     # Perfilador, Reflector
      - role:boundary       # Orquestador, EventBus, Config, Scrubber
      - role:data           # SQL, SLDB, KGDB
    use_when: "El átomo describe un componente vivo del diagrama lógico."

  # Familia semántica (alineada con los 10 modelos de la KB + conceptos transversales)
  family:
    meaning: "Familia de conocimiento tipado sobre la que opera el átomo."
    examples:
      - family:self         # identidad, estilo, límites, tools
      - family:domain       # reglas de negocio, hechos
      - family:conversation # flujo, estrategia, fallback
      - family:user         # perfiles, traits
      - family:concepts     # conceptos abstractos, definiciones de negocio
    use_when: "El átomo documenta un modelo de datos o un concepto transversal."

  # Canal de procedencia (reflector, importadores)
  source:
    meaning: "Canal de procedencia o productor que originó el borrador del átomo."
    examples:
      - source:reflector
    use_when: "El átomo es generado por máquina o workflow y necesita atribución de origen."

  # Tema o tópico de conocimiento
  topic:
    meaning: "Tema, tópico o área de conocimiento del átomo."
    examples:
      - topic:ontology
    use_when: "El átomo pertenece a un tema o tópico de conocimiento específico."
