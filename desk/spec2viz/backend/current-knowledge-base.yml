id: current-knowledge-base
title: "Knowledge Base CLI (current codebase)"
type: component
version: "1.0"
metadata:
  author: antonIA
  atoms:
    - atom-sldb-knowledge-base
    - atom-encuadre-de-agentes-desde-la-kb-agentframing
  description: >-
    Componentes reales del paquete knowledge_base/: el CLI (entrypoint + dispatch),
    el parser (11 subcomandos argparse), y la capa de operaciones
    (KnowledgeOperations) que envuelve acceso a SLDB, KGDB y SQL en comandos
    semánticos. Refleja el codebase actual módulo por módulo; los subcomandos
    listados son los declarados en build_parser() y despachados en cli.main().
data:
  nodes:
    KnowledgeCLI:
      label: knowledge_base CLI
      kind: core
      contains:
        - Entrypoint
        - CLIDispatch
        - Parser
        - Operations

    Entrypoint:
      label: __main__ (python -m knowledge_base)
      kind: core

    CLIDispatch:
      label: cli.main (argparse -> KnowledgeOperations)
      kind: core

    # ── parser.py: build_parser + subcomandos ────────────────────
    Parser:
      label: parser.build_parser
      kind: core
      contains:
        - CmdExplore
        - CmdShow
        - CmdTraits
        - CmdSelf
        - CmdPropose
        - CmdIndex
        - CmdPromote
        - CmdReflect

    CmdExplore:
      label: "explore (--tag / --atom / query)"
      kind: interface
    CmdShow:
      label: "show <atom_id>"
      kind: interface
    CmdTraits:
      label: "traits --user"
      kind: interface
    CmdSelf:
      label: self
      kind: interface
    CmdPropose:
      label: "propose --model --body"
      kind: interface
    CmdIndex:
      label: "index embeddings / index audit (DocumentIndex de pron en <kb>/.pron/)"
      kind: interface
    CmdPromote:
      label: "promote <atom_id>"
      kind: interface
    CmdReflect:
      label: "reflect --db"
      kind: interface

    # ── operations.py: KnowledgeOperations ───────────────────────
    Operations:
      label: operations.KnowledgeOperations
      kind: core
      contains:
        - OpsRetrieval
        - OpsSession
        - OpsPropose
        - OpsOrganize
        - OpsIndex
        - OpsReflect
        - ModelMap

    OpsRetrieval:
      label: "explore / explore_multi / show (DocumentIndex + pron.Graph)"
      kind: core
    OpsSession:
      label: "traits / self_context (KB + SQL)"
      kind: core
    OpsPropose:
      label: "propose / promote (proposed -> active atom, via pron.Store)"
      kind: core
    OpsOrganize:
      label: "organize / derive_path (flat atoms -> tag-derived dirs)"
      kind: core
    OpsIndex:
      label: "index_embeddings / audit_embeddings (DocumentIndex, keyed por hash_c)"
      kind: core
    OpsReflect:
      label: "reflect (ChatHistory -> proposed atoms)"
      kind: core
    ModelMap:
      label: "MODEL_MAP / ALL_MODELS (12 typed KB models)"
      kind: core

    # ── dependencias reales (edges de import) ─────────────────────
    PronWorld:
      label: "pron.World / pron.Store (un mundo por proceso; lectura y escritura por libreria de sldb)"
      kind: external
    PronGraph:
      label: "pron.Graph (grafo tipado de kgdb en <kb>/.pron/graph.nx.json)"
      kind: external
    PronIndex:
      label: "pron.embedder.DocumentIndex (vectores por hash_c en <kb>/.pron/docs.<embedder>.json)"
      kind: external
    SldbValidation:
      label: "sldb.runtime.validation (extract_model_data, render_model_markdown)"
      kind: external
    SldbStore:
      label: "sldb.store.io / sldb.store.layout"
      kind: external
    KBModels:
      label: "kb_agent.models.knowledge (DomainAtom, RuleAtom, ToolAtom, TraitAtom, ...)"
      kind: external
    KBSqlModels:
      label: "kb_agent.models_sql (identity: Users/UserTraits · session: SessionState)"
      kind: external
    KBFlow:
      label: "kb_agent.knowledge.flow.ConversationFlow (transitions_to / grounded_by / uses_tool)"
      kind: external
    ReflectorPkg:
      label: "kb_agent.reflector (BatchReaderJob, AtomGenerator, CheckpointStore)"
      kind: external
    FastEmbed:
      label: "kb_agent.knowledge.embedder.FastembedEmbedder (Embedder de pron sobre fastembed, jina es)"
      kind: external
    SqlAlchemy:
      label: "sqlalchemy (create_engine, Session)"
      kind: external

    SldbStoreFiles:
      label: ".sldb store (atoms + relations/ RelationDoc + semantic indexes) y .pron/ derivado"
      kind: database
    KnowledgeDb:
      label: ".knowledge.db (SQLite: users, traits, session)"
      kind: database

  edges:
    - from: Entrypoint
      to: CLIDispatch
      relation: imports
      label: main()
    - from: CLIDispatch
      to: Parser
      relation: uses
      label: build_parser()
    - from: CLIDispatch
      to: Operations
      relation: uses
      label: dispatch to KnowledgeOperations

    - from: OpsRetrieval
      to: PronIndex
      relation: uses
      label: rank por similitud
    - from: OpsRetrieval
      to: PronGraph
      relation: uses
      label: hermanos por tag / navegacion
    - from: Operations
      to: PronWorld
      relation: uses
      label: store.docs() / payload / create
    - from: OpsRetrieval
      to: SldbValidation
      relation: uses
      label: extract/render model
    - from: OpsRetrieval
      to: KBModels
      relation: uses
      label: typed atom models
    - from: Operations
      to: KBFlow
      relation: uses
      label: flow (vista del grafo)
    - from: OpsSession
      to: KBSqlModels
      relation: reads
      label: user traits + session state
    - from: OpsPropose
      to: SldbValidation
      relation: uses
      label: render proposed atom
    - from: OpsIndex
      to: FastEmbed
      relation: uses
      label: compute embeddings
    - from: OpsIndex
      to: SldbStore
      relation: uses
      label: rewrite store indexes
    - from: OpsReflect
      to: ReflectorPkg
      relation: uses
      label: batch reader + atom generator
    - from: OpsReflect
      to: SqlAlchemy
      relation: uses
      label: read ChatHistory

    - from: Operations
      to: SldbStoreFiles
      relation: reads_writes
      label: atoms + indexes
    - from: OpsSession
      to: KnowledgeDb
      relation: reads
      label: SQL session/traits
