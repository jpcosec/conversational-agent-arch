id: component-example-kb-scheduling
title: Ejemplos · KB · Estructura de Átomos SLDB (Agendamiento)
type: component
version: '1.0'
metadata:
  author: antonIA
  description: >-
    Muestra cómo el conocimiento de agendamiento se plasma en verdaderos
    Átomos SLDB (Markdown + YAML Frontmatter con 5WH1+ y namespaces).
style:
  kinds:
    atom:
      plantuml:
        background: "#D8ECFF"
        border: "#4C78A8"
        font: "#16324F"
data:
  nodes:
    atom_schema:
      label: "Esquema Base (AtomDoc)\n---\nid: str\ntitle: str\nfive_wh_one_plus: Enum\ntags: List[str]\nprovenance: str\n## Answer"
      kind: atom
    
    atom_horario:
      label: "atom-horarios-clinica.md\n---\nfive_wh_one_plus: what\ntags: [domain:agenda]\n## Answer\nLun-Vie de 09:00 a 18:00."
      kind: atom

    atom_regla:
      label: "atom-regla-no-show.md\n---\nfive_wh_one_plus: how\ntags: [domain:agenda, rule:penalidad]\n## Answer\nExigir doble confirmación."
      kind: atom

    atom_tool:
      label: "atom-tool-calendar.md\n---\nfive_wh_one_plus: how\ntags: [system:tool, integration:google]\n## Answer\nSchema check_availability()."
      kind: atom

  edges:
    - from: atom_schema
      to: atom_horario
      relation: "instancia"
    - from: atom_schema
      to: atom_regla
      relation: "instancia"
    - from: atom_schema
      to: atom_tool
      relation: "instancia"