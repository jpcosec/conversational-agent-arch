id: component-knowledge-ontology
title: "Backend · Datos · Ontología Universal y Perfiles"
type: component
version: '1.1'
metadata:
  author: antonIA
  description: >-
    Muestra la separación entre SQL (Identidad, Estado, Sesión) y SLDB (Knowledge Base)
    con sus 11+1 modelos tipados. Los 5 ejes de activación definen qué se recupera según
    contexto: self:* siempre, domain:* por relevancia, conversation:* por estado, user:traits.*
    por identidad, source:* nunca. La familia gate (GateCriterion) pertenece al eje post-draft
    y es invisible al compilador de turno.
style:
  kinds:
    sql:
      plantuml:
        background: "#FCECC9"
        border: "#D4A73C"
        font: "#5E450B"
    atom:
      plantuml:
        background: "#D8ECFF"
        border: "#4C78A8"
        font: "#16324F"
    boundary:
      plantuml:
        background: "#F5F5F5"
        border: "#CCCCCC"
        font: "#333333"
    gate:
      plantuml:
        background: "#F0FFF0"
        border: "#8FBC8F"
        font: "#006400"
        style: dashed
data:
  nodes:
    layer_sql:
      label: Capa SQL (Identidad, Estado, Sesión)
      kind: boundary
      contains:
        - sql_users
        - sql_user_traits
        - sql_session_state
        - sql_chat_history
    sql_users:
      label: Tabla Users (PII, Identidad)
      kind: sql
    sql_user_traits:
      label: Tabla UserTraits (N:M)
      kind: sql
    sql_session_state:
      label: Tabla SessionState (flow_node, dominio activo)
      kind: sql
    sql_chat_history:
      label: Tabla ChatHistory (turnos, PII scrubbed)
      kind: sql

    layer_sldb:
      label: "Capa SLDB (Knowledge Base) — 11+1 modelos"
      kind: boundary
      contains:
        - sldb_core_domains
        - family_self
        - family_domain
        - family_conversation
        - family_user
        - family_gate

    sldb_core_domains:
      label: "Store SLDB: core/models/ + core/documents/"
      kind: atom

    family_self:
      label: "Familia self (siempre activa): SelfDeclaration, StyleGuide, CapabilityBoundary, ToolAtom"
      kind: atom
    family_domain:
      label: "Familia domain (por relevancia): DomainAtom, RuleAtom"
      kind: atom
    family_conversation:
      label: "Familia conversation (por estado): ConversationStep, StrategyRule, FallbackRule"
      kind: atom
    family_user:
      label: "Familia user (por identidad): TraitAtom"
      kind: atom
    family_gate:
      label: "Familia gate (post-draft, planeada): GateCriterion"
      kind: gate

    layer_projections:
      label: Capa de Proyecciones
      kind: boundary
      contains:
        - projections_ui

    projections_ui:
      label: Proyecciones (Views, Catalogs, UI)
      kind: atom

  edges:
    - from: sql_users
      to: sql_user_traits
      relation: "1 : N"
    - from: sql_user_traits
      to: family_user
      relation: "Apunta a ID en SLDB (TraitAtom)"
    - from: sql_session_state
      to: family_conversation
      relation: flow_node determina ConversationStep activo
    - from: sldb_core_domains
      to: family_self
      relation: rige
    - from: sldb_core_domains
      to: family_domain
      relation: rige
    - from: sldb_core_domains
      to: family_conversation
      relation: rige
    - from: sldb_core_domains
      to: family_user
      relation: rige
    - from: sldb_core_domains
      to: family_gate
      relation: "rige (invisible al compilador _MODEL_TYPES)"
    - from: family_domain
      to: family_conversation
      relation: "DomainAtom groundea ConversationStep"
    - from: family_domain
      to: family_self
      relation: "CapabilityBoundary limita DomainAtom"
    - from: family_self
      to: family_conversation
      relation: "persona + estilo guían strategy"

    - from: sldb_core_domains
      to: projections_ui
      relation: "generan / proyectan"