id: activity-mesa-compile
title: Backend · Actividad · Composición SLDB (Mesa)
type: activity
version: '1.0'
metadata:
  author: antonIA
  description: >-
    Lógica de Composición SLDB: extracción de tags, followup y expansión 
    sin ranking de átomos.
data:
  start: normalize
  steps:
    normalize:
      label: normalizar query (NFKD, lower)
      next: extract_tags
    extract_tags:
      label: extraer tags por ALIASES
      next: has_tags
    has_tags:
      label: ¿hay tags?
      kind: decision
      branches:
        "no": is_followup
        "si": ensure_apos
    is_followup:
      label: ¿es followup? (marcador / <=4 palabras)
      kind: decision
      branches:
        "si": reuse_prev_tags
        "no": ensure_apos
    reuse_prev_tags:
      label: reusar include_tags de la mesa previa
      next: ensure_apos
    ensure_apos:
      label: forzar system:apos
      next: expand
    expand:
      label: expandir tags (EXPANSIONS)
      next: comp_sldb
    comp_sldb:
      label: Componer átomos (Delegado al Context Compiler sin ranking manual)
      next: build_prompt_mesa
    build_prompt_mesa:
      label: construir mesa + prompt_mesa (retorna {mesa, prompt_mesa})
      next: end
  end: end
