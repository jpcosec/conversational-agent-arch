id: component-agent-ecosystem
title: Backend · Componentes · Ecosistema de Motores y Agentes
type: component
version: '1.1'
metadata:
  author: antonIA
  description: >-
    Muestra la separación de los 4 actores (Conversador, Ontologizador, Perfilador, Reflector),
    la policy pura decide_turn (kb_agent/agent.py), los puertos LLM (kb_agent/llm.py) y el
    registry de tools (kb_agent/tools/, resuelto desde project.config.yaml), y cómo interactúan
    con la base relacional (SQL) y la base de conocimiento semántica (SLDB).
style:
  kinds:
    engine:
      plantuml:
        background: "#D8ECFF"
        border: "#4C78A8"
        font: "#16324F"
    background_agent:
      plantuml:
        background: "#E6E6FA"
        border: "#9370DB"
        font: "#4B0082"
    database:
      plantuml:
        background: "#E7F5E1"
        border: "#5A9E4B"
        font: "#1E3A17"
    api:
      plantuml:
        background: "#FCECC9"
        border: "#D4A73C"
        font: "#5E450B"
    boundary:
      plantuml:
        background: "#F5F5F5"
        border: "#CCCCCC"
        font: "#333333"
    port:
      plantuml:
        background: "#FDE8EF"
        border: "#D45C8A"
        font: "#5E1B34"
data:
  nodes:
    layer_routing:
      label: Capa de Enrutamiento
      kind: boundary
      contains:
        - api_gateway
        - state_machine
    layer_engines:
      label: Agentes y Motores Cognitivos
      kind: boundary
      contains:
        - policy_decide_turn
        - conversador
        - ontologizador
        - perfilador
        - reflector
    layer_ports:
      label: Puertos LLM (kb_agent/llm.py)
      kind: boundary
      contains:
        - port_conversador
        - port_trait_mapper
    layer_tools:
      label: Registry de Tools
      kind: boundary
      contains:
        - tool_registry
    layer_config:
      label: Configuración del Negocio
      kind: boundary
      contains:
        - project_config
    layer_data:
      label: Capa de Persistencia
      kind: boundary
      contains:
        - sql_db
        - sldb_kb
    layer_external:
      label: Servicios Externos
      kind: boundary
      contains:
        - external_tools

    api_gateway:
      label: Orchestrator.handle_turn (API Gateway)
      kind: api
    state_machine:
      label: RouterStateMachine (buffering/tool wait)
      kind: api
    policy_decide_turn:
      label: "decide_turn (policy pura, kb_agent/agent.py)"
      kind: engine
    conversador:
      label: Conversador (redacta NL vía puerto LLM)
      kind: engine
    ontologizador:
      label: Ontologizador (Context Compiler)
      kind: engine
    perfilador:
      label: Perfilador (Feature Extractor)
      kind: background_agent
    reflector:
      label: Reflector (KB Thickener)
      kind: background_agent
    port_conversador:
      label: "Conversador (Protocol): draft_nl()"
      kind: port
    port_trait_mapper:
      label: "TraitMapper (Protocol): extract_traits()"
      kind: port
    tool_registry:
      label: "kb_agent/tools/: execute_tool + load_tool_handlers"
      kind: api
    project_config:
      label: "project.config.yaml (ProjectConfig): kb_root, model, tools:"
      kind: boundary
    sql_db:
      label: SQL DB (Identidad, Estado, Cron)
      kind: database
    sldb_kb:
      label: SLDB (Knowledge Base / Atoms)
      kind: database
    external_tools:
      label: External APIs (Calendario, CRM)
      kind: api
  edges:
    - from: api_gateway
      to: sql_db
      relation: lee/escribe estado y sesión
    - from: api_gateway
      to: state_machine
      relation: delega el turno
    - from: state_machine
      to: ontologizador
      relation: solicita contexto p()
    - from: ontologizador
      to: sql_db
      relation: lee trait_ids del usuario
    - from: ontologizador
      to: sldb_kb
      relation: extrae subgrafos (Traits, Rules, Tools)
    - from: state_machine
      to: policy_decide_turn
      relation: decide tipo de turno (tool_call / fallback / nl)
    - from: policy_decide_turn
      to: conversador
      relation: si kind=nl, delega redacción
    - from: policy_decide_turn
      to: tool_registry
      relation: si kind=tool_call, emite function_call
    - from: conversador
      to: port_conversador
      relation: implementa
    - from: perfilador
      to: port_trait_mapper
      relation: implementa
    - from: tool_registry
      to: project_config
      relation: resuelve handlers desde tools
    - from: tool_registry
      to: external_tools
      relation: ejecuta handler (crear_reserva, etc.)
    - from: tool_registry
      to: sql_db
      relation: persiste resultado del handler
    - from: api_gateway
      to: project_config
      relation: Orchestrator.from_config
    - from: perfilador
      to: api_gateway
      relation: escucha turnos asíncronamente (EventBus)
    - from: perfilador
      to: sql_db
      relation: asocia user_id con nuevos trait_ids
    - from: reflector
      to: sql_db
      relation: procesa historial en batch (checkpoint)
    - from: reflector
      to: sldb_kb
      relation: materializa nuevos átomos de conocimiento