id: component-agent-ecosystem
title: "Backend · Componentes · Ecosistema de Roles y Agentes"
type: component
version: '1.2'
metadata:
  author: antonIA
  description: >-
    Muestra la separación de los 5 roles (Orquestador, Conversador, Ontologizador,
    Perfilador, Reflector), el Orquestador (decide_turn en kb_agent/agent.py que decide
    tool_call/fallback/nl), los puertos LLM (kb_agent/llm.py) y el registry de tools
    (kb_agent/tools/, resuelto desde project.config.yaml), y cómo interactúan con la
    base relacional (SQL) y la base de conocimiento semántica (SLDB). El Policy Gate
    (familia gate, 5 átomos GateCriterion en KB) es un 5to rol conceptual: sus criterios
    ya existen en el store pero no hay código runtime que los invoque.
style:
  kinds:
    engine:
      plantuml:
        background: "#D8ECFF"
        border: "#4C78A8"
        font: "#16324F"
    background_agent:
      plantuml:
        background: "#E6E6FA"
        border: "#9370DB"
        font: "#4B0082"
    database:
      plantuml:
        background: "#E7F5E1"
        border: "#5A9E4B"
        font: "#1E3A17"
    api:
      plantuml:
        background: "#FCECC9"
        border: "#D4A73C"
        font: "#5E450B"
    boundary:
      plantuml:
        background: "#F5F5F5"
        border: "#CCCCCC"
        font: "#333333"
    port:
      plantuml:
        background: "#FDE8EF"
        border: "#D45C8A"
        font: "#5E1B34"
    planned:
      plantuml:
        background: "#F0FFF0"
        border: "#8FBC8F"
        font: "#006400"
        style: dashed
data:
  nodes:
    layer_routing:
      label: Capa de Enrutamiento
      kind: boundary
      contains:
        - api_gateway
        - state_machine
    layer_engines:
      label: Roles y Motores Cognitivos
      kind: boundary
      contains:
        - orquestador
        - conversador
        - ontologizador
        - perfilador
        - reflector
    layer_planned:
      label: Rol Planeado (sin código runtime)
      kind: boundary
      contains:
        - policy_gate
    layer_ports:
      label: Puertos LLM (kb_agent/llm.py)
      kind: boundary
      contains:
        - port_conversador
        - port_trait_mapper
    layer_tools:
      label: Registry de Tools
      kind: boundary
      contains:
        - tool_registry
    layer_config:
      label: Configuración del Negocio
      kind: boundary
      contains:
        - project_config
    layer_data:
      label: Capa de Persistencia
      kind: boundary
      contains:
        - sql_db
        - sldb_kb
    layer_external:
      label: Servicios Externos
      kind: boundary
      contains:
        - external_tools

    api_gateway:
      label: Orchestrator.handle_turn (API Gateway)
      kind: api
    state_machine:
      label: RouterStateMachine (buffering/tool wait)
      kind: api
    orquestador:
      label: "Orquestador / decide_turn (kb_agent/agent.py)"
      kind: engine
    conversador:
      label: Conversador (redacta NL vía puerto LLM)
      kind: engine
    ontologizador:
      label: Ontologizador (Context Compiler)
      kind: engine
    perfilador:
      label: Perfilador (Feature Extractor)
      kind: background_agent
    reflector:
      label: Reflector (KB Thickener)
      kind: background_agent
    policy_gate:
      label: "Policy Gate (planeado — criterios en store type.knowledge.gate)"
      kind: planned
    port_conversador:
      label: "Conversador (Protocol): draft_nl()"
      kind: port
    port_trait_mapper:
      label: "TraitMapper (Protocol): extract_traits()"
      kind: port
    tool_registry:
      label: "kb_agent/tools/: execute_tool + load_tool_handlers"
      kind: api
    project_config:
      label: "project.config.yaml (ProjectConfig): kb_root, model, tools:"
      kind: boundary
    sql_db:
      label: SQL DB (Identidad, Estado, Cron)
      kind: database
    sldb_kb:
      label: "SLDB (Knowledge Base / 11 tipos: domain, rule, tool, trait, step, self, style, boundary, strategy, fallback, gate)"
      kind: database
    external_tools:
      label: External APIs (Calendario, CRM)
      kind: api
  edges:
    - from: api_gateway
      to: sql_db
      relation: lee/escribe estado y sesión
    - from: api_gateway
      to: state_machine
      relation: delega el turno
    - from: state_machine
      to: ontologizador
      relation: solicita contexto (compile_context)
    - from: ontologizador
      to: sql_db
      relation: lee trait_ids del usuario
    - from: ontologizador
      to: sldb_kb
      relation: extrae subgrafos (11 tipos, iterados por _MODEL_TYPES)
    - from: state_machine
      to: orquestador
      relation: decide tipo de turno (tool_call / fallback / nl)
    - from: orquestador
      to: conversador
      relation: si kind=nl, delega redacción
    - from: orquestador
      to: tool_registry
      relation: si kind=tool_call, emite function_call
    - from: state_machine
      to: conversador
      relation: "si tool timeout, re-draft con error"
    - from: policy_gate
      to: sldb_kb
      relation: "lectura futura: reader.find('type.knowledge.gate')"
    - from: conversador
      to: port_conversador
      relation: implementa
    - from: perfilador
      to: port_trait_mapper
      relation: implementa
    - from: tool_registry
      to: project_config
      relation: resuelve handlers desde tools
    - from: tool_registry
      to: external_tools
      relation: ejecuta handler (crear_reserva, etc.)
    - from: tool_registry
      to: sql_db
      relation: persiste resultado del handler
    - from: api_gateway
      to: project_config
      relation: Orchestrator.from_config
    - from: perfilador
      to: api_gateway
      relation: escucha turnos asíncronamente (EventBus)
    - from: perfilador
      to: sql_db
      relation: asocia user_id con nuevos trait_ids
    - from: reflector
      to: sql_db
      relation: procesa historial en batch (checkpoint)
    - from: reflector
      to: sldb_kb
      relation: materializa nuevos átomos de conocimiento