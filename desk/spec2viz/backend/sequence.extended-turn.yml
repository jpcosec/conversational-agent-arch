id: sequence-extended-turn
title: Backend · Secuencia · Ciclo de Vida del Turno Extendido
type: sequence
version: '1.0'
metadata:
  author: antonIA
  description: >-
    Traza el flujo de un mensaje desde el buffering, la inyección del contexto por el
    Ontologizador, una posible llamada a Tool Externa por el Conversador, y la actuación asíncrona del Perfilador.
data:
  participants:
    - id: User_Cron
      kind: actor
    - id: Router
      kind: component
    - id: Ontologizador
      kind: component
    - id: Conversador
      kind: component
    - id: API_Ext
      kind: boundary
    - id: Perfilador
      kind: component
  messages:
    - from: User_Cron
      to: Router
      message: Mensaje o Trigger Proactivo
    - from: Router
      to: Router
      message: Buffer/Debounce & Carga Estado SQL
    - from: Router
      to: Ontologizador
      message: Compilar p(Escenario, Pregunta, Perfil)
      kind: sync
    - from: Ontologizador
      to: Ontologizador
      message: Recupera subgrafos KB (Rules, Traits, Tools)
    - from: Ontologizador
      to: Router
      message: Contexto Compilado
      kind: return
    - from: Router
      to: Conversador
      message: Generar respuesta / Acción
      kind: sync
    - from: Conversador
      to: API_Ext
      message: (Opcional) Llama API externa según ToolAtom
      kind: sync
    - from: API_Ext
      to: Conversador
      message: Datos JSON
      kind: return
    - from: Conversador
      to: Conversador
      message: Redacta NL basado en Contexto + JSON
    - from: Conversador
      to: Router
      message: Respuesta Generada
      kind: return
    - from: Router
      to: User_Cron
      message: Respuesta enviada
      kind: return
    - from: Router
      to: Perfilador
      message: Emite evento de turno (Async)
      kind: sync
    - from: Perfilador
      to: Perfilador
      message: Extrae características y vincula en SQL
