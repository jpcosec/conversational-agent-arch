id: sequence-extended-turn
title: Backend · Secuencia · Ciclo de Vida del Turno Extendido
type: sequence
version: '1.1'
metadata:
  author: antonIA
  description: >-
    Traza el flujo de un mensaje (kb_agent/orchestrator.py Orchestrator.handle_turn) desde el
    RouterStateMachine, la compilación de contexto por el Ontologizador, la policy pura
    decide_turn (kb_agent/agent.py) que decide tool_call/fallback/nl, el dispatcher de tools
    (registry resuelto desde project.config.yaml), el Conversador (puerto LLM) y la actuación
    asíncrona del Perfilador.
data:
  participants:
    - id: User_Cron
      kind: actor
    - id: Router
      kind: component
    - id: Ontologizador
      kind: component
    - id: Policy
      kind: decision_engine
    - id: ToolRegistry
      kind: boundary
    - id: Conversador
      kind: component
    - id: API_Ext
      kind: boundary
    - id: Perfilador
      kind: component
  messages:
    - from: User_Cron
      to: Router
      message: Mensaje o Trigger Proactivo
    - from: Router
      to: Router
      message: Buffer/Debounce (RouterStateMachine) & Carga SessionState SQL
    - from: Router
      to: Ontologizador
      message: compile_context(question, user_id, scenario, trigger)
      kind: sync
    - from: Ontologizador
      to: Ontologizador
      message: Recupera subgrafos KB (Rules, Traits, Tools) vía SLDBReader/KGDBReader
    - from: Ontologizador
      to: Router
      message: Contexto Compilado (CompiledDocument.to_dict())
      kind: return
    - from: Router
      to: Policy
      message: decide_turn(compiled_context)
      kind: sync
    - from: Policy
      to: Router
      message: "{kind: tool_call|fallback|nl}"
      kind: return
    - from: Router
      to: ToolRegistry
      message: "(si kind=tool_call) execute_tool(function_call, handlers)"
      kind: sync
      condition: kind == tool_call
    - from: ToolRegistry
      to: API_Ext
      message: invoca handler registrado (project.config.yaml tools)
      kind: sync
      condition: kind == tool_call
    - from: API_Ext
      to: ToolRegistry
      message: Datos JSON
      kind: return
      condition: kind == tool_call
    - from: ToolRegistry
      to: Router
      message: System Turn (JSON persistido en SQL)
      kind: return
      condition: kind == tool_call
    - from: Router
      to: Conversador
      message: draft_nl(contexto + system_turn)
      kind: sync
    - from: Conversador
      to: Conversador
      message: Redacta NL basado en Contexto (+ System Turn si hubo tool)
    - from: Conversador
      to: Router
      message: Respuesta Generada
      kind: return
    - from: Router
      to: User_Cron
      message: Respuesta enviada
      kind: return
    - from: Router
      to: Perfilador
      message: publish_turn_closed (EventBus, async)
      kind: sync
    - from: Perfilador
      to: Perfilador
      message: extract_traits (puerto TraitMapper) y persiste UserTraits en SQL
