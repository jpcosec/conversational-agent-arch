id: matrix-agents-kb-consumption
title: Backend · Matriz · Agentes × Modelos de la KB que consumen
type: component_view_matrix
version: "0.3"
metadata:
  author: antonIA
  description: >-
    Qué modelo tipado de conocimiento lee o produce cada agente del runtime.
    Stages = los 12 modelos reales de kb_agent/models/knowledge/* (ordenados
    por su __family__: self→domain→conversation→user→gate→agent). Dos vistas:
    (1) Lee — modelos que entran al agente; (2) Produce — modelos que escribe.
    Barras derivadas del código: Ontologizador (compiler._MODEL_TYPES = 10
    tipos + step vía KGDB); Ruteador (RouterAgent: cualquier documento
    justificado vía tools explore_multi/explore/show sobre KnowledgeOperations,
    + AgentFraming rol router); Orquestador (OrchestratorAgent: grafo de
    ConversationStep en static_instruction + tools declaradas + AgentFraming
    rol orchestrator; fallback decide_turn); Conversador (llm.draft_nl usa
    persona self/style/boundary + strategy + domain/rule + user_traits); Gate
    (GateAgent: GateCriterion en static_instruction + AgentFraming rol gate);
    Perfilador (extractor lee y upserta trait); Reflector (generator.fetch
    domain/rule y propone domain/rule 'proposed').
data:
  views:
    - id: reads
      label: Lee (consume)
      stages:
        - id: self
          label: "self · self"
        - id: style
          label: "self · style"
        - id: boundary
          label: "self · boundary"
        - id: tool
          label: "self · tool"
        - id: domain
          label: "domain · domain"
        - id: rule
          label: "domain · rule"
        - id: step
          label: "conv · step"
        - id: strategy
          label: "conv · strategy"
        - id: fallback
          label: "conv · fallback"
        - id: trait
          label: "user · trait"
        - id: gate
          label: "gate · gate"
        - id: agent
          label: "agent · agent (framing)"
    - id: writes
      label: Produce (escribe)
      stages:
        - id: domain_w
          label: "domain · domain"
        - id: rule_w
          label: "domain · rule"
        - id: trait_w
          label: "user · trait"

  components:
    - name: Engines
      kind: core
      label: Agentes del runtime (kb_agent/*)
      stages:
        reads: [self, style, boundary, tool, domain, rule, step, strategy, fallback, trait, gate, agent]
        writes: [domain_w, rule_w, trait_w]
      children:
        - name: Ontologizador
          kind: engine
          label: "Ontologizador (compile_context: lee TODA la KB tipada + step vía KGDB; delega el bundle al Ruteador)"
          stages:
            reads: [self, style, boundary, tool, domain, rule, step, strategy, fallback, trait]
        - name: Ruteador
          kind: decision_engine
          label: "Ruteador (RouterAgent: cualquier documento justificado vía explore/show; piso de seguridad rule)"
          stages:
            reads: [self, style, boundary, tool, domain, rule, step, strategy, fallback, trait, agent]
        - name: Orquestador
          kind: decision_engine
          label: "Orquestador (OrchestratorAgent: grafo de steps + tools declaradas -> kind/tool_call/step_target)"
          stages:
            reads: [tool, step, agent]
        - name: Conversador
          kind: engine
          label: "Conversador (draft_nl: persona self/style/boundary + strategy + domain/rule + traits)"
          stages:
            reads: [self, style, boundary, domain, rule, strategy, fallback, trait]
        - name: Gate
          kind: decision_engine
          label: "Gate (GateAgent: juzga la respuesta contra los GateCriterion)"
          stages:
            reads: [gate, agent]
        - name: Perfilador
          kind: service
          label: "Perfilador (extractor: lee trait candidatos → upsert UserTrait)"
          stages:
            reads: [trait]
            writes: [trait_w]
        - name: Reflector
          kind: service
          label: "Reflector (KB Thickener: fetch domain/rule → propone domain/rule 'proposed')"
          stages:
            reads: [domain, rule]
            writes: [domain_w, rule_w]
