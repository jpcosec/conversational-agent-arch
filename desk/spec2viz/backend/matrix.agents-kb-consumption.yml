id: matrix-agents-kb-consumption
title: Backend · Matriz · Agentes × Familias de la KB que consumen
type: component_view_matrix
version: "0.1"
metadata:
  author: antonIA
  description: >-
    Qué familia de conocimiento consume (lee) o produce (escribe) cada motor
    cognitivo del runtime. Familias reales de __family__ (self/domain/
    conversation/user). Dos vistas: (1) Lee — qué familias entran al motor;
    (2) Produce — qué familias escribe/engorda. Barras derivadas del código:
    Ontologizador._MODEL_TYPES (compila las 4), Conversador recibe el
    CompiledDocument (persona=self, rules=domain, strategy=conversation,
    traits=user), Perfilador produce user (traits), Reflector engorda domain.
data:
  views:
    - id: reads
      label: Lee (consume)
      stages:
        - id: self
          label: self
        - id: domain
          label: domain
        - id: conversation
          label: conversation
        - id: user
          label: user
    - id: writes
      label: Produce (escribe)
      stages:
        - id: self_w
          label: self
        - id: domain_w
          label: domain
        - id: conversation_w
          label: conversation
        - id: user_w
          label: user

  components:
    - name: Engines
      kind: core
      label: Motores Cognitivos (kb_agent/*)
      stages:
        reads: [self, domain, conversation, user]
        writes: [domain_w, user_w]
      children:
        - name: Ontologizador
          kind: engine
          label: "Ontologizador (compile_context, lee toda la KB)"
          stages:
            reads: [self, domain, conversation, user]
        - name: Conversador
          kind: engine
          label: "Conversador (redacta NL desde CompiledDocument)"
          stages:
            reads: [self, domain, conversation, user]
        - name: Perfilador
          kind: service
          label: "Perfilador (extrae traits del turno)"
          stages:
            reads: [user]
            writes: [user_w]
        - name: Reflector
          kind: service
          label: "Reflector (KB Thickener: engorda dominio)"
          stages:
            reads: [domain]
            writes: [domain_w]
