id: state-conversation-flow
title: Backend · Estado · Máquina de Estados de la Conversación
type: state
version: '1.0'
metadata:
  author: antonIA
  description: >-
    Diagrama de la Máquina de Estados que rige el flujo de la conversación, manejando
    buffers de entrada, escenarios de negocio, interrupciones, ejecución de tools y retomas.
data:
  entity: AgentConversation
  initial: idle
  states:
    - id: idle
      label: Idle / Esperando
    - id: buffering
      label: Buffering (Debounce multi-mensaje)
    - id: greeting
      label: "Escenario: Saludo / Inicio"
    - id: presentation
      label: "Escenario: Presentación"
    - id: questioning
      label: "Escenario: Preguntas (Q&A)"
    - id: activation
      label: "Escenario: Protocolos de Activación"
    - id: waiting_tool
      label: Ejecutando Tool Externa (Pausa)
    - id: breakpoint_miss
      label: Punto de Quiebre (Context Miss / No sé)
    - id: interrupted
      label: Interrumpido (Timeout)
  transitions:
    - from: idle
      to: buffering
      "on": mensaje_usuario
    - from: idle
      to: activation
      "on": trigger_sintetico_cron
      guard: proactividad
    - from: buffering
      to: buffering
      "on": mensaje_adicional
    - from: buffering
      to: greeting
      "on": timeout_buffer
      guard: primera_interaccion
    - from: buffering
      to: questioning
      "on": timeout_buffer
      guard: sesion_activa
    - from: interrupted
      to: questioning
      "on": mensaje_retoma
      guard: inyecta_contexto_retoma
    - from: greeting
      to: presentation
      "on": saludo_completado
    - from: presentation
      to: questioning
      "on": consulta_usuario
    - from: questioning
      to: waiting_tool
      "on": requiere_api_externa
      guard: Ontologizador inyecta ToolAtom
    - from: waiting_tool
      to: questioning
      "on": json_api_recibido
      guard: se_inyecta_como_turno
    - from: questioning
      to: breakpoint_miss
      "on": contexto_vacio
      guard: Conversador admite desconocimiento
    - from: breakpoint_miss
      to: questioning
      "on": reformulacion
    - from: questioning
      to: activation
      "on": intencion_accion
    - from: activation
      to: questioning
      "on": protocolo_completado
    - from: questioning
      to: interrupted
      "on": inactividad_prolongada
