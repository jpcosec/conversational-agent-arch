id: state-conversation-flow
title: Backend · Estado · Máquina de Estados de la Conversación
type: state
version: '1.0'
metadata:
  author: antonIA
  description: >-
    Diagrama de la Máquina de Estados que rige el flujo de la conversación, manejando
    buffers de entrada, escenarios de negocio, interrupciones, ejecución de tools y retomas.
data:
  entity: AgentConversation
  initial: idle
  states:
    - id: idle
      label: Idle / Esperando
    - id: buffering
      label: Buffering (Debounce multi-mensaje)
    - id: evaluating_context
      label: Evaluando Estado y Contexto (Ontologizador)
    - id: drafting_response
      label: Redactando Respuesta (Conversador)
    - id: waiting_tool
      label: Ejecutando Tool Externa (Pausa)
    - id: breakpoint_miss
      label: Punto de Quiebre (Context Miss / Fallback)
    - id: interrupted
      label: Interrumpido (Timeout)
  transitions:
    - from: idle
      to: buffering
      "on": mensaje_usuario
    - from: idle
      to: evaluating_context
      "on": trigger_sintetico_cron
      guard: proactividad
    - from: buffering
      to: buffering
      "on": mensaje_adicional
    - from: buffering
      to: evaluating_context
      "on": timeout_buffer
      guard: envía_inputs_al_router
    - from: interrupted
      to: evaluating_context
      "on": mensaje_retoma
      guard: inyecta_tiempo_transcurrido
    - from: evaluating_context
      to: waiting_tool
      "on": requiere_api_externa
      guard: ToolAtom inyectado
    - from: waiting_tool
      to: evaluating_context
      "on": json_api_recibido
      guard: inyecta_resultado
    - from: evaluating_context
      to: drafting_response
      "on": contexto_resuelto
      guard: Escenario (ej. Saludo, Q&A) definido en context
    - from: evaluating_context
      to: breakpoint_miss
      "on": contexto_vacio
      guard: fuera de dominio
    - from: breakpoint_miss
      to: drafting_response
      "on": aplica_fallback
      guard: Conversador admite desconocimiento
    - from: drafting_response
      to: idle
      "on": respuesta_enviada
    - from: idle
      to: interrupted
      "on": inactividad_prolongada
