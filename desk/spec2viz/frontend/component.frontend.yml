id: component-frontend
title: KB Agent Runtime · Frontend · Componentes
type: component
version: '1.1'
metadata:
  author: antonIA
  description: >-
    Frontend = HTML/JS estático (sin build) bajo frontends/. Tres UIs servidas
    por el mismo FastAPI (frontends/chat/server.py): chat con inspector
    (frontends/chat/index.html), editor de flujo (frontends/flow_editor) y
    visor de perfilado (frontends/profiling).
style:
  kinds:
    core:
      plantuml:
        background: "#D8ECFF"
        border: "#4C78A8"
        font: "#16324F"
    boundary:
      plantuml:
        background: "#FCECC9"
        border: "#D4A73C"
        font: "#5E450B"
data:
  nodes:
    chat_ui:
      label: frontends/chat/index.html
      kind: core
      contains:
        - chat_pane
        - inspector
        - atom_modal
        - marked_lib
    chat_pane:
      label: Panel de chat (renderTurns)
      kind: core
    inspector:
      label: Inspector de mesa (renderTurnInspector)
      kind: core
    atom_modal:
      label: Modal de átomo / reasoning
      kind: core
    marked_lib:
      label: marked.min.js (CDN, markdown)
      kind: boundary
    flow_editor_ui:
      label: frontends/flow_editor/index.html
      kind: core
      contains:
        - flow_graph_view
        - react_flow_lib
    flow_graph_view:
      label: Grafo de ConversationStep (nodos + allowed_transitions)
      kind: core
    react_flow_lib:
      label: React Flow (CDN, sin build)
      kind: boundary
    profiling_ui:
      label: frontends/profiling/index.html
      kind: core
      contains:
        - trait_fichas
    trait_fichas:
      label: Fichas de rasgo (UserTraits SQL ↔ TraitAtom SLDB)
      kind: core
    chat_api:
      label: FastAPI (frontends/chat/server.py) /api/*
      kind: boundary
  edges:
    - from: chat_pane
      to: chat_api
      relation: fetch /api/chat
    - from: atom_modal
      to: chat_api
      relation: fetch /api/atom/{id}
    - from: chat_ui
      to: marked_lib
      relation: renderiza markdown
    - from: flow_graph_view
      to: chat_api
      relation: fetch /api/flow
    - from: flow_editor_ui
      to: react_flow_lib
      relation: renderiza grafo
    - from: trait_fichas
      to: chat_api
      relation: fetch /api/profiles
