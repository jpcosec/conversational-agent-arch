id: deployment-backend-frontend
title: KB Agent Runtime · Despliegue · Backend vs Frontend
type: deployment
version: '2.0'
metadata:
  author: antonIA
  description: >-
    Separación explícita backend/frontend del runtime kb-agent. El frontend son 5 UIs estáticas
    (HTML/JS sin build) servidas al navegador; el backend es el mismo FastAPI app factory
    (frontends/chat/app.py create_app) desplegado en Modal (deploy/modal_app.py, @modal.asgi_app)
    con un Volume para el SQLite de chat y un Secret para credenciales Vertex ADC, o corrido
    localmente vía uvicorn (frontends/chat/server.py) para desarrollo.
data:
  nodes:
    browser:
      label: Navegador (Web UI)
      kind: client
      contains:
        - chat_ui_html
        - flow_editor_html
        - profiling_html
        - taxonomy_html
        - viz_html
    webhook_channels:
      label: Canales Externos (Twilio WhatsApp/SMS)
      kind: client
      contains:
        - twilio_webhook

    modal_app:
      label: Modal App (deploy/modal_app.py, @modal.asgi_app)
      kind: server
      contains:
        - modal_image
        - chat_api
        - vertex_adc_secret

    modal_volume:
      label: "Modal Volume (/data)"
      kind: database
      contains:
        - chat_db_sqlite

    local_dev:
      label: "Local dev (uvicorn, frontends/chat/server.py)"
      kind: server
      contains:
        - chat_api_local
        - kb_store_local

    vertex:
      label: Vertex AI · gemini-2.5-flash
      kind: cloud
      contains:
        - gemini_llm

  artifacts:
    chat_ui_html:
      label: frontends/chat/index.html (chat + inspector)
      kind: frontend
    flow_editor_html:
      label: frontends/flow_editor/index.html (editor de flujo)
      kind: frontend
    profiling_html:
      label: frontends/profiling/index.html (perfilado)
      kind: frontend
    taxonomy_html:
      label: frontends/taxonomy/index.html (explorador de taxonomía)
      kind: frontend
    viz_html:
      label: frontends/viz/index.html (grafo de embeddings)
      kind: frontend
    twilio_webhook:
      label: WhatsApp / SMS (Twilio Webhook)
      kind: external
    modal_image:
      label: "modal.Image: repo en /root/app + paquetes locales sldb/kgdb/deskops + KB baked-in"
      kind: backend
    chat_api:
      label: create_app() (FastAPI) servido por Modal ASGI
      kind: backend
    vertex_adc_secret:
      label: "Modal Secret kb-agent-runtime-gcp (Vertex ADC)"
      kind: backend
    chat_db_sqlite:
      label: "SQLite CHAT_DB (SessionState, ChatHistory, UserTraits)"
      kind: database_schema
    chat_api_local:
      label: create_app() (FastAPI) servido por uvicorn local
      kind: backend
    kb_store_local:
      label: "KB (project.config.yaml kb_root) en disco local"
      kind: database_schema
    gemini_llm:
      label: gemini-2.5-flash (endpoint Vertex AI)
      kind: backend

  connections:
    - from: chat_ui_html
      to: chat_api
      protocol: fetch /api/chat (HTTPS)
    - from: flow_editor_html
      to: chat_api
      protocol: fetch /api/flow (HTTPS)
    - from: profiling_html
      to: chat_api
      protocol: fetch /api/profiles (HTTPS)
    - from: taxonomy_html
      to: chat_api
      protocol: fetch /api/taxonomy (HTTPS)
    - from: viz_html
      to: chat_api
      protocol: fetch /api/viz/graph (HTTPS)
    - from: twilio_webhook
      to: chat_api
      protocol: POST /webhooks/twilio (form + X-Twilio-Signature)
    - from: chat_api
      to: twilio_webhook
      protocol: responde TwiML (HTTPS)
    - from: modal_image
      to: chat_api
      protocol: empaqueta y ejecuta create_app()
    - from: chat_api
      to: chat_db_sqlite
      protocol: SQLAlchemy (CHAT_DB en Volume /data)
    - from: chat_api
      to: modal_image
      protocol: lee KB baked-in (SLDBReader/KGDBReader)
    - from: chat_api
      to: vertex_adc_secret
      protocol: credenciales ADC (google-genai Vertex)
    - from: chat_api
      to: gemini_llm
      protocol: generate_content (Conversador/Perfilador)
    - from: chat_api_local
      to: kb_store_local
      protocol: lee KB local (SLDBReader/KGDBReader, sin Modal)
    - from: chat_api_local
      to: gemini_llm
      protocol: generate_content (API key o ADC local)
