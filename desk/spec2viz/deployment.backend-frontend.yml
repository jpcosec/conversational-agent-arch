id: deployment-backend-frontend
title: KB Agent Runtime · Despliegue · Backend vs Frontend
type: deployment
version: '1.0'
metadata:
  author: antonIA
  description: >-
    Separación explícita backend/frontend del runtime kb-agent. El frontend son
    UIs estáticas (HTML) servidas al navegador; el backend es FastAPI + agentes
    ADK/Gemini y el CLI sldb sobre el store de conocimiento.
data:
  nodes:
    browser:
      label: Navegador (Web UI)
      kind: client
      contains:
        - kb_chat_ui_html
        - visor_wiki_html
        - visor_grafo_html
    webhook_channels:
      label: Canales Externos (Twilio, WhatsApp)
      kind: client
      contains:
        - twilio_webhook
    app_server:
      label: App Server · Runner E2E (tests/e2e/run_donpeppe)
      kind: server
      contains:
        - chat_api
        - composicion_sldb
    adk_runtime:
      label: ADK Runtime (adk web / agentes)
      kind: server
      contains:
        - agente_conversacional
        - ontological_context_compiler
        - kb_tools_wrapper
    kb_store_host:
      label: KB host · tutor_apoe
      kind: server
      contains:
        - sldb_cli
        - sldb_store
        - relational_db
    vertex:
      label: Vertex AI · gemini-2.5-flash
      kind: cloud
      contains:
        - gemini_llm

  artifacts:
    kb_chat_ui_html:
      label: kb_chat_ui/index.html (chat + inspector)
      kind: frontend
    visor_wiki_html:
      label: Visor de átomos (wiki/sldb)
      kind: frontend
    visor_grafo_html:
      label: Visor de grafo (kgdb)
      kind: frontend
    twilio_webhook:
      label: WhatsApp / SMS (Webhook)
      kind: external
    chat_api:
      label: FastAPI /api/chat /api/atom /api/session
      kind: backend
    composicion_sldb:
      label: Composición SLDB
      kind: backend
    agente_conversacional:
      label: Agente Conversacional (LlmAgent)
      kind: backend
    ontological_context_compiler:
      label: Ontological Context Compiler
      kind: backend
    kb_tools_wrapper:
      label: kb_tools (wrapper CLI sldb)
      kind: backend
    sldb_cli:
      label: sldb CLI (find / docs show)
      kind: backend
    sldb_store:
      label: .sldb store + semantic_index.yaml
      kind: database
    relational_db:
      label: Base de Datos (Relacional)
      kind: database
    gemini_llm:
      label: gemini-2.5-flash (endpoint)
      kind: backend

  connections:
    - from: kb_chat_ui_html
      to: chat_api
      protocol: fetch /api/chat (HTTP)
    - from: twilio_webhook
      to: chat_api
      protocol: POST webhook
    - from: chat_api
      to: twilio_webhook
      protocol: envia mensaje (SDK Twilio)
    - from: visor_wiki_html
      to: sldb_store
      protocol: fetch atoms.json (estático)
    - from: visor_grafo_html
      to: relational_db
      protocol: fetch graph (estático)
    - from: chat_api
      to: composicion_sldb
      protocol: compila contexto (Ontologizador)
    - from: chat_api
      to: gemini_llm
      protocol: generate_content
    - from: composicion_sldb
      to: sldb_store
      protocol: lee atoms.json
    - from: agente_conversacional
      to: ontological_context_compiler
      protocol: delega retrieval
    - from: ontological_context_compiler
      to: kb_tools_wrapper
      protocol: invoca tools
    - from: agente_conversacional
      to: gemini_llm
      protocol: LLM
    - from: ontological_context_compiler
      to: gemini_llm
      protocol: LLM
    - from: kb_tools_wrapper
      to: sldb_cli
      protocol: subprocess
    - from: sldb_cli
      to: sldb_store
      protocol: consulta store
    - from: sldb_cli
      to: relational_db
      protocol: consulta bd
