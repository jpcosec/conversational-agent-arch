<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KB Agent UI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2a;
      --panel-2: #0f1524;
      --text: #e7ecf3;
      --muted: #9aa7bd;
      --border: #26304a;
      --accent: #7cc4ff;
      --chip: #1c2640;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      height: 100vh;
    }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, #0b1020 0%, #0c1324 100%);
    }
    .topbar {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(19, 26, 42, 0.9);
      backdrop-filter: blur(8px);
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    .editor-wrap {
      display: grid;
      grid-template-rows: 180px minmax(0, 1fr);
      min-height: 0;
      flex: 1;
    }
    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      padding: 16px 18px;
      background: var(--panel-2);
      color: var(--text);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      border-bottom: 1px solid var(--border);
    }
    .rendered {
      overflow: auto;
      padding: 26px 34px 80px;
      min-width: 0;
    }
    .rendered .content {
      max-width: 860px;
      margin: 0 auto;
      line-height: 1.7;
      font-size: 16px;
    }
    .rendered h1, .rendered h2, .rendered h3 { line-height: 1.2; }
    .rendered h1 { font-size: 30px; margin-top: 0; }
    .rendered h2 { font-size: 24px; margin-top: 28px; }
    .rendered h3 { font-size: 18px; margin-top: 22px; }
    .rendered code {
      background: #11192d;
      border: 1px solid #22304b;
      border-radius: 6px;
      padding: 2px 6px;
    }
    .rendered pre {
      background: #0d1424;
      border: 1px solid #21304c;
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
    }
    .rendered blockquote {
      margin: 18px 0;
      padding: 8px 16px;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      background: rgba(124, 196, 255, 0.06);
      border-radius: 0 10px 10px 0;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--panel);
    }
    .sidebar-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
    }
    .search {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .atoms {
      overflow: auto;
      min-height: 0;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .atom {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: #10182a;
      cursor: pointer;
    }
    .atom:hover, .atom.active { border-color: var(--accent); background: #101d34; }
    .atom-title { font-size: 13px; font-weight: 700; line-height: 1.35; }
    .atom-question { font-size: 11px; color: var(--muted); margin-top: 6px; text-transform: uppercase; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chip {
      background: var(--chip);
      color: #c6d5e8;
      border: 1px solid #2a395b;
      border-radius: 999px;
      font-size: 11px;
      padding: 3px 8px;
      white-space: nowrap;
    }
    .empty { color: var(--muted); padding: 12px; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="main">
      <div class="topbar">
        <div>
          <div class="title">Conversador APOS — renderer</div>
          <div class="meta">Markdown renderizado al centro · átomos a la derecha</div>
        </div>
        <div class="toolbar">
          <button id="renderBtn">Render</button>
          <button id="clearBtn">Clear</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="sourceText"># Bienvenido

Esta interfaz sirve para dos cosas:

1. **Renderizar** bien el texto/markdown entregado.
2. **Leer átomos** desde el sidebar derecho.

Haz click en un átomo para abrirlo aquí.
</textarea>
        <div class="rendered">
          <article class="content" id="renderTarget"></article>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar-head">
        <div>
          <div class="title">Átomos</div>
          <div class="meta" id="atomsMeta">Cargando…</div>
        </div>
        <input id="atomSearch" class="search" placeholder="Buscar por título, tag o id…" />
      </div>
      <div class="atoms" id="atomsList"></div>
    </aside>
  </div>

  <script>
    const sourceText = document.getElementById('sourceText');
    const renderTarget = document.getElementById('renderTarget');
    const renderBtn = document.getElementById('renderBtn');
    const clearBtn = document.getElementById('clearBtn');
    const atomSearch = document.getElementById('atomSearch');
    const atomsList = document.getElementById('atomsList');
    const atomsMeta = document.getElementById('atomsMeta');

    let atoms = [];
    let filteredAtoms = [];
    let activeAtomId = null;

    marked.setOptions({ breaks: true, gfm: true });

    function renderMarkdown(text) {
      renderTarget.innerHTML = marked.parse(text || '');
    }

    function atomToMarkdown(atom) {
      return `# ${atom.title}\n\n` +
        `- **ID:** \`${atom.id}\`\n` +
        `- **Pregunta:** \`${atom.question || '-'}\`\n` +
        `- **Path:** \`${atom.path}\`\n\n` +
        `## Respuesta\n\n${atom.answer || '_Sin respuesta extraída_'}\n\n` +
        `## Tags\n\n${(atom.tags || []).map(t => `- \`${t}\``).join('\n') || '_Sin tags_'}\n\n` +
        `## Procedencia\n\n${atom.provenance || atom.provenance_field || '_Sin procedencia_'}\n`;
    }

    function renderAtoms() {
      atomsList.innerHTML = '';
      if (!filteredAtoms.length) {
        atomsList.innerHTML = '<div class="empty">No hay resultados.</div>';
        return;
      }
      for (const atom of filteredAtoms) {
        const el = document.createElement('div');
        el.className = 'atom' + (atom.id === activeAtomId ? ' active' : '');
        el.innerHTML = `
          <div class="atom-title">${escapeHtml(atom.title)}</div>
          <div class="atom-question">${escapeHtml(atom.question || '')}</div>
          <div class="chips">${(atom.tags || []).slice(0,4).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('')}</div>
        `;
        el.onclick = () => {
          activeAtomId = atom.id;
          sourceText.value = atomToMarkdown(atom);
          renderMarkdown(sourceText.value);
          renderAtoms();
        };
        atomsList.appendChild(el);
      }
    }

    function applyFilter() {
      const q = atomSearch.value.trim().toLowerCase();
      if (!q) {
        filteredAtoms = atoms;
      } else {
        filteredAtoms = atoms.filter(a => {
          const hay = [a.id, a.title, ...(a.tags || []), a.path, a.answer].join(' ').toLowerCase();
          return hay.includes(q);
        });
      }
      atomsMeta.textContent = `${filteredAtoms.length} / ${atoms.length} átomos`;
      renderAtoms();
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadAtoms() {
      try {
        const res = await fetch('./atoms.json');
        const data = await res.json();
        atoms = data.atoms || [];
        filteredAtoms = atoms;
        atomsMeta.textContent = `${atoms.length} átomos cargados`;
        renderAtoms();
      } catch (err) {
        atomsMeta.textContent = 'No se pudo cargar atoms.json';
        atomsList.innerHTML = `<div class="empty">${escapeHtml(err.message || err)}</div>`;
      }
    }

    renderBtn.onclick = () => renderMarkdown(sourceText.value);
    clearBtn.onclick = () => {
      sourceText.value = '';
      renderMarkdown('');
    };
    atomSearch.oninput = applyFilter;

    renderMarkdown(sourceText.value);
    loadAtoms();
  </script>
</body>
</html>
