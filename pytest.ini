[pytest]
testpaths = tests
norecursedirs = knowledge tests/knowledge .git runs desk
python_files = test_*.py
asyncio_default_fixture_loop_scope = function
markers =
    llm: requiere un LLM real (Gemini via Vertex ADC / API key). Se salta si no hay credenciales o SKIP_LLM_TESTS=1.
    simulation: conversacion completa agente-vs-usuario-simulado + juez LLM (lenta, usa red).
    ui: requiere Playwright + Chromium.
    known_gap: documenta un defecto conocido del runtime (xfail estricto: al arreglarse, el test exige quitar la marca).
filterwarnings =
    ignore::DeprecationWarning:google.*
    ignore:.*BaseAgentConfig is deprecated.*:DeprecationWarning
