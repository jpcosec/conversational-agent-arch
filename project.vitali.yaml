# Configuración del negocio: Vitali Suites (senior-living, ventas/agendamiento).
#
# Doctrina: una KB = un negocio. Este archivo define QUÉ negocio corre el
# runtime. Para servir Vitali: PROJECT_CONFIG=project.vitali.yaml
#
# Tools: registrar_lead y crear_visita persisten en SQL (leads, visitas) en
# estado "solicitada"; el equipo comercial confirma la hora. Kommo, Google
# Calendar y Gmail siguen fuera de este runtime.

project:
  name: "Vitali"
  slug: vitali

  # Clave canonica de identidad de persona (decision del owner): el telefono
  # unifica al mismo usuario entre canales (whatsapp/web/ui); el external_id
  # por canal queda como alias.
  identity_key: phone

  # KB del negocio (formato runtime, 11 tipos). Se edita por comandos SLDB
  # sobre knowledge_vitali/.sldb (no hay generador intermedio).
  kb_root: knowledge_vitali
  test_kb_root: tests/knowledge

  chat_db: runs/ui-chat-vitali.sqlite
  profiling_db: runs/ui-chat-vitali.sqlite

  model: gemini-2.5-flash

  # Mensaje al lead cuando el policy gate rechaza el borrador (voz de Vitali).
  gate_handoff_message: "Déjame confirmar ese punto con el equipo comercial para no darte un dato equivocado. Te respondo por este mismo medio a la brevedad."

  # Tools del negocio: wrappers semanticos sobre las tablas planas
  # ``leads`` y ``visitas`` (kb_agent/models_sql/leads.py). El schema que ve
  # el LLM vive en la KB (ToolAtom tool-vitali-registrar-lead / -crear-visita).
  tools:
    registrar_lead: kb_agent.tools.leads:registrar_lead
    crear_visita: kb_agent.tools.visitas:crear_visita

  server:
    host: 127.0.0.1
    port: 8000

  ui:
    runtime_title: "Auditable Agent Runtime"
    kb_label: "Vitali · KB"
    input_placeholder: "Escribe tu mensaje..."
    greeting: >-
      Hola. ¿Para quién estás buscando la propiedad, para un familiar o para ti?

  tuning:
    max_bundle_size: 12
    history_limit: 6
    router_max_results: 10
    tool_timeout_ms: 15000
    # Cierre de conversacion por inactividad (segundos). 6h.
    conversation_idle_ttl_s: 21600

  # Infra de despliegue: app y volumen propios, separados de Antonia.
  deploy:
    modal_app_name: vitali-runtime
    gcp_secret_name: kb-agent-runtime-gcp
    twilio_secret_name: null
    min_containers: 1
    serve_timeout_s: 600
