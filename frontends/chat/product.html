<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Chat</title>
<link rel="stylesheet" href="/static/theme.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
/* Chat de PRODUCTO: lo que veria un cliente. Sin inspector, sin badges de
   runtime, sin vocabulario tecnico. Movil primero -- el canal real de Vitali
   es el telefono -- y en desktop la conversacion se centra en una columna. */
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-page);color:var(--text);font-family:var(--font-sans);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.pc-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-accent);background:var(--bg-panel);flex-shrink:0}
.pc-avatar{width:34px;height:34px;border-radius:50%;background:rgba(212,165,116,.15);border:1px solid var(--border-accent);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pc-name{font-size:15px;font-weight:600;line-height:1.2}
.pc-sub{font-size:11px;color:var(--text-muted)}
.pc-actions{margin-left:auto}
.pc-new{font-size:11px;padding:7px 11px;border-radius:9px;border:1px solid var(--border-accent);color:var(--accent);background:transparent;cursor:pointer;font-family:var(--font-sans)}
.pc-new:hover{background:rgba(212,165,116,.1)}
.pc-scroll{flex:1;overflow-y:auto;padding:18px 14px 8px}
.pc-thread{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.5;word-wrap:break-word}
.msg.bot{align-self:flex-start;background:var(--bg-panel);border:1px solid var(--border-accent);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:rgba(212,165,116,.16);border:1px solid var(--border-accent);border-bottom-right-radius:5px}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}.msg strong{font-weight:600}
.typing{align-self:flex-start;display:flex;gap:4px;padding:13px 15px;background:var(--bg-panel);border:1px solid var(--border-accent);border-radius:16px;border-bottom-left-radius:5px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.45;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.pc-bar{flex-shrink:0;border-top:1px solid var(--border-accent);background:var(--bg-panel);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.pc-bar-inner{max-width:640px;margin:0 auto;display:flex;gap:9px;align-items:flex-end}
.pc-input{flex:1;resize:none;background:var(--bg-page);border:1px solid var(--border-accent);border-radius:19px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:16px;line-height:1.4;max-height:120px}
.pc-input:focus{outline:none;border-color:var(--accent)}
.pc-send{width:42px;height:42px;border-radius:50%;border:none;background:var(--accent);color:#1a1206;font-size:17px;cursor:pointer;flex-shrink:0}
.pc-send:disabled{opacity:.45;cursor:not-allowed}
.gate{position:fixed;inset:0;background:rgba(6,6,10,.94);display:flex;align-items:center;justify-content:center;padding:22px;z-index:40}
.gate-box{width:100%;max-width:380px;background:var(--bg-panel);border:1px solid var(--border-accent);border-radius:18px;padding:22px}
.gate-box h1{font-size:19px;font-weight:600;margin-bottom:6px}
.gate-box p{font-size:13px;color:var(--text-muted);margin-bottom:16px;line-height:1.5}
.gate-box label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px}
.gate-box input{width:100%;background:var(--bg-page);border:1px solid var(--border-accent);border-radius:10px;padding:11px 13px;color:var(--text);font-family:inherit;font-size:16px;margin-bottom:13px}
.gate-box input:focus{outline:none;border-color:var(--accent)}
.gate-go{width:100%;padding:12px;border-radius:11px;border:none;background:var(--accent);color:#1a1206;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.gate-skip{width:100%;margin-top:9px;padding:10px;border-radius:11px;border:1px solid var(--border-accent);background:transparent;color:var(--text-muted);font-size:13px;cursor:pointer;font-family:inherit}
@media(min-width:700px){.pc-scroll{padding:24px 20px 10px}}</style>
</head><body>

<div class="gate" id="gate" data-testid="pc-gate">
  <div class="gate-box">
    <h1 id="gateTitle">Hola</h1>
    <p id="gateText">Déjanos tu nombre y teléfono para que el equipo pueda retomar la conversación contigo. Es opcional.</p>
    <label for="gName">Nombre</label>
    <input id="gName" data-testid="pc-name" type="text" autocomplete="name" placeholder="Tu nombre"/>
    <label for="gPhone">Teléfono</label>
    <input id="gPhone" data-testid="pc-phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+56 9 1234 5678"/>
    <button class="gate-go" id="gateGo" data-testid="pc-start">Empezar</button>
    <button class="gate-skip" id="gateSkip" data-testid="pc-skip">Prefiero no dejarlos</button>
  </div>
</div>

<header class="pc-top">
  <div class="pc-avatar">💬</div>
  <div><div class="pc-name" id="bizName" data-testid="pc-brand">Agente</div><div class="pc-sub" id="bizSub">en línea</div></div>
  <div class="pc-actions"><button class="pc-new" id="pcNew" data-testid="pc-new-session" type="button">Nueva conversación</button></div>
</header>

<div class="pc-scroll" id="scroll"><div class="pc-thread" id="thread" data-testid="pc-thread"></div></div>

<div class="pc-bar"><div class="pc-bar-inner">
  <textarea class="pc-input" id="input" data-testid="pc-input" rows="1" placeholder="Escribe tu mensaje..."></textarea>
  <button class="pc-send" id="send" data-testid="pc-send" type="submit">➤</button>
</div></div>

<script>
var cfg={},sessionId=localStorage.getItem('pc_session')||null,
    contact={nombre:localStorage.getItem('pc_nombre')||'',phone:localStorage.getItem('pc_phone')||''},
    busy=false;
var esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
var thread=document.getElementById('thread'),scroll=document.getElementById('scroll'),
    input=document.getElementById('input'),send=document.getElementById('send'),gate=document.getElementById('gate');
marked.setOptions({gfm:true,breaks:true});
function toBottom(){scroll.scrollTop=scroll.scrollHeight}
function bubble(role,text){var d=document.createElement('div');d.className='msg '+(role==='me'?'me':'bot');d.setAttribute('data-testid','pc-msg-'+(role==='me'?'me':'bot'));d.innerHTML=role==='me'?esc(text):marked.parse(text||'');thread.appendChild(d);toBottom();return d}
function typing(on){var t=document.getElementById('typing');if(on){if(t)return;var d=document.createElement('div');d.className='typing';d.id='typing';d.setAttribute('data-testid','pc-typing');d.innerHTML='<i></i><i></i><i></i>';thread.appendChild(d);toBottom()}else if(t)t.remove()}
function greet(){thread.innerHTML='';bubble('bot',cfg.greeting||('Hola, soy el asistente de '+(cfg.name||'la empresa')+'. ¿En qué te ayudo?'))}
async function sendMsg(){
  var m=input.value.trim();if(!m||busy)return;
  busy=true;send.disabled=true;input.value='';input.style.height='auto';
  bubble('me',m);typing(true);
  try{
    var body={message:m,session_id:sessionId};
    if(contact.phone)body.phone=contact.phone;
    if(contact.nombre)body.nombre=contact.nombre;
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    sessionId=d.session_id;localStorage.setItem('pc_session',sessionId);
    typing(false);bubble('bot',(d.turn&&d.turn.assistant_message)||'…');
  }catch(e){typing(false);bubble('bot','No pude responder en este momento. ¿Lo intentamos de nuevo?')}
  finally{busy=false;send.disabled=false;input.focus()}
}
function newConversation(){localStorage.removeItem('pc_session');sessionId=null;greet();input.focus()}
document.getElementById('pcNew').onclick=newConversation;
send.onclick=sendMsg;
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});
function closeGate(save){
  if(save){contact.nombre=document.getElementById('gName').value.trim();contact.phone=document.getElementById('gPhone').value.trim();
    localStorage.setItem('pc_nombre',contact.nombre);localStorage.setItem('pc_phone',contact.phone)}
  localStorage.setItem('pc_gate_done','1');gate.style.display='none';input.focus();
}
document.getElementById('gateGo').onclick=function(){closeGate(true)};
document.getElementById('gateSkip').onclick=function(){closeGate(false)};
(async function(){
  try{cfg=await fetch('/api/config').then(function(r){return r.json()})}catch(e){}
  document.getElementById('bizName').textContent=cfg.name||'Agente';
  document.title=cfg.name||'Chat';
  if(cfg.input_placeholder)input.placeholder=cfg.input_placeholder;
  document.getElementById('gateTitle').textContent='Hola, soy '+(cfg.name||'el asistente');
  greet();
  if(localStorage.getItem('pc_gate_done')){gate.style.display='none'}
  else{document.getElementById('gName').value=contact.nombre;document.getElementById('gPhone').value=contact.phone}
})();
</script>
</body></html>
