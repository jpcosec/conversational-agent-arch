<style>
/* Paleta de chat sin celestes (pedido del usuario).
   theme.css define los paneles en navy (--bg-panel #0d1526, --bg-panel-solid
   #111a2e, --bg-panel-elevated #16223a, --bg-panel-strong #1c2b45) y chat los
   consume via su config de Tailwind, por eso las burbujas, el avatar y los
   badges se veian azulados. /flow usa una escala DARK NEUTRAL
   (rgba(18,18,26) -> rgba(10,10,15)); aca se replica esa escala, acotada a
   esta pagina para no alterar mindmap ni users. */
:root{
  --bg-panel: #0f0f16;
  --bg-panel-solid: #12121a;
  --bg-panel-elevated: #16161f;
  --bg-panel-strong: #1c1c26;
}
</style>
<style>.glow-active{box-shadow:0 0 15px rgba(212,165,116,.2),inset 0 0 10px rgba(212,165,116,.1);border-color:rgba(212,165,116,.5)}.pulse-dot{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.custom-scrollbar::-webkit-scrollbar{width:6px}.custom-scrollbar::-webkit-scrollbar-track{background:transparent}.custom-scrollbar::-webkit-scrollbar-thumb{background-color:rgba(245,240,232,.1);border-radius:10px}.msym{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr}.prose-chat p{margin-bottom:.6rem}.prose-chat h1,.prose-chat h2,.prose-chat h3{line-height:1.2;margin:.4rem 0}.prose-chat code{background:var(--bg-panel-solid);border:1px solid var(--border-strong);padding:1px 5px;border-radius:6px;font-family:'JetBrains Mono';font-size:.85em}.prose-chat pre{overflow:auto;background:var(--bg-panel-solid);border:1px solid var(--border-strong);padding:10px;border-radius:10px}.atom-link{cursor:pointer;color:var(--accent-hover);border:1px solid var(--border-accent);background:rgba(212,165,116,.08);border-radius:999px;padding:1px 7px;font-family:'JetBrains Mono';font-size:12px;text-decoration:none}.fam-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:.06em;border:1px solid;margin-right:4px}/* Misma geometria y tipografia que .ficha de /users (border2, radio 12, padding 12, mono 9px en el id), pero conservando un tinte de familia en el fondo: el color de la card codifica a que familia pertenece el documento. */.ctx-card{cursor:pointer;transition:all .15s;border:1px solid var(--border-strong);border-radius:12px;padding:12px;margin-bottom:8px}.ctx-card .ctx-title{font-size:14px;font-weight:600;line-height:1.2}.ctx-card .ctx-id{font-family:'JetBrains Mono';font-size:9px;margin-top:4px}.ctx-card .ctx-fam{margin-left:auto;font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:.08em;border:1px solid;border-radius:6px;padding:2px 6px;flex-shrink:0}.ctx-card:hover{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent)}.ctx-card:hover .ctx-hint{opacity:1}.ctx-hint{opacity:0;font-size:9px;color:rgba(245,240,232,.35);transition:.15s}
.agent-row{border:1px solid rgba(212,165,116,.08);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s}.agent-row:hover{border-color:rgba(212,165,116,.25);background:rgba(212,165,116,.04)}.agent-row .expand-icon{transition:transform .2s;font-size:14px}.agent-row.open .expand-icon{transform:rotate(90deg)}.family-group{margin-bottom:10px}.family-group .fg-header{font-family:'JetBrains Mono';font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.7;margin-bottom:3px}
/* Sidebar: mismo lenguaje visual que frontends/flow_editor/index.html
   (.sidebar/.brand/.palette-label/.palette-item) y frontends/profiling/index.html
   (.col-left/.user-chip) -- ancho 280px, fondo degradado y borde dorado via
   los tokens de /static/theme.css (--bg-panel2/--border-accent), no rgba
   hardcodeado nuevo. Antes el chat usaba solo utilidades Tailwind
   (bg-surface-container-low, border-white/5) que no calzaban con esos dos.*/
.chat-sidebar{width:280px;min-width:280px;background:var(--bg-panel2);border-right:1px solid var(--border-accent)}
.sidebar-block{border:1px solid var(--border-accent);border-radius:10px;padding:12px;background:rgba(18,18,26,.8);transition:var(--transition)}
.sidebar-block:hover{border-color:var(--accent-hover)}
.sidebar-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}</style>

      <button id="send" data-testid="chat-send" class="px-5 rounded-lg bg-secondary-container text-on-secondary-container font-semibold hover:brightness-110 transition disabled:opacity-50 disabled:cursor-wait flex items-center gap-2">

<script>
(function(){var p=location.pathname.replace(/\/$/,'')||'/';document.querySelectorAll('#appNav a').forEach(function(a){var h=a.getAttribute('href').replace(/\/$/,'')||'/';var ac=h===p;a.classList.toggle('active',ac);if(ac)a.setAttribute('data-active','true');else a.removeAttribute('data-active')});Promise.all([fetch('/api/config').then(function(r){return r.json()}).catch(function(){return{}}),fetch('/api/health').then(function(r){return r.json()}).catch(function(){return{}})]).then(function(r){var c=r[0]||{},h=r[1]||{},b=document.getElementById('appBrand'),kb=document.getElementById('kbLabel'),hl=document.getElementById('healthLabel'),ci=document.querySelector('[data-testid="chat-input"]');if(b)b.textContent=c.name||c.runtime_title||'Agente';if(kb)kb.textContent=c.kb_label||c.name||'KB';if(hl)hl.textContent=h.status||'unknown';if(ci)ci.placeholder=c.input_placeholder||'Escribe tu mensaje...';var lm={chat:document.querySelector('[data-testid="nav-chat"]'),flow:document.querySelector('[data-testid="nav-flow"]'),mindmap:document.querySelector('[data-testid="nav-mindmap"]'),users:document.querySelector('[data-testid="nav-users"]')};var nl=c.nav_labels||{};if(lm.chat)lm.chat.textContent=nl.chat||'Chat';if(lm.flow)lm.flow.textContent=nl.flow||'Flow';if(lm.mindmap)lm.mindmap.textContent=nl.mindmap||'Mindmap';if(lm.users)lm.users.textContent=nl.users||'Users';
  // sidebar data
  var su=document.getElementById('sidebarUserId'),st=document.getElementById('sidebarTraits'),se=document.getElementById('sidebarEvents'),sc=document.getElementById('sidebarConvState'),sm=document.getElementById('sidebarModel'),sk=document.getElementById('sidebarKB'),sb=document.getElementById('sidebarBusiness'),sp=document.getElementById('sidebarPulse');
  if(su)su.textContent=c.name||'—';if(sm)sm.textContent='Modelo: '+(c.model||'—');if(sk)sk.textContent='KB: '+(c.kb_label||'—');if(sb)sb.textContent='Negocio: '+(c.name||'—');if(sp&&h.status){sp.innerHTML='<div class="w-2 h-2 rounded-full border-2 '+(h.status==='ok'?'border-emerald-500 bg-emerald-500/30':'border-outline-variant')+'"></div><span class="font-mono text-xs '+(h.status==='ok'?'text-emerald-400':'text-on-surface-variant')+'">'+(h.status==='ok'?'Online':'Offline')+'</span>'}})})();</script>

<script>
const messagesEl=document.getElementById('messages'),inputEl=document.getElementById('input'),sendBtn=document.getElementById('send'),inspectorEl=document.getElementById('inspectorBody'),modalBackdrop=document.getElementById('modalBackdrop'),modalTitle=document.getElementById('modalTitle'),modalBody=document.getElementById('modalBody'),modalClose=document.getElementById('modalClose');
let sessionId=localStorage.getItem('kb_chat_session')||null,turns=[],selectedTurnId=null,health={model:'—',status:'unknown'},cfg={};
const atomRegex=/\b(atom-[a-z0-9-]+)\b/g;marked.setOptions({gfm:true,breaks:true});
const esc=(s='')=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
const enhanceAtoms=(html)=>html.replace(atomRegex,'<a class="atom-link" data-atom="$1">$1</a>');
const atomIds=(ctx)=>(ctx?.atom_ids||[]);
function openModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modalBackdrop.classList.remove('hidden');modalBackdrop.classList.add('flex')}
function closeModal(){modalBackdrop.classList.add('hidden');modalBackdrop.classList.remove('flex')}

// domain pasa de #7fb3d5 (celeste) a un neutro calido: es la familia mas
// frecuente (43 de 71 documentos), asi domina sin tirar la paleta al azul
// y las otras familias siguen destacando.
const FAM_COLORS={self:'#7cba7c',domain:'#c9bda6',conversation:'#e6a85c',user:'#c97db9',gate:'#d46a8c'};
function familiaDe(atom){if(atom.family)return atom.family;const tags=atom.tags||[];for(const f of Object.keys(FAM_COLORS)){if(tags.some(t=>t.startsWith(f+':')))return f}return null}

function renderTurns(){
 messagesEl.innerHTML='<div class="absolute left-[38px] top-6 bottom-6 w-px bg-surface-container-highest z-0"></div>';
 turns.forEach(turn=>{const sel=turn.turn_id===selectedTurnId,g=sel?'glow-active':'border-white/5';const wrap=document.createElement('div');wrap.className='flex flex-col gap-4 relative z-10';
  if(turn.user_message){wrap.innerHTML+='<div class="flex gap-4"><div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center flex-shrink-0 border border-outline-variant mt-1"><span class="msym text-sm text-on-surface-variant">person</span></div><div class="flex-1 bg-surface-container-low border border-white/5 rounded-lg p-4 prose-chat text-on-surface/90">'+enhanceAtoms(marked.parse(turn.user_message))+'</div></div>'}
  var kind=turn.kind||'nl',kc=kind==='fallback'?'text-error':kind==='tool_call'?'text-tertiary':'text-secondary',na=atomIds(turn.context).length,nt=(turn.context?.include_tags||[]).length;
  var pulse=turn.pending?'<span class="font-mono text-xs '+kc+' flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-secondary pulse-dot"></span>Reasoning…</span>':'<span class="font-mono text-xs '+kc+' flex items-center gap-1"><span class="msym text-[14px]">bolt</span>'+esc(kind)+'</span>';
  wrap.innerHTML+='<div class="flex gap-4"><div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center flex-shrink-0 border border-secondary mt-1 shadow-[0_0_10px_rgba(5,102,217,0.3)]"><span class="msym text-sm text-on-secondary-container">smart_toy</span></div><div class="flex-1 bg-surface-container-high border rounded-lg p-4 cursor-pointer '+g+'" data-turn-id="'+turn.turn_id+'"><div class="prose-chat text-on-surface/95">'+enhanceAtoms(marked.parse(turn.assistant_message||''))+'</div><div class="mt-4 pt-3 border-t border-white/10 flex justify-between items-center"><div class="flex gap-3"><span class="font-mono text-xs text-primary flex items-center gap-1"><span class="msym text-[14px]">memory</span>'+esc(turn.flow_node||'ctx')+'</span><span class="font-mono text-xs text-tertiary flex items-center gap-1"><span class="msym text-[14px]">data_object</span>Atoms: '+na+'</span><span class="font-mono text-xs text-on-surface-variant flex items-center gap-1"><span class="msym text-[14px]">sell</span>'+nt+'</span></div>'+pulse+'</div></div></div>';messagesEl.appendChild(wrap)});messagesEl.scrollTop=messagesEl.scrollHeight}

function contextDiff(turn){const idx=turns.findIndex(t=>t.turn_id===turn.turn_id),prev=idx>0?turns[idx-1]:null;const cur=new Set(atomIds(turn.context)),before=new Set(prev?atomIds(prev.context):[]);const items=turn.context?.items||[];const titleOf=id=>(items.find(i=>i.atom_id===id)?.title)||id;return{retained:[...cur].filter(id=>before.has(id)),added:[...cur].filter(id=>!before.has(id)),removed:[...before].filter(id=>!cur.has(id)),titleOf,prevItems:(prev?.context?.items||[])}}

function renderInspector(turn){
 if(!turn){inspectorEl.innerHTML='<div class="text-on-surface-variant text-sm">Selecciona una respuesta del asistente para auditar su turno.</div>';return}
 const ctx=turn.context||{},kind=turn.kind||'nl',diff=contextDiff(turn),items=ctx.items||[];
 // agrupar atoms por familia
 const famGroups={};items.forEach(it=>{const f=familiaDe(it)||'domain';(famGroups[f]||=[]).push(it)});
 const famColor=f=>FAM_COLORS[f]||'#c9bda6';
 const motivoLine=it=>{const hasScore=typeof it.score==='number';const scoreTxt=hasScore?' · score '+it.score.toFixed(2):'';return '<div class="text-[10px] text-on-surface-variant/80 mt-1 leading-snug" data-testid="context-motivo-'+esc(it.atom_id)+'">'+esc(it.motivo||'—')+scoreTxt+'</div>'};
 const ctxByFam=Object.keys(famGroups).map(f=>'<div class="family-group"><div class="fg-header" style="color:'+famColor(f)+'">'+f+'</div>'+famGroups[f].map(it=>'<div class="ctx-card" style="background:'+famColor(f)+'14;border-color:'+famColor(f)+'40" data-testid="context-atom-'+esc(it.atom_id)+'" data-atom="'+esc(it.atom_id)+'"><div class="flex items-center gap-2"><span class="ctx-title text-on-surface">'+esc(it.title||it.atom_id)+'</span><span class="ctx-fam" style="color:'+famColor(f)+';border-color:'+famColor(f)+'59">'+esc(f)+'</span><span class="msym text-[14px] text-primary ctx-hint">open_in_new</span></div><div class="ctx-id text-on-surface-variant">'+esc(it.atom_id)+' · '+esc(it.role||'-')+(it.grounds_step?' · grounds step':'')+'</div>'+motivoLine(it)+'</div>').join('')+'</div>').join('');

 // Razonamiento: los 4 agentes REALES del pipeline, en orden de ejecución,
 // con datos reales de `turn.decisions` (lo que arma Orchestrator.handle_turn
 // -- ver kb_agent/orchestrator.py). Antes esta lista era hardcodeada con
 // nombres viejos (Ontologizador/Reflector) y descripciones inventadas.
 const dec=turn.decisions||{};
 const rBundle=(dec.ruteador&&dec.ruteador.bundle)||ctx.bundle||[];
 const motivoCounts=bundle=>{const c={piso:0,grounding:0,similitud:0,traits:0};bundle.forEach(b=>{const m=b.motivo||'';if(m.indexOf('piso de seguridad')>-1)c.piso++;if(m.indexOf('grounding')>-1)c.grounding++;if(m.indexOf('similitud')>-1)c.similitud++;if(m.indexOf('trait')>-1)c.traits++});return c};
 const mCounts=motivoCounts(rBundle);
 const ruteadorDesc=rBundle.length+' documentos · piso de seguridad '+mCounts.piso+' · grounding '+mCounts.grounding+' · similitud '+mCounts.similitud+' · traits '+mCounts.traits;
 const ruteadorDetail=rBundle.length?rBundle.map(b=>{const hasScore=typeof b.score==='number';return '<div class="text-[10px] font-mono border-t border-white/5 pt-1 mt-1"><span class="text-on-surface">'+esc(b.doc_id)+'</span> <span style="color:'+famColor(b.family||'domain')+'">· '+esc(b.family||'-')+'</span><div class="text-on-surface-variant/80">'+esc(b.motivo||'—')+(hasScore?' · score '+b.score.toFixed(2):'')+'</div></div>'}).join(''):'<div class="text-xs text-on-surface-variant">Sin bundle.</div>';

 const orq=dec.orquestador||{};
 const stepInfo=dec.step||{};
 const orqKind=orq.kind||kind;
 const orqDesc='kind: '+esc(orqKind)+' · '+(orq.reason?esc(orq.reason):'—');
 const vetoHtml=orq.step_target_vetado?'<div class="mt-2 text-[10px] font-mono text-error border border-error/40 rounded p-2 bg-error/5">Transición vetada: '+esc(orq.step_target_vetado)+' (no estaba en allowed_transitions del step activo -- violación atrapada por la guardia dura)</div>':'';
 const orqDetail='<div class="font-mono text-[10px] text-on-surface-variant">Step: '+esc(stepInfo.before||'—')+' → '+esc(stepInfo.after||'—')+'</div><div class="font-mono text-[10px] text-on-surface-variant mt-1">Allowed transitions: '+((stepInfo.allowed_transitions||[]).map(esc).join(', ')||'—')+'</div>'+vetoHtml;

 const conv=dec.conversador||{};
 const draftText=conv.draft||'';
 const finalText=turn.assistant_message||'';
 const replaced=!!(draftText&&finalText&&draftText!==finalText);
 const convDesc=replaced?'El Gate reemplazó el borrador por el mensaje de derivación':'Redactó: '+(orqKind==='tool_call'?'tool_call decidido':orqKind==='fallback'?'fallback':'NL');
 const convDetail='<div class="text-[10px] text-on-surface-variant font-mono uppercase tracking-wide mb-1">Borrador (pre-gate)</div><div class="text-xs text-on-surface/90 whitespace-pre-wrap">'+esc(draftText||'—')+'</div>'+(replaced?'<div class="text-[10px] text-on-surface-variant font-mono uppercase tracking-wide mt-2 mb-1">Texto final (post-gate)</div><div class="text-xs text-secondary whitespace-pre-wrap">'+esc(finalText)+'</div>':'');

 const gate=dec.gate||{};
 const gateSkipped=Object.prototype.hasOwnProperty.call(gate,'skipped');
 const gateDesc=gateSkipped?'omitido ('+esc(String(gate.skipped))+')':'approved: '+(gate.approved===true?'sí':gate.approved===false?'no':'—')+' · action: '+esc(gate.action||'—');
 const gateReasons=gate.reasons||[];
 const gateCriteria=gate.criterion_ids||[];
 const gateDetail=gateSkipped?'<div class="text-xs text-on-surface-variant">El Gate solo evalúa redacciones NL; este turno fue '+esc(String(gate.skipped))+'.</div>':('<div class="text-[10px] text-on-surface-variant font-mono uppercase tracking-wide mb-1">Reasons</div>'+(gateReasons.length?'<ul class="list-disc list-inside text-xs text-on-surface/90">'+gateReasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>':'<div class="text-xs text-on-surface-variant">—</div>')+'<div class="text-[10px] text-on-surface-variant font-mono uppercase tracking-wide mt-2 mb-1">Criterion ids</div>'+(gateCriteria.length?gateCriteria.map(c=>'<span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-surface-container-highest text-on-surface-variant mr-1">'+esc(c)+'</span>').join(''):'<div class="text-xs text-on-surface-variant">—</div>'));

 const traitsAfter=turn.traits_after||[];
 const profDesc=traitsAfter.length+' traits · corre después de responder la paciente, no bloquea la respuesta';
 const profDetail=traitsAfter.length?traitsAfter.map(t=>'<span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 mr-1">'+esc(t)+'</span>').join(''):'<div class="text-xs text-on-surface-variant">Sin traits nuevos en este turno.</div>';

 const agents=[
  {name:'Ruteador de contexto',icon:'🧭',desc:ruteadorDesc,detail:ruteadorDetail},
  {name:'Orquestador',icon:'🧠',desc:orqDesc,detail:orqDetail},
  {name:'Conversador',icon:'💬',desc:convDesc,detail:convDetail},
  {name:'Gate',icon:'🛡️',desc:gateDesc,detail:gateDetail},
  {name:'Perfilador · async post-turno',icon:'👤',desc:profDesc,detail:profDetail}
 ];
 const agentHtml=agents.map(a=>'<div class="agent-row" data-testid="agent-row" onclick="this.classList.toggle(\'open\');this.querySelector(\'.agent-detail\').classList.toggle(\'hidden\')"><div class="flex items-center gap-2"><span>'+a.icon+'</span><span class="font-mono text-xs text-on-surface font-semibold">'+esc(a.name)+'</span><span class="expand-icon msym text-on-surface-variant ml-auto">chevron_right</span></div><div class="font-mono text-[10px] text-on-surface-variant mt-1">'+a.desc+'</div><div class="agent-detail hidden mt-2 border-t border-white/5 pt-2">'+a.detail+'</div></div>');

 inspectorEl.innerHTML = [
  '<div class="bg-surface-container-low border border-white/5 rounded-lg p-4" data-testid="inspector-summary">',
  '  <h4 class="font-mono text-xs text-on-surface-variant uppercase tracking-wider mb-3 flex items-center gap-2"><span class="msym text-[16px]">receipt_long</span>Summary</h4>',
  '  <div class="grid grid-cols-2 gap-3">',
  '    <div><p class="text-xs text-on-surface-variant">Usuario</p><p class="font-mono text-sm text-on-surface">'+(turn.user_message?'Atendido':'\u2014')+'</p></div>',
  // Los parentesis alrededor del lookup son necesarios: + liga mas fuerte que
  // ||, asi que sin ellos la expresion era ('...text-sm '+color) || (resto) y,
  // al ser truthy la izquierda, se descartaba el '">'+kind+'</p></div>' --el <p>
  // quedaba sin cerrar y la celda Intent se comia a la de Tool.
  '    <div><p class="text-xs text-on-surface-variant">Intent</p><p class="font-mono text-sm '+({'fallback':'text-error','tool_call':'text-tertiary','nl':'text-secondary'}[kind]||'text-on-surface')+'">'+esc(kind)+'</p></div>',
  '    <div><p class="text-xs text-on-surface-variant">Tool</p><p class="font-mono text-sm text-on-surface">'+(turn.system_turn?esc(turn.system_turn.tool):'\u2014')+'</p></div>',
  '    <div><p class="text-xs text-on-surface-variant">Step</p><p class="font-mono text-sm text-on-surface">'+esc(turn.flow_node||'\u2014')+'</p></div>',
  '  </div>',
  '</div>',
  '<div class="bg-surface-container-low border border-white/5 rounded-lg p-4" data-testid="inspector-context">',
  '  <h4 class="font-mono text-xs text-on-surface-variant uppercase tracking-wider mb-3 flex items-center gap-2"><span class="msym text-[16px]">layers</span>Contexto ('+(ctx.scenario||'\u2014')+')</h4>',
  '  <div class="text-xs text-on-surface-variant mb-4">'+items.length+' atoms en contexto'+(ctx.is_empty?' \u00b7 <span class="text-error">vac\u00edo</span>':'')+'. Retenidos: '+diff.retained.length+' \u00b7 Nuevos: '+diff.added.length+' \u00b7 Desertados: '+diff.removed.length+'.</div>',
  '  '+ctxByFam,
  '</div>',
  '<div class="bg-surface-container-low border border-white/5 rounded-lg p-4" data-testid="inspector-reasoning">',
  '  <h4 class="font-mono text-xs text-on-surface-variant uppercase tracking-wider mb-3 flex items-center gap-2"><span class="msym text-[16px]">psychology</span>Razonamiento</h4>',
  '  <div class="flex flex-col gap-2">'+agentHtml.join('')+'</div>',
  '</div>'
].join('\n');
}

function selectTurn(turnId){selectedTurnId=turnId;renderTurns();renderInspector(turns.find(t=>t.turn_id===turnId))}
async function openAtomModal(atomId){try{var r=await fetch('/api/atom/'+atomId);if(!r.ok){openModal('Atom','<div class="text-on-surface-variant">No se pudo cargar el atom.</div>');return}var a=await r.json();openModal(a.atom_id,'<div class="flex flex-col gap-3"><div><span class="text-on-surface-variant">Título:</span> '+esc(a.title||'')+'</div><div><span class="text-on-surface-variant">Familia:</span> <code style="font-family:JetBrains Mono">'+(a.tags?Object.keys(FAM_COLORS).find(k=>a.tags.some(t=>t.startsWith(k+':')))||'—':'—')+'</code></div><div><span class="text-on-surface-variant">Path:</span> <code>'+esc(a.path||'')+'</code></div><div><span class="text-on-surface-variant">Tags:</span><div class="flex flex-wrap gap-1 mt-1">'+((a.tags||[]).map(t=>'<span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-surface-container-highest text-on-surface-variant">'+esc(t)+'</span>').join(''))+'</div></div><div class="border-t border-white/10 pt-3">'+marked.parse(a.body||'_Sin contenido_')+'</div></div>')}catch(e){openModal('Atom','<div class="text-error">'+esc(e.message||e)+'</div>')}}

async function sendMessage(){var m=inputEl.value.trim();if(!m)return;inputEl.value='';sendBtn.disabled=true;var ghostId='ghost-'+Date.now();turns.push({turn_id:ghostId,user_message:m,assistant_message:'_Compilando contexto…_',context:{atom_ids:[],include_tags:[],items:[]},pending:true});selectedTurnId=ghostId;renderTurns();var t0=performance.now();try{var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,session_id:sessionId})});var d=await r.json();sessionId=d.session_id;localStorage.setItem('kb_chat_session',sessionId);document.getElementById('sessionBadge').textContent='ID: '+sessionId;d.turn.latency_ms=Math.round(performance.now()-t0);turns=turns.filter(t=>t.turn_id!==ghostId);turns.push(d.turn);selectTurn(d.turn.turn_id);updateSidebarConversation(d.turn)}catch(e){turns=turns.filter(t=>t.turn_id!==ghostId);turns.push({turn_id:'err-'+Date.now(),user_message:m,assistant_message:'**Error:** '+(e.message||e),kind:'fallback',context:{atom_ids:[],include_tags:[],items:[]}});renderTurns()}finally{sendBtn.disabled=false;inputEl.focus()}}

function updateSidebarConversation(turn){var sc=document.getElementById('sidebarConvState');if(sc)sc.textContent='Último: '+esc(turn.flow_node||'nl')+' · '+esc(turn.kind||'—')+((turn.traits_after||[]).length?' · +traits':'');var su=document.getElementById('sidebarUserId');if(su)su.textContent=turn.external_id||health.model||'—';var st=document.getElementById('sidebarTraits');if(st&&turn.traits_after?.length)st.innerHTML=turn.traits_after.map(t=>'<span class="font-mono text-[9px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">'+esc(t)+'</span>').join('');var se=document.getElementById('sidebarEvents');if(se)se.textContent=turn.traits_after?.length+' traits · 1 turno'}

sendBtn.onclick=sendMessage;inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
modalClose.onclick=closeModal;modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});
document.getElementById('inspectorClear').onclick=()=>{selectedTurnId=null;renderTurns();renderInspector(null)};
document.addEventListener('click',e=>{
 var card=e.target.closest('[data-turn-id]');if(card&&card.getAttribute('data-turn-id')){selectTurn(card.getAttribute('data-turn-id'));return}
 var atom=e.target.closest('[data-open-atom]');if(atom){openAtomModal(atom.getAttribute('data-open-atom'));return}
 var ref=e.target.closest('[data-atom]');if(ref){openAtomModal(ref.getAttribute('data-atom'));return}});

(async function(){try{cfg=await fetch('/api/config').then(r=>r.json())}catch(e){}try{health=await fetch('/api/health').then(r=>r.json())}catch(e){}
 var bizName=cfg.name||'Agente';document.getElementById('sessionTitle').textContent='Session: '+bizName;if(sessionId)document.getElementById('sessionBadge').textContent='ID: '+sessionId;
 turns.push({turn_id:'turn-000',user_message:'',assistant_message:cfg.greeting||'Hola. Soy el asistente de **'+bizName+'**. ¿En qué te puedo ayudar?',kind:'nl',context:{atom_ids:[],include_tags:[],items:[],tools:[],grounding_atoms:[]}});
 var qs=new URLSearchParams(location.search),loadSession=qs.get('session'),loadUser=qs.get('user');
 if(loadSession||loadUser){try{
  var histUrl=loadSession?('/api/history?session_id='+encodeURIComponent(loadSession)):('/api/history?external_id='+encodeURIComponent(loadUser));
  var hist=await fetch(histUrl).then(r=>r.json());
  var msgs=hist.messages||[],turnRows=hist.turns||[];
  // Empareja mensajes user/assistant en turnos y, si hay rastro real en
  // `turns` (siempre que la conversacion se cargue por ?session=), le pega
  // el rastro (bundle/decision/gate/draft) al turno correspondiente por
  // orden cronologico -- ambas listas vienen ordenadas asc por created_at,
  // y cada turno real persiste exactamente 1 fila user + 1 fila assistant.
  var pairedTurns=[],pending=null;
  msgs.forEach(function(m,i){
   if(m.role==='user'){pending={turn_id:'h'+i,user_message:m.content,assistant_message:'',kind:'nl',context:{atom_ids:[],include_tags:[],items:[],tools:[],grounding_atoms:[]},decisions:{}};pairedTurns.push(pending)}
   else if(m.role==='assistant'){if(pending&&!pending.assistant_message){pending.assistant_message=m.content}else{pending={turn_id:'h'+i,user_message:'',assistant_message:m.content,kind:'nl',context:{atom_ids:[],include_tags:[],items:[],tools:[],grounding_atoms:[]},decisions:{}};pairedTurns.push(pending)}}
   else{pending=null}
  });
  pairedTurns.forEach(function(t,idx){
   var row=turnRows[idx];if(!row)return;
   var bundle=row.bundle||[];
   var items=bundle.map(function(b){return {atom_id:b.doc_id,title:b.doc_id,role:b.family,family:b.family,score:b.score,motivo:b.motivo,tags:[],grounds_step:(b.motivo||'').indexOf('grounding')>-1}});
   t.context={atom_ids:bundle.map(function(b){return b.doc_id}),include_tags:[],items:items,tools:[],grounding_atoms:[],bundle:bundle,is_empty:bundle.length===0};
   t.kind=(row.decision&&row.decision.kind)||'nl';
   t.flow_node=row.step_after;
   t.decisions={
    step:{before:row.step_before,after:row.step_after,target:row.decision&&row.decision.step_target,allowed_transitions:[],missing_slots:[]},
    ruteador:{bundle:bundle,atoms:bundle.length,grounding_atoms:[],user_traits:[],is_empty:bundle.length===0},
    orquestador:{kind:t.kind,decision:row.decision,state_trace:[],reason:row.decision&&row.decision.reason,step_target_vetado:row.decision&&row.decision.step_target_vetado},
    conversador:{draft:row.draft},
    gate:row.gate||{approved:null,skipped:t.kind},
    tool:row.tool||{called:false}
   }
  });
  turns=turns.concat(pairedTurns);
  var titleSuffix=loadSession?('sesión '+loadSession):loadUser;
  document.getElementById('sessionTitle').textContent='Session: '+bizName+' · '+titleSuffix;
  if(loadSession){sessionId=null;document.getElementById('sessionBadge').textContent='ID: (histórico) '+loadSession}
 }catch(e){}}
 renderTurns()})();
</script>
