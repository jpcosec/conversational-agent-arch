<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<link rel="stylesheet" href="/static/theme.css">
</head><body class="page-chat">
<div id="appNavMount"><!-- topbar injectada por nav.js --></div>
<div class="app-main chat-layout">
 <!-- Sidebar de estado de negocio -->
 <aside class="sidebar chat-sidebar" data-testid="chat-sidebar">
   <div class="sidebar-block" data-testid="sidebar-lead">
     <h4 class="sidebar-label"><span class="chat-ico">🪪</span>Ficha del lead</h4>
     <div id="leadCard" data-testid="lead-card"><div class="empty-state empty-state-inline">Sin conversación todavía.</div></div>
   </div>
   <div class="sidebar-block" data-testid="sidebar-user">
     <h4 class="sidebar-label"><span class="chat-ico">👤</span>Persona</h4>
     <div id="sidebarUserId" class="chat-side-value">—</div>
     <div id="sidebarTraits" class="chips chat-side-traits"></div>
     <div id="sidebarEvents" class="chat-side-meta">0 eventos</div>
   </div>
   <div class="sidebar-block" data-testid="sidebar-conversation">
     <h4 class="sidebar-label"><span class="chat-ico">💬</span>Estado</h4>
     <div id="sidebarConvState" class="chat-side-value">Esperando mensaje…</div>
   </div>
   <div class="sidebar-block" data-testid="sidebar-agents">
     <h4 class="sidebar-label"><span class="chat-ico">⚙</span>Configuración</h4>
     <div id="sidebarModel" class="chat-side-meta">Modelo: —</div>
     <div id="sidebarKB" class="chat-side-meta">KB: —</div>
     <div id="sidebarBusiness" class="chat-side-meta">Negocio: —</div>
   </div>
   <div class="sidebar-block chat-pulse-block" data-testid="sidebar-pulse">
     <h4 class="sidebar-label"><span class="chat-ico">📡</span>Estado del servicio</h4>
     <div id="sidebarPulse" class="chat-pulse"><span class="chat-pulse-dot"></span><span class="chat-pulse-text">Sin conexión</span></div>
   </div>
 </aside>

 <!-- Timeline de la conversación -->
 <section class="chat-timeline">
   <header class="chat-head">
     <h2 class="chat-head-title"><span class="chat-ico chat-ico-accent">💬</span><span id="sessionTitle">Conversación</span></h2>
     <div class="chat-head-actions">
       <span id="sessionBadge" class="chip chip-muted">ID: —</span>
       <button type="button" id="newSession" data-testid="chat-new-session" class="btn btn-sm" title="Empieza una conversación nueva (sesión y ficha desde cero)">＋ Nueva conversación</button>
     </div>
   </header>
   <div id="flowStepper" data-testid="flow-stepper" class="chat-stepper hidden"></div>
   <div id="messages" class="chat-messages"></div>
   <div class="chat-compose">
     <textarea id="input" data-testid="chat-input" class="input" rows="2" placeholder="Escribe tu mensaje..."></textarea>
     <button type="submit" id="send" data-testid="chat-send" class="btn btn-primary">Enviar</button>
   </div>
 </section>

 <!-- Inspector del turno -->
 <section class="sidebar sidebar-right chat-inspector" data-testid="inspector">
   <header class="chat-inspector-head">
     <h3 class="chat-head-title">Inspector del turno</h3>
     <button type="button" id="inspectorClear" class="btn btn-icon btn-ghost" title="Cerrar inspector">✕</button>
   </header>
   <div id="inspectorBody" class="chat-inspector-body">
     <div class="empty-state"><span class="empty-state-icon">🔍</span>Selecciona una respuesta del agente para ver cómo se armó.</div>
   </div>
 </section>
</div>

<!-- Modal de documento -->
<div id="modalBackdrop" class="chat-modal-backdrop hidden" data-testid="atom-modal">
  <div class="chat-modal">
    <div class="chat-modal-head">
      <h4 id="modalTitle" class="chat-modal-title">Documento</h4>
      <button type="button" id="modalClose" class="btn btn-icon btn-ghost" title="Cerrar">✕</button>
    </div>
    <div id="modalBody" class="chat-modal-body prose-chat"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/glossary.js"></script>
<script src="/static/tooltip.js"></script>
<script src="/static/demo-tour.js"></script>
<script src="/static/chat.js"></script>
</body></html>
