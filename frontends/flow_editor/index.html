<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  *{margin:0;padding:0;box-sizing:border-box}

  /* ── Sidebar brand ── */

  .insp-input{

  .insp-input:focus{outline:none;border-color:#d4a574}
  textarea.insp-input{resize:vertical;min-height:70px;line-height:1.5}
  select.insp-input{cursor:pointer}
  .kind-badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:999px;
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;
  }

  /* ── Toolbar ── */
  .toolbar{
    position:absolute;top:14px;right:14px;z-index:10;
    display:flex;gap:8px;
  }
  .toolbar-btn{
    background:rgba(18,18,26,.85);
    border:1px solid rgba(212,165,116,.2);
    color:rgba(245,240,232,.6);
    padding:8px 14px;border-radius:8px;
    cursor:pointer;font-size:12px;
    font-family:'JetBrains Mono',monospace;
    transition:.2s;
    backdrop-filter:blur(8px);
  }
  .toolbar-btn:hover{
    color:#d4a574;border-color:#d4a574;
    background:rgba(18,18,26,.95);
  }
  .toolbar-btn.primary{
    background:#d4a574;color:#0a0a0f;border-color:#d4a574;
    font-weight:600;
  }
  .toolbar-btn.primary:hover{background:#c49560}

  /* ── React Flow overrides ── */
  .react-flow__background{background:#0a0a0f !important}
  .react-flow__controls button{
    background:rgba(18,18,26,.85) !important;
    border:1px solid rgba(212,165,116,.15) !important;
    color:rgba(245,240,232,.5) !important;
    fill:rgba(245,240,232,.5) !important;
  }
  .react-flow__controls button:hover{
    border-color:#d4a574 !important;
    color:#d4a574 !important;
    fill:#d4a574 !important;
  }
  .react-flow__minimap{background:rgba(10,10,15,.9) !important;border:1px solid rgba(212,165,116,.12) !important;border-radius:8px !important}
  .react-flow__controls{margin:14px !important}
  .react-flow__attribution{display:none !important}
  .react-flow__edge-path{stroke:rgba(212,165,116,.25);stroke-width:2}
  .react-flow__edge.selected .react-flow__edge-path{stroke:#d4a574;stroke-width:2.5}
</style>

    <nav class="app-nav" id="appNav">
      <a data-testid="nav-chat" href="/">Chat</a>
      <a data-testid="nav-flow" href="/flow">Flow</a>
      <a data-testid="nav-mindmap" href="/mindmap">Mindmap</a>
      <a data-testid="nav-users" href="/users">Users</a>
    </nav>
    <div class="app-topbar-meta">

      <span class="app-topbar-chip" id="healthLabel">—</span>

<div id="root"></div>
<script>
  (function () {
    var path = location.pathname.replace(/\/$/, '') || '/';
    document.querySelectorAll('#appNav a').forEach(function (a) {
      var href = a.getAttribute('href').replace(/\/$/, '') || '/';
      var active = href === path;
      a.classList.toggle('active', active);
      if (active) a.setAttribute('data-active', 'true');
      else a.removeAttribute('data-active');
    });
    Promise.all([
      fetch('/api/config').then(function (r) { return r.json(); }).catch(function () { return {}; }),
      fetch('/api/health').then(function (r) { return r.json(); }).catch(function () { return {}; }),
    ]).then(function (results) {
      var cfg = results[0] || {};
      var health = results[1] || {};
      var brand = document.getElementById('appBrand');
      var kb = document.getElementById('kbLabel');
      var healthLabel = document.getElementById('healthLabel');
      var navLabels = cfg.nav_labels || {};
      if (brand) brand.textContent = cfg.runtime_title || cfg.name || 'Agente';
      if (kb) kb.textContent = cfg.kb_label || cfg.name || 'KB';
      if (healthLabel) healthLabel.textContent = health.status || 'unknown';
      var linkMap = {
        chat: document.querySelector('[data-testid="nav-chat"]'),
        flow: document.querySelector('[data-testid="nav-flow"]'),
        mindmap: document.querySelector('[data-testid="nav-mindmap"]'),
        users: document.querySelector('[data-testid="nav-users"]'),
      };
      if (linkMap.chat) linkMap.chat.textContent = navLabels.chat || 'Chat';
      if (linkMap.flow) linkMap.flow.textContent = navLabels.flow || 'Flow';
      if (linkMap.mindmap) linkMap.mindmap.textContent = navLabels.mindmap || 'Mindmap';
      if (linkMap.users) linkMap.users.textContent = navLabels.users || 'Users';
    });
  })();
</script>

<script type="module">
import React, { useState, useCallback, useMemo, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import {
  ReactFlow,
  ReactFlowProvider,
  Background,
  Controls,
  MiniMap,
  useNodesState,
  useEdgesState,
  addEdge,
  Handle,
  Position,
  MarkerType,
  useReactFlow,
} from '@xyflow/react';
import htm from 'htm';
import dagre from 'dagre';
const html = htm.bind(React.createElement);

/* ── auto-layout con dagre (LR) ── */
function layoutGraph(nodes, edges) {
  const g = new dagre.graphlib.Graph();
  g.setDefaultEdgeLabel(() => ({}));
  g.setGraph({ rankdir: 'LR', nodesep: 45, ranksep: 110, marginx: 30, marginy: 30 });
  const W = 200, H = 64;
  nodes.forEach((n) => g.setNode(n.id, { width: W, height: H }));
  edges.forEach((e) => g.setEdge(e.source, e.target));
  dagre.layout(g);
  return nodes.map((n) => {
    const p = g.node(n.id);
    return { ...n, position: { x: p.x - W / 2, y: p.y - H / 2 } };
  });
}

/* ── Step KINDS: comportamiento del paso (fijo). El nombre es libre. ──
   Colores reusados de la paleta de familias (self/domain/conversation/user)
   que ya usan taxonomy/viz, para que un mismo color signifique lo mismo
   en todo el runtime. */
const STEP_KINDS = {
  interaccion_simple: { label: 'Interacción simple', dot: '#e6a85c', border: 'rgba(230,168,92,.5)', bg: 'rgba(230,168,92,.07)', icon: '💬' },   // conversation
  obtencion_datos:    { label: 'Obtención de datos', dot: '#c97db9', border: 'rgba(201,125,185,.5)', bg: 'rgba(201,125,185,.07)', icon: '📝' },   // user
  handout:            { label: 'Handout',            dot: '#7fb3d5', border: 'rgba(127,179,213,.5)', bg: 'rgba(127,179,213,.07)', icon: '🤝' },   // domain
  llamado_tool:       { label: 'Llamado a tool',     dot: '#7cba7c', border: 'rgba(124,186,124,.5)', bg: 'rgba(124,186,124,.07)', icon: '⚙️' },   // self
};

/* qué campos muestra el inspector según el kind */
const KIND_FIELDS = {
  interaccion_simple: ['instructions'],
  obtencion_datos:    ['instructions', 'required_slots'],
  handout:            ['instructions', 'handout_target'],
  llamado_tool:       ['instructions', 'tool_ref', 'tool_params'],
};

const PALETTE_ITEMS = Object.entries(STEP_KINDS).map(([kind, k]) => ({
  kind, label: k.label, color: k.dot, icon: k.icon,
}));

/* ── Step Node Component ── */
function StepNode({ data, selected }) {
  const c = STEP_KINDS[data.stepKind] || STEP_KINDS.interaccion_simple;
  return html`
    <div style=${{
      border: `2px solid ${selected ? c.border : 'rgba(212,165,116,.12)'}`,
      borderLeft: `4px solid ${c.border}`,
      background: c.bg,
      borderRadius: 12,
      padding: '10px 14px',
      minWidth: 190,
      cursor: 'pointer',
      transition: '.2s',
      boxShadow: selected ? '0 0 20px rgba(212,165,116,.12)' : 'none',
    }}>
      <${Handle} type="target" position=${Position.Left} style=${{ background: c.border, width: 8, height: 8, border: '2px solid #0a0a0f' }} />
      <div style=${{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 3 }}>
        <span style=${{ fontSize: 13 }}>${c.icon}</span>
        <span style=${{ fontSize: 13, fontWeight: 600, color: '#f5f0e8' }}>${data.label}</span>
      </div>
      <div style=${{
        fontSize: 9, fontFamily: "'JetBrains Mono',monospace", letterSpacing: '.08em',
        textTransform: 'uppercase', color: c.dot, opacity: .85,
      }}>
        ${c.label}
      </div>
      <${Handle} type="source" position=${Position.Right} style=${{ background: c.border, width: 8, height: 8, border: '2px solid #0a0a0f' }} />
    </div>
  `;
}

const nodeTypes = { step: StepNode };

/* ── Main App ── */
function App() {
  const [steps, setSteps] = useState({});
  const [selectedStepId, setSelectedStepId] = useState(null);
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const { fitView } = useReactFlow();

  /* carga flow.json y arma el grafo con dagre */
  React.useEffect(() => {
    fetch('/api/flow').then((r) => r.json()).then((flow) => {
      const stepMap = {};
      const tagToId = {};
      flow.nodes.forEach((s) => {
        stepMap[s.id] = s;
        (s.tags || []).forEach?.(() => {});
      });
      // construir tag->id para labels de aristas
      flow.nodes.forEach((s) => {
        if (s.step_tag) tagToId[s.step_tag] = s.id;
      });
      setSteps(stepMap);

      const rawNodes = flow.nodes.map((s) => ({
        id: s.id,
        type: 'step',
        position: { x: 0, y: 0 },
        data: {
          label: s.title.replace(/ —.*$/, '').slice(0, 28),
          stepKind: s.kind,
          stepId: s.id,
        },
      }));
      const rawEdges = flow.edges.map((e, i) => ({
        id: `e-${i}`,
        source: e.source,
        target: e.target,
        animated: true,
        style: { stroke: 'rgba(212,165,116,.3)', strokeWidth: 2 },
        markerEnd: { type: MarkerType.ArrowClosed, color: 'rgba(212,165,116,.5)' },
      }));

      setNodes(layoutGraph(rawNodes, rawEdges));
      setEdges(rawEdges);
      setTimeout(() => fitView({ padding: 0.15, duration: 400 }), 150);
    }).catch((err) => console.error('No se pudo cargar flow.json', err));
  }, [setNodes, setEdges, fitView]);

  const onConnect = useCallback((params) => {
    setEdges((eds) => addEdge({
      ...params,
      animated: true,
      style: { stroke: 'rgba(212,165,116,.3)', strokeWidth: 2 },
      markerEnd: { type: MarkerType.ArrowClosed, color: 'rgba(212,165,116,.5)' },
    }, eds));
  }, [setEdges]);

  const onNodeClick = useCallback((_, node) => {
    const stepId = node.data.stepId;
    setSelectedStepId(stepId === selectedStepId ? null : stepId);
  }, [selectedStepId]);

  const onPaneClick = useCallback(() => {
    setSelectedStepId(null);
  }, []);

  const selectedStep = selectedStepId ? steps[selectedStepId] : null;

  /* actualiza un campo del step y sincroniza el nodo del canvas */
  const updateStep = useCallback((patch) => {
    if (!selectedStepId) return;
    setSteps((prev) => ({ ...prev, [selectedStepId]: { ...prev[selectedStepId], ...patch } }));
    if ('title' in patch || 'kind' in patch) {
      setNodes((nds) => nds.map((n) => n.id === selectedStepId ? {
        ...n,
        data: {
          ...n.data,
          ...(patch.title != null ? { label: patch.title } : {}),
          ...(patch.kind != null ? { stepKind: patch.kind } : {}),
        },
      } : n));
    }
  }, [selectedStepId, setSteps, setNodes]);

  const onDragStart = useCallback((event, kind) => {
    event.dataTransfer.setData('application/reactflow', 'step');
    event.dataTransfer.setData('application/reactflow/kind', kind);
    event.dataTransfer.effectAllowed = 'move';
  }, []);

  const onDrop = useCallback((event) => {
    event.preventDefault();
    const reactFlowBounds = event.target.closest('.react-flow').getBoundingClientRect();
    const type = event.dataTransfer.getData('application/reactflow');
    const kind = event.dataTransfer.getData('application/reactflow/kind');
    if (!type) return;

    const position = {
      x: event.clientX - reactFlowBounds.left - 100,
      y: event.clientY - reactFlowBounds.top - 30,
    };

    const n = Object.keys(steps).length + 1;
    const id = `step-nuevo-${Date.now()}`;
    const label = `nuevo-paso-${n}`;
    const newStep = {
      id,
      title: label,
      kind,
      instructions: '',
      required_slots: [],
      handout_target: '',
      tool_ref: '',
      tool_params: [],
      allowed_transitions: [],
      grounding_atoms: [],
      completion_condition: '',
    };

    setSteps((prev) => ({ ...prev, [id]: newStep }));
    setNodes((nds) => [...nds, {
      id,
      type: 'step',
      position,
      data: { label, stepKind: kind, stepId: id },
    }]);
    setSelectedStepId(id);
  }, [setNodes, setSteps, steps]);

  const onDragOver = useCallback((event) => {
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
  }, []);

  const selectedStepEl = selectedStep ? html`
    ${(() => {
      const kindFields = KIND_FIELDS[selectedStep.kind] || ['instructions'];
      const kc = STEP_KINDS[selectedStep.kind] || STEP_KINDS.interaccion_simple;
      return html`<div>
        ${/* Nombre editable */''}
        <div class="field-group">
          <div class="field-label">Nombre del paso</div>
          <input class="insp-input" value=${selectedStep.title}
            onInput=${(e) => updateStep({ title: e.target.value })} />
        </div>

        ${/* Tipo (kind) */''}
        <div class="field-group">
          <div class="field-label">Tipo de paso</div>
          <select class="insp-input" value=${selectedStep.kind}
            onChange=${(e) => updateStep({ kind: e.target.value })}>
            ${Object.entries(STEP_KINDS).map(([k, v]) => html`<option value=${k}>${v.icon}  ${v.label}</option>`)}
          </select>
        </div>

        ${/* Instructions (siempre) */''}
        <div class="field-group">
          <div class="field-label">Instrucciones</div>
          <textarea class="insp-input" value=${selectedStep.instructions}
            onInput=${(e) => updateStep({ instructions: e.target.value })}
            placeholder="Qué hace el agente en este paso..."></textarea>
        </div>

        ${/* Slots (solo obtencion_datos) */''}
        ${kindFields.includes('required_slots') ? html`
          <div class="field-group">
            <div class="field-label">Slots requeridos</div>
            <div class="field-value inline">
              ${selectedStep.required_slots.map((s) => html`<span class="slot-chip">${s}</span>`)}
            </div>
          </div>` : ''}

        ${/* Handout target (solo handout) */''}
        ${kindFields.includes('handout_target') ? html`
          <div class="field-group">
            <div class="field-label">Destino de handout</div>
            <input class="insp-input" value=${selectedStep.handout_target || ''}
              onInput=${(e) => updateStep({ handout_target: e.target.value })}
              placeholder="humano / equipo / otro flujo" />
          </div>` : ''}

        ${/* Tool ref (solo llamado_tool) */''}
        ${kindFields.includes('tool_ref') ? html`
          <div class="field-group">
            <div class="field-label">Tool</div>
            <input class="insp-input" value=${selectedStep.tool_ref || ''}
              onInput=${(e) => updateStep({ tool_ref: e.target.value })}
              placeholder="id de la ToolAtom (ej. crear_reserva)" />
          </div>` : ''}

        ${/* Transiciones (siempre) */''}
        <div class="field-group">
          <div class="field-label">Transiciones permitidas</div>
          <div class="field-value inline">
            ${selectedStep.allowed_transitions.map((t) => html`<span class="transition-chip">${t}</span>`)}
          </div>
        </div>

        ${/* Grounding atoms (siempre) */''}
        <div class="field-group">
          <div class="field-label">Grounding Atoms</div>
          <div class="field-value inline">
            ${selectedStep.grounding_atoms.map((a) => html`<span class="atom-chip">${a}</span>`)}
          </div>
        </div>

        ${/* Completion */''}
        <div class="field-group">
          <div class="field-label">Condición de término</div>
          <textarea class="insp-input" value=${selectedStep.completion_condition || ''}
            onInput=${(e) => updateStep({ completion_condition: e.target.value })}
            placeholder="Cuándo se considera completo el paso..."></textarea>
        </div>

        ${/* ID (read-only, al fondo) */''}
        <div class="field-group">
          <div class="field-label">Step ID</div>
          <div class="field-value" style=${{ fontFamily: "'JetBrains Mono',monospace", fontSize: 11, color: 'rgba(245,240,232,.35)' }}>
            ${selectedStep.id}
          </div>
        </div>
      </div>`;
    })()}
  ` : html`<div class="empty">Selecciona un nodo para inspeccionar</div>`;

  return html`
    <div class="app">
      ${/* Sidebar */''}
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-kicker">Conversation Flow</div>
          <div class="brand-title"><em>Step</em> Editor</div>
        </div>
        <div class="palette">
          <div class="palette-label">Tipos de paso</div>
          ${PALETTE_ITEMS.map((item) => html`
            <div class="palette-item" draggable
              onDragStart=${(e) => onDragStart(e, item.kind)}>
              <span style=${{ fontSize: 14 }}>${item.icon}</span>
              <span class="palette-dot" style=${{ background: item.color }}></span>
              ${item.label}
            </div>
          `)}
          <div style=${{ marginTop: 20, borderTop: '1px solid rgba(212,165,116,.1)', paddingTop: 14 }}>
            <div class="palette-label">Anotaciones</div>
            <div style=${{ fontSize: 11, color: 'rgba(245,240,232,.3)', lineHeight: 1.6 }}>
              Arrastra pasos al canvas.<br/>
              Conecta arrastrando desde el handle derecho de un nodo.
            </div>
          </div>
        </div>
      </aside>

      ${/* Canvas */''}
      <div class="canvas-wrap" onDrop=${onDrop} onDragOver=${onDragOver}>
          <${ReactFlow}
            nodes=${nodes}
            edges=${edges}
            onNodesChange=${onNodesChange}
            onEdgesChange=${onEdgesChange}
            onConnect=${onConnect}
            onNodeClick=${onNodeClick}
            onPaneClick=${onPaneClick}
            nodeTypes=${nodeTypes}
            fitView
            fitViewOptions=${{ padding: 0.3 }}
            colorMode="dark"
            defaultEdgeOptions=${{
              style: { stroke: 'rgba(212,165,116,.2)', strokeWidth: 2 },
              markerEnd: { type: MarkerType.ArrowClosed, color: 'rgba(212,165,116,.4)' },
            }}
          >
            <${Background} color="rgba(212,165,116,.04)" gap=${24} />
            <${Controls} showInteractive=${false} />
            <${MiniMap}
              nodeColor=${() => 'rgba(212,165,116,.2)'}
              maskColor="rgba(10,10,15,.7)"
              style=${{ background: 'rgba(10,10,15,.5)' }}
            />
          </${ReactFlow}>
        <div class="toolbar">
          <button class="toolbar-btn">⟲ Layout</button>
          <button class="toolbar-btn primary">💾 Save</button>
        </div>
      </div>

      ${/* Inspector */''}
      <aside class="inspector">
        <div class="inspector-header">
          ${selectedStep ? 'Step Inspector' : 'Inspector'}
        </div>
        <div class="inspector-body">
          ${selectedStepEl}
        </div>
      </aside>
    </div>
  `;
}

const root = createRoot(document.getElementById('root'));
root.render(html`<${ReactFlowProvider}><${App} /></${ReactFlowProvider}>`);
</script>
</body>
</html>
