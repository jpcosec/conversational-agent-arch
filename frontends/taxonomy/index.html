<script type="module">
import React,{useState,useCallback,useEffect,useRef,useMemo}from'react'
import{createRoot}from'react-dom/client'
import{ReactFlow,ReactFlowProvider,Background,Controls,MiniMap,Handle,Position,useNodesState,useEdgesState,useReactFlow,useNodesInitialized,NodeToolbar}from'@xyflow/react'
import htm from'htm';const html=htm.bind(React.createElement)
import dagre from'dagre'

const FAM={self:{color:'#7cba7c',icon:'🧬',label:'self'},domain:{color:'#7fb3d5',icon:'📖',label:'domain'},conversation:{color:'#e6a85c',icon:'💬',label:'conversation'},user:{color:'#c97db9',icon:'👤',label:'user'},gate:{color:'#d46a8c',icon:'🚦',label:'gate'}}
// Eje de agente (independiente de la familia): qué agente "toca" cada atom_type.
// Mapeo verificado contra docs/AGENT-CONTRACTS.md §2.0 y §5 de docs/KNOWLEDGE-MODEL.md
// (tabla "Documentos ↔ agentes"; F=carga base y D=selección dinámica cuentan igual acá,
// porque lo que importa para el filtro es si el agente lo ve, no cuándo).
// El perfilador es post-turno (no participa del camino de respuesta) — marcado aparte.
const AGENTS={
 conversador:{color:'#4fc3d9',icon:'🗣️',label:'Conversador'},
 ruteador:{color:'#e0c341',icon:'🧭',label:'Ruteador'},
 orquestador:{color:'#9b7fd4',icon:'🎚️',label:'Orquestador'},
 gate:{color:'#ff6b6b',icon:'🛂',label:'Gate'},
 perfilador:{color:'#8a94a6',icon:'🪞',label:'Perfilador',postTurn:true},
}
const AGENT_OF={
 self:['conversador'],style:['conversador'],boundary:['conversador'],strategy:['conversador'],
 fallback:['conversador','orquestador'],
 domain:['conversador','ruteador'],
 rule:['conversador','ruteador','orquestador'],
 step:['conversador','ruteador','orquestador'],
 tool:['orquestador'],
 gate:['gate'],
 trait:['conversador','ruteador','perfilador'],
}
const FIVEWH={what:'❓',when:'📅',where:'📍',who:'👤',how:'🔧',why:'🤔'}
let NID=0
// Puente de acciones del NodeToolbar -> estado de App (poblado en App via useEffect)
const MM_ACTIONS={del(){},child(){},sibling(){},link(){},comment(){},goto(){}}
const TB_BTN={background:'rgba(18,18,26,.95)',border:'1px solid rgba(212,165,116,.25)',color:'rgba(245,240,232,.75)',borderRadius:6,padding:'3px 8px',fontSize:11,cursor:'pointer',fontFamily:"'JetBrains Mono',monospace"}

function MindNode({id,data,selected}){
 const fam=FAM[data.family]||FAM.domain;const isRoot=data.kind==='root';const isAtom=data.kind==='atom'
 const bg=isRoot?fam.color:isAtom?'rgba(18,18,26,.95)':`${fam.color}18`
 const border=selected?'#d4a574':isRoot?fam.color:`${fam.color}66`
 return html`<div data-kind=${data.kind} data-atom-type=${isAtom?data.atom_type:undefined} style=${{border:`2px solid ${border}`,borderLeft:isAtom?`4px solid ${fam.color}`:`2px solid ${border}`,background:bg,borderRadius:isRoot?20:12,padding:isRoot?'10px 18px':'7px 13px',minWidth:isRoot?130:90,maxWidth:240,cursor:'pointer',transition:'.15s',boxShadow:selected?'0 0 18px rgba(212,165,116,.25)':'none',display:'flex',alignItems:'center',gap:7}}>
   <${NodeToolbar} isVisible=${!!selected} position=${Position.Top}>
     <div data-testid="mindmap-node-toolbar" style=${{display:'flex',gap:4,background:'rgba(10,10,15,.95)',border:'1px solid rgba(212,165,116,.2)',borderRadius:8,padding:4,boxShadow:'0 8px 28px rgba(0,0,0,.5)'}}>
       <button style=${TB_BTN} title="Borrar" onClick=${()=>MM_ACTIONS.del(id)}>🗑</button>
       <button style=${TB_BTN} title="Agregar hijo" onClick=${()=>MM_ACTIONS.child(id)}>＋hijo</button>
       <button style=${TB_BTN} title="Agregar hermano" onClick=${()=>MM_ACTIONS.sibling(id)}>＋herm</button>
       <button style=${TB_BTN} title="Link horizontal" onClick=${()=>MM_ACTIONS.link(id)}>🔗</button>
       <button style=${TB_BTN} title="Comentario agente (coming soon)" onClick=${()=>MM_ACTIONS.comment(id)}>💬</button>
       <button style=${TB_BTN} title="Ir al documento" onClick=${()=>MM_ACTIONS.goto(id)}>↗doc</button>
     </div>
   </${NodeToolbar}>
   <${Handle} type="target" position=${Position.Left} style=${{background:fam.color,width:7,height:7,border:'2px solid #0a0a0f',opacity:isRoot?0:1}}/>
   ${isRoot&&html`<span style=${{fontSize:15}}>${fam.icon}</span>`}
   ${isAtom&&html`<span style=${{fontSize:12}}>${FIVEWH[data.five_wh]||'📄'}</span>`}
   <div style=${{minWidth:0}}><div style=${{fontSize:isRoot?14:12,fontWeight:isRoot?700:500,color:isRoot?'#0a0a0f':'#f5f0e8',lineHeight:1.2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>${data.label}</div>
     ${isAtom&&html`<div style=${{fontSize:8,fontFamily:"'JetBrains Mono',monospace",color:fam.color,opacity:.8,marginTop:1,textTransform:'uppercase',letterSpacing:'.06em'}}>${data.atom_type}</div>`}</div>
   <div class="drag-handle" data-testid="mindmap-drag-handle">⠿</div>
   <${Handle} type="source" position=${Position.Right} style=${{background:fam.color,width:7,height:7,border:'2px solid #0a0a0f'}}/>
 </div>`}
const nodeTypes={mind:MindNode}

function buildGraph(tax){const nodes=[],edges=[];Object.keys(tax).forEach(fam=>{
 const rootId=`root-${fam}`;nodes.push({id:rootId,type:'mind',position:{x:0,y:0},data:{label:fam,family:fam,kind:'root'}})
 const pushAtom=(a,parentId)=>{const aid=`a-${NID++}`;nodes.push({id:aid,type:'mind',position:{x:0,y:0},data:{label:a.title,family:fam,kind:'atom',atom_id:a.id,atom_type:a.atom_type,five_wh:a.five_wh_one_plus,summary:a.summary,tags:a.tags}});edges.push({id:`e-${parentId}-${aid}`,source:parentId,target:aid,type:'bezier',style:{stroke:`${FAM[fam].color}55`,strokeWidth:1.8}})};
 const mkEdge=(s,t)=>({id:`e-${s}-${t}`,source:s,target:t,type:'bezier',style:{stroke:`${FAM[fam].color}55`,strokeWidth:1.8}})
 function walk(children,parentId){children.forEach(node=>{const bid=`b-${NID++}`;nodes.push({id:bid,type:'mind',position:{x:0,y:0},data:{label:node.name,family:fam,kind:'branch',path:node.path}});edges.push(mkEdge(parentId,bid));node.atoms.forEach(a=>pushAtom(a,bid));if(node.children?.length)walk(node.children,bid)})}
 walk(tax[fam].children,rootId);(tax[fam].orphans||[]).forEach(a=>pushAtom(a,rootId))
});return{nodes,edges}}

function layoutTree(nodes,edges,rankdir){
 const byFam={};nodes.forEach(n=>{(byFam[n.data.family]||=[]).push(n)})
 const order=['self','domain','conversation','user','gate'];let yOffset=0;const pos={}
 order.forEach(fam=>{const fn=byFam[fam]||[];if(!fn.length)return
  const ids=new Set(fn.map(n=>n.id));const fe=edges.filter(e=>ids.has(e.source)&&ids.has(e.target))
  const g=new dagre.graphlib.Graph;g.setDefaultEdgeLabel(()=>({}))
  g.setGraph({rankdir:rankdir||'LR',nodesep:22,ranksep:90,marginx:20,marginy:20})
  const W=n=>n.data.kind==='root'?150:n.data.kind==='atom'?200:110
  fn.forEach(n=>g.setNode(n.id,{width:W(n),height:40}));fe.forEach(e=>g.setEdge(e.source,e.target));dagre.layout(g)
  let maxY=0;fn.forEach(n=>{maxY=Math.max(maxY,g.node(n.id).y)})
  fn.forEach(n=>{const p=g.node(n.id);pos[n.id]={x:p.x-W(n)/2,y:p.y-20+yOffset}})
  yOffset+=maxY+120
 });return nodes.map(n=>({...n,position:pos[n.id]||{x:0,y:0}}))
}

function Tooltip({atom,pos}){if(!atom)return null;const tags=(atom.tags||[]).filter(t=>t.includes(':'))
 return html`<div style=${{position:'fixed',zIndex:100,left:pos.x,top:pos.y,background:'rgba(10,10,15,.96)',border:'1px solid rgba(245,240,232,.14)',borderRadius:10,padding:'11px 13px',maxWidth:300,fontSize:12,lineHeight:1.5,pointerEvents:'none',backdropFilter:'blur(8px)',boxShadow:'0 12px 40px rgba(0,0,0,.5)'}}>
   <div style=${{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'rgba(245,240,232,.45)',marginBottom:3}}>${atom.atom_id}</div>
   <div style=${{fontWeight:600,marginBottom:4}}>${atom.label}</div>
   <div style=${{fontSize:11,color:'rgba(245,240,232,.62)',marginBottom:4}}>Esto es un <b>${atom.atom_type||atom.kind||'nodo'}</b> de la familia <b>${atom.family}</b>.</div>
   ${atom.five_wh&&html`<span style=${{color:'#d4a574',fontFamily:"'JetBrains Mono',monospace",fontSize:10,textTransform:'uppercase',letterSpacing:'.08em'}}>${FIVEWH[atom.five_wh]||''} ${atom.five_wh}</span>`}
   ${atom.summary&&html`<div style=${{marginTop:5,color:'rgba(245,240,232,.62)'}}>${atom.summary}</div>`}
   ${tags.length>0&&html`<div style=${{display:'flex',flexWrap:'wrap',gap:4,marginTop:6}}>${tags.map(t=>html`<span key=${t} style=${{fontFamily:"'JetBrains Mono',monospace",fontSize:9,padding:'2px 5px',borderRadius:4,background:'rgba(245,240,232,.06)',color:'rgba(245,240,232,.5)'}}>${t}</span>`)}</div>`}</div>`}

function App(){
 const [nodes,setNodes,onNodesChange]=useNodesState([]);const[edges,setEdges,onEdgesChange]=useEdgesState([])
 const [hover,setHover]=useState(null);const [editing,setEditing]=useState(null);const [comment,setComment]=useState(null)
 const [layoutMode,setLayoutMode]=useState('tree');const [xfamily,setXfamily]=useState(false);const [searchText,setSearchText]=useState('')
 const [filterRama,setFilterRama]=useState(null);const [collapsed,setCollapsed]=useState(new Set())
 const [filterAgents,setFilterAgents]=useState(new Set())
 const toggleAgent=useCallback(id=>setFilterAgents(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n}),[])
 const [selectedNode,setSelectedNode]=useState(null);const [linking,setLinking]=useState(false);const [taxData,setTaxData]=useState(null)
 const {fitView}=useReactFlow()
 const [viewport,setViewport]=useState({x:0,y:0,zoom:1})
 const fitted=useRef(false)

 useEffect(()=>{fetch('/api/taxonomy').then(r=>r.json()).then(tax=>{setTaxData(tax);NID=0;const{nodes:rn,edges:re}=buildGraph(tax);setNodes(layoutTree(rn,re,'LR'));setEdges(re)}).catch(e=>console.error('tax err',e))},[setNodes,setEdges])

 // Encuadre inicial con viewport CONTROLADO por props.
 // La via imperativa (fitView() del hook, y tambien setViewport()) no surte
 // efecto en este montaje: se la puede llamar con los 76 nodos ya medidos en
 // el DOM y el transform del viewport se queda en la identidad, dejando el
 // arbol (~2800px de alto) desbordando la pantalla. Controlando el viewport
 // por prop no dependemos de esa API; onViewportChange conserva pan y zoom.
 useEffect(()=>{
  if(!nodes.length||fitted.current)return
  const t=setTimeout(()=>{
   const wrap=document.querySelector('.mm-canvas')
   if(!wrap||!wrap.clientWidth||!wrap.clientHeight)return
   let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity
   nodes.forEach(n=>{
    const el=document.querySelector('.react-flow__node[data-id="'+n.id+'"]')
    const w=el?el.offsetWidth:160,h=el?el.offsetHeight:34
    minX=Math.min(minX,n.position.x);minY=Math.min(minY,n.position.y)
    maxX=Math.max(maxX,n.position.x+w);maxY=Math.max(maxY,n.position.y+h)
   })
   if(!isFinite(minX))return
   const PAD=1.12
   const zoom=Math.max(0.1,Math.min(wrap.clientWidth/((maxX-minX)*PAD),wrap.clientHeight/((maxY-minY)*PAD),1.2))
   setViewport({x:(wrap.clientWidth-(maxX+minX)*zoom)/2,y:(wrap.clientHeight-(maxY+minY)*zoom)/2,zoom})
   fitted.current=true
  },400)
  return()=>clearTimeout(t)
 },[nodes])

 const applyLayout=useCallback((lay)=>{setLayoutMode(lay);if(!nodes.length||!taxData)return;if(lay==='embeddings'){fetch('/api/viz/graph').then(r=>r.json()).then(g=>{if(!g.nodes)return;const em=nodes.map(n=>{const e=g.nodes.find(gn=>gn.id===n.data.atom_id||gn.id===n.data.label);return e?{...n,position:{x:e.position?.x||0,y:e.position?.y||0}}:n});setNodes(em);setEdges(prev=>prev)}).catch(()=>{});return}
  const n=layoutTree(nodes,edges,lay==='topdown'?'TB':'LR');setNodes(n);fitView({padding:0.1,duration:400})},[nodes,edges,taxData])

 useEffect(()=>{if(typeof initHotkeys==='function'){initHotkeys({element:document.querySelector('.react-flow'),onSearch:()=>document.querySelector('[data-testid="mindmap-search"]')?.focus(),onDelete:()=>{if(selectedNode){setNodes(nds=>nds.filter(n=>n.id!==selectedNode));setEdges(eds=>eds.filter(e=>e.source!==selectedNode&&e.target!==selectedNode));setSelectedNode(null)}},onAddChild:()=>{},onAddSibling:()=>{},onLinkHorizontal:()=>{if(selectedNode)setLinking(l=>!l)},onCollapse:()=>{if(selectedNode){setCollapsed(c=>{const n=new Set(c);if(n.has(selectedNode))n.delete(selectedNode);else n.add(selectedNode);return n})}},onFocus:()=>{if(selectedNode){const n=document.querySelector(`[data-id="${selectedNode}"]`);if(n)n.scrollIntoView({behavior:'smooth',block:'center'})}},onLayout:l=>applyLayout(['tree','topdown','embeddings'][l-1]),onHelp:()=>alert('Ctrl+F Buscar · Delete Borrar · Tab Hijo · Enter Hermano · L Link · Space Collapse · 1/2/3 Layout · F Centrar · Esc Cancelar · ? Ayuda'),onCancel:()=>setLinking(false)})}})

 // Puente NodeToolbar -> acciones sobre estado de App
 useEffect(()=>{
  MM_ACTIONS.del=(nid)=>{setNodes(nds=>nds.filter(n=>n.id!==nid));setEdges(eds=>eds.filter(e=>e.source!==nid&&e.target!==nid));setSelectedNode(null)}
  MM_ACTIONS.child=(nid)=>{const cid=`b-${NID++}`;setNodes(nds=>{const p=nds.find(n=>n.id===nid);if(!p)return nds;return[...nds,{id:cid,type:'mind',position:{x:(p.position?.x||0)+180,y:(p.position?.y||0)+40},data:{label:'nuevo',family:p.data.family,kind:'branch'}}]});setEdges(eds=>[...eds,{id:`e-${nid}-${cid}`,source:nid,target:cid,type:'bezier',style:{stroke:'rgba(212,165,116,.5)',strokeWidth:1.8}}])}
  MM_ACTIONS.sibling=(nid)=>{const sid=`b-${NID++}`;setNodes(nds=>{const p=nds.find(n=>n.id===nid);if(!p)return nds;const parentEdge=edges.find(e=>e.target===nid);const src=parentEdge?parentEdge.source:null;const newNode={id:sid,type:'mind',position:{x:(p.position?.x||0),y:(p.position?.y||0)+70},data:{label:'nuevo',family:p.data.family,kind:p.data.kind==='atom'?'branch':p.data.kind}};if(src)setEdges(eds=>[...eds,{id:`e-${src}-${sid}`,source:src,target:sid,type:'bezier',style:{stroke:'rgba(212,165,116,.5)',strokeWidth:1.8}}]);return[...nds,newNode]})}
  MM_ACTIONS.link=(nid)=>{setSelectedNode(nid);setLinking(true)}
  MM_ACTIONS.comment=(nid)=>{const n=nodes.find(x=>x.id===nid);if(n)setComment({atom:n.data,pos:{x:window.innerWidth/2,y:window.innerHeight/2}})}
  MM_ACTIONS.goto=(nid)=>{const n=nodes.find(x=>x.id===nid);if(n&&n.data.atom_id)window.open('/api/atom/'+encodeURIComponent(n.data.atom_id),'_blank')}
 })

 const onNodeMouseEnter=useCallback((e,node)=>{if(node.data.kind!=='atom')return;setHover({atom:node.data,pos:{x:e.clientX+16,y:e.clientY+8}})},[])
 const onNodeMouseLeave=useCallback(()=>setHover(null),[])
 const onNodeClick=useCallback((e,node)=>{setSelectedNode(node.id);if(linking&&node.id!==linking){setEdges(eds=>[...eds,{id:`e-x-${Date.now()}`,source:selectedNode,target:node.id,style:{stroke:'#c97db9',strokeWidth:2,strokeDasharray:'5,5'}}]);setLinking(false)}if(node.data.kind==='atom'){setHover(null);setComment({atom:node.data,pos:{x:e.clientX+12,y:e.clientY+8}})}},[])
 const onPaneClick=useCallback(()=>{setHover(null);setComment(null);setSelectedNode(null);setLinking(false)},[])
 const onNodeDoubleClick=useCallback((e,node)=>{if(node.data.kind!=='atom')return;setHover(null);setComment(null);setEditing(node.data)},[])

 const ramas=useMemo(()=>{if(!taxData)return[];const r=[];Object.keys(taxData).forEach(fam=>{r.push({id:fam,label:fam,children:[]})});return r},[taxData])

 const filtered=useMemo(()=>{
  let out=nodes
  if(filterRama&&taxData){const fam=filterRama;out=out.filter(n=>n.data.family===fam||n.data.label===fam)}
  if(filterAgents.size){
   // El eje de agente solo aplica a hojas (atoms): raíz y ramas quedan
   // visibles como esqueleto del árbol aunque ninguno de sus atoms matchee.
   out=out.filter(n=>{if(n.data.kind!=='atom')return true;const ag=AGENT_OF[n.data.atom_type]||[];return ag.some(a=>filterAgents.has(a))})
  }
  return out
 },[nodes,filterRama,taxData,filterAgents])
 const searched=useMemo(()=>{if(!searchText)return filtered;const t=searchText.toLowerCase();return filtered.filter(n=>(n.data.label||'').toLowerCase().includes(t)||(n.data.atom_id||'').toLowerCase().includes(t))},[filtered,searchText])

 return html`<div class="mm-layout">
   <aside class="mm-sidebar" data-testid="mindmap-sidebar"><div class="mm-sidebar-label">Filtrar rama</div>
    <input class="mm-filter-input" placeholder="buscar rama…" onInput=${e=>setFilterRama(e.target.value||null)}/>
    ${ramas.map(r=>html`<div class="mm-rama ${filterRama===r.id?'active':''}" data-testid="mindmap-rama-${r.id}" onClick=${()=>setFilterRama(r.id===filterRama?null:r.id)}>${FAM[r.id]?.icon||''} ${r.label}</div>`)}
    <div class="mm-sidebar-label" style=${{marginTop:14}} data-testid="mindmap-agent-filter">Filtrar agente</div>
    ${Object.entries(AGENTS).map(([id,a])=>{const active=filterAgents.has(id);return html`<div class="mm-rama ${active?'active':''}" data-testid="mindmap-agent-${id}" style=${{borderLeft:`3px solid ${active?a.color:'transparent'}`,color:active?a.color:'rgba(245,240,232,.6)'}} onClick=${()=>toggleAgent(id)}><span style=${{display:'inline-block',width:6,height:6,borderRadius:2,background:a.color,marginRight:5}}></span>${a.icon} ${a.label}${a.postTurn?' · post-turno':''}</div>`})}
    <div style=${{marginTop:'auto',borderTop:'1px solid rgba(212,165,116,.1)',paddingTop:14}}>
     <div class="mm-sidebar-label">Layout</div>
     ${[{id:'tree',label:'Árbol LR'},{id:'topdown',label:'Top-Down'},{id:'embeddings',label:'Embeddings'}].map(l=>html`<div class="mm-rama ${layoutMode===l.id?'active':''}" data-testid="mindmap-layout-${l.id}" onClick=${()=>applyLayout(l.id)}>${l.label}</div>`)}
     <label style=${{display:'flex',alignItems:'center',gap:6,marginTop:10,fontSize:11,cursor:'pointer'}}>
      <input type="checkbox" checked=${xfamily} onChange=${()=>setXfamily(!xfamily)} data-testid="mindmap-xfamily-toggle" style=${{accentColor:'#d4a574'}}/>
      <span style=${{color:'rgba(245,240,232,.6)'}}>Links horizontales</span></label>
    </div>
   </aside>
   <div class="mm-canvas">
    <div class="mm-topbar">
     <input class="mm-search" data-testid="mindmap-search" placeholder="Buscar nodo (Ctrl+F)…" value=${searchText} onInput=${e=>setSearchText(e.target.value)}/>
     <span style=${{fontSize:10,color:'rgba(245,240,232,.35)',marginLeft:'auto'}}>doble-click edita · click comenta</span>
    </div>
    <${ReactFlow} nodes=${searched} edges=${edges} onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange} nodeTypes=${nodeTypes}
     onNodeMouseEnter=${onNodeMouseEnter} onNodeMouseLeave=${onNodeMouseLeave} onNodeClick=${onNodeClick} onNodeDoubleClick=${onNodeDoubleClick} onPaneClick=${onPaneClick}
     viewport=${viewport} onViewportChange=${setViewport} minZoom=${0.1} maxZoom=${2} proOptions=${{hideAttribution:true}} selectionOnDrag>
     <${Background} color="rgba(212,165,116,.06)" gap=${28}/>
     <${Controls} showInteractive=${false}/>
     <${MiniMap} nodeColor=${n=>FAM[n.data?.family]?.color||'#555'} maskColor="rgba(10,10,15,.7)" style=${{background:'#0d1526',border:'1px solid rgba(212,165,116,.2)'}}/>
    </${ReactFlow}>
    <div class="mm-legend">${Object.entries(FAM).map(([k,v])=>html`<div class="mm-legend-item"><span class="mm-legend-dot" style=${{background:v.color}}></span>${v.icon} ${k}</div>`)}</div>
    ${hover&&html`<${Tooltip} atom=${hover.atom} pos=${hover.pos}/>`}
   </div>
 </div>`
}
createRoot(document.getElementById('root')).render(html`<${ReactFlowProvider}><${App}/></${ReactFlowProvider}>`)
</script>
<script src="/static/demo-tour.js"></script>
<script>if(window.DemoTour)DemoTour.run();</script>
</body></html>
