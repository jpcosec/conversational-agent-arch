<script type="importmap">
{
  "imports": {

<link rel="stylesheet" href="https://esm.sh/@xyflow/react@12.11.5/dist/style.css">
<link rel="stylesheet" href="/static/theme.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%}
  body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#f5f0e8;overflow:hidden;display:flex;flex-direction:column}
  #root{flex:1;min-height:0;width:100%;position:relative}
  .react-flow__attribution{display:none}
  input,textarea,select{font-family:inherit}

<body>
  <header class="app-topbar">
    <span class="app-topbar-brand" id="appBrand">Agente</span>
    <nav class="app-nav" id="appNav">
      <a href="/">Chat</a>
      <a href="/conversation_flow_editor">Flow Editor</a>
      <a href="/taxonomy_explorer">Taxonomía</a>
      <a href="/viz">Embeddings</a>
      <a href="/profiling_viewer">Perfilado</a>
    </nav>
  </header>
<div id="root"></div>
<script>
  (function () {
    var path = location.pathname.replace(/\/$/, '') || '/';
    document.querySelectorAll('#appNav a').forEach(function (a) {
      var href = a.getAttribute('href').replace(/\/$/, '') || '/';
      if (href === path) a.classList.add('active');
    });
    fetch('/api/config').then(function (r) { return r.json(); }).then(function (cfg) {
      var b = document.getElementById('appBrand');
      if (b) b.textContent = cfg.runtime_title || cfg.name || 'Agente';
    }).catch(function () {});
  })();

<script type="module">
import React, { useState, useCallback, useEffect, useRef } from 'react';
import { createRoot } from 'react-dom/client';
import {
  ReactFlow, ReactFlowProvider, Background, Controls, MiniMap,
  Handle, Position, useNodesState, useEdgesState, useReactFlow, NodeToolbar,
} from '@xyflow/react';
import htm from 'htm';
import dagre from 'dagre';
const html = htm.bind(React.createElement);

/* ── familias: color por raíz ── */
const FAM = {
  self:         { color:'#7cba7c', icon:'🧬' },
  domain:       { color:'#7fb3d5', icon:'📖' },
  conversation: { color:'#e6a85c', icon:'💬' },
  user:         { color:'#c97db9', icon:'👤' },
};
const FIVEWH = { what:'❓', when:'📅', where:'📍', who:'👤', how:'🔧', why:'🤔' };

/* ── nodo del mindmap: burbuja/pill (presentacional puro) ── */
function MindNode({ data, selected }) {
  const fam = FAM[data.family] || FAM.domain;
  const isRoot = data.kind === 'root';
  const isAtom = data.kind === 'atom';
  const bg = isRoot ? fam.color : isAtom ? 'rgba(18,18,26,.95)' : `${fam.color}18`;
  const border = selected ? '#d4a574' : isRoot ? fam.color : `${fam.color}66`;
  return html`
    <div style=${{
      border: `2px solid ${border}`,
      borderLeft: isAtom ? `4px solid ${fam.color}` : `2px solid ${border}`,
      background: bg,
      borderRadius: isRoot ? 20 : 12,
      padding: isRoot ? '10px 18px' : '7px 13px',
      minWidth: isRoot ? 130 : 90, maxWidth: 240,
      cursor: 'pointer', transition: '.15s',
      boxShadow: selected ? '0 0 18px rgba(212,165,116,.25)' : 'none',
      display: 'flex', alignItems: 'center', gap: 7,
    }}>
      <${Handle} type="target" position=${Position.Left}
        style=${{ background: fam.color, width: 7, height: 7, border: '2px solid #0a0a0f', opacity: isRoot ? 0 : 1 }} />
      ${isRoot && html`<span style=${{ fontSize: 15 }}>${fam.icon}</span>`}
      ${isAtom && html`<span style=${{ fontSize: 12 }}>${FIVEWH[data.five_wh] || '📄'}</span>`}
      <div style=${{ minWidth: 0 }}>
        <div style=${{
          fontSize: isRoot ? 14 : 12, fontWeight: isRoot ? 700 : 500,
          color: isRoot ? '#0a0a0f' : '#f5f0e8', lineHeight: 1.2,
          whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
        }}>${data.label}</div>
        ${isAtom && html`<div style=${{
          fontSize: 8, fontFamily: "'JetBrains Mono',monospace", color: fam.color,
          opacity: .8, marginTop: 1, textTransform: 'uppercase', letterSpacing: '.06em',
        }}>${data.atom_type}</div>`}
      </div>
      <${Handle} type="source" position=${Position.Right}
        style=${{ background: fam.color, width: 7, height: 7, border: '2px solid #0a0a0f' }} />
    </div>
  `;
}
const nodeTypes = { mind: MindNode };

/* ── construir nodos+edges desde el árbol taxonómico ── */
let NID = 0;
function buildGraph(tax) {
  const nodes = [], edges = [];
  Object.keys(tax).forEach((fam) => {
    const rootId = `root-${fam}`;
    nodes.push({ id: rootId, type: 'mind', position: { x: 0, y: 0 },
      data: { label: fam, family: fam, kind: 'root' } });
    const pushAtom = (a, parentId) => {
      const aid = `a-${NID++}`;
      nodes.push({ id: aid, type: 'mind', position: { x: 0, y: 0 },
        data: {
          label: a.title, family: fam, kind: 'atom',
          atom_id: a.id, atom_type: a.atom_type, five_wh: a.five_wh_one_plus,
          summary: a.summary, tags: a.tags,
        } });
      edges.push(mkEdge(parentId, aid, fam));
    };
    function walk(children, parentId) {
      children.forEach((node) => {
        const bid = `b-${NID++}`;
        nodes.push({ id: bid, type: 'mind', position: { x: 0, y: 0 },
          data: { label: node.name, family: fam, kind: 'branch', path: node.path } });
        edges.push(mkEdge(parentId, bid, fam));
        node.atoms.forEach((a) => pushAtom(a, bid));
        if (node.children?.length) walk(node.children, bid);
      });
    }
    walk(tax[fam].children, rootId);
    (tax[fam].orphans || []).forEach((a) => pushAtom(a, rootId));
  });
  return { nodes, edges };
}
function mkEdge(source, target, fam) {
  return { id: `e-${source}-${target}`, source, target, type: 'bezier',
    style: { stroke: `${FAM[fam].color}55`, strokeWidth: 1.8 } };
}

/* ── layout dagre: LR, familias apiladas verticalmente ── */
function layout(nodes, edges) {
  const byFam = {};
  nodes.forEach((n) => { (byFam[n.data.family] ||= []).push(n); });
  const order = ['self', 'domain', 'conversation', 'user'];
  let yOffset = 0; const pos = {};
  order.forEach((fam) => {
    const fn = byFam[fam] || []; if (!fn.length) return;
    const ids = new Set(fn.map((n) => n.id));
    const fe = edges.filter((e) => ids.has(e.source) && ids.has(e.target));
    const g = new dagre.graphlib.Graph();
    g.setDefaultEdgeLabel(() => ({}));
    g.setGraph({ rankdir: 'LR', nodesep: 22, ranksep: 90, marginx: 20, marginy: 20 });
    const W = (n) => n.data.kind === 'root' ? 150 : n.data.kind === 'atom' ? 200 : 110;
    fn.forEach((n) => g.setNode(n.id, { width: W(n), height: 40 }));
    fe.forEach((e) => g.setEdge(e.source, e.target));
    dagre.layout(g);
    let maxY = 0; fn.forEach((n) => { maxY = Math.max(maxY, g.node(n.id).y); });
    fn.forEach((n) => { const p = g.node(n.id); pos[n.id] = { x: p.x - W(n) / 2, y: p.y - 20 + yOffset }; });
    yOffset += maxY + 120;
  });
  return nodes.map((n) => ({ ...n, position: pos[n.id] || { x: 0, y: 0 } }));
}

/* ── Tooltip (JSX, sigue al cursor) ── */
function Tooltip({ atom, pos }) {
  if (!atom) return null;
  const S = {
    position: 'fixed', zIndex: 100, left: pos.x, top: pos.y,
    background: 'rgba(10,10,15,.96)', border: '1px solid rgba(245,240,232,.14)',
    borderRadius: 10, padding: '11px 13px', maxWidth: 300, fontSize: 12, lineHeight: 1.5,
    pointerEvents: 'none', backdropFilter: 'blur(8px)', boxShadow: '0 12px 40px rgba(0,0,0,.5)',
  };
  const tags = (atom.tags || []).filter((t) => t.includes(':'));
  return html`
    <div style=${S}>
      <div style=${{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, color: 'rgba(245,240,232,.45)', marginBottom: 3 }}>${atom.atom_id}</div>
      <div style=${{ fontWeight: 600, marginBottom: 4 }}>${atom.label}</div>
      ${atom.five_wh && html`<span style=${{ color: '#d4a574', fontFamily: "'JetBrains Mono',monospace", fontSize: 10, textTransform: 'uppercase', letterSpacing: '.08em' }}>${FIVEWH[atom.five_wh] || ''} ${atom.five_wh}</span>`}
      ${atom.summary && html`<div style=${{ marginTop: 5, color: 'rgba(245,240,232,.62)' }}>${atom.summary}</div>`}
      ${tags.length > 0 && html`<div style=${{ display: 'flex', flexWrap: 'wrap', gap: 4, marginTop: 6 }}>
        ${tags.map((t) => html`<span key=${t} style=${{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, padding: '2px 5px', borderRadius: 4, background: 'rgba(245,240,232,.06)', color: 'rgba(245,240,232,.5)' }}>${t}</span>`)}
      </div>`}
    </div>
  `;
}

/* ── Modal de edición (JSX + estado controlado) ── */
function EditModal({ atom, onClose, onSave }) {
  const [title, setTitle] = useState(atom.label);
  const [fiveWh, setFiveWh] = useState(atom.five_wh || '');
  const [tagsText, setTagsText] = useState((atom.tags || []).filter((t) => t.includes(':')).join('\n'));
  const [summary, setSummary] = useState(atom.summary || '');
  const inp = {
    width: '100%', background: '#0a0a0f', border: '1px solid rgba(245,240,232,.1)',
    borderRadius: 8, padding: '8px 10px', color: '#f5f0e8', fontSize: 13, outline: 'none',
  };
  const lbl = {
    fontSize: 10, textTransform: 'uppercase', letterSpacing: '.08em', color: '#d4a574',
    fontFamily: "'JetBrains Mono',monospace", marginBottom: 4, display: 'block',
  };
  const field = { marginBottom: 13 };
  return html`
    <div onClick=${onClose} style=${{
      position: 'fixed', inset: 0, background: 'rgba(0,0,0,.72)', backdropFilter: 'blur(4px)',
      zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center',
    }}>
      <div onClick=${(e) => e.stopPropagation()} style=${{
        background: '#111a2e', border: '1px solid rgba(245,240,232,.14)', borderRadius: 16,
        width: 600, maxHeight: '82vh', overflowY: 'auto', padding: 24, boxShadow: '0 24px 60px rgba(0,0,0,.6)',
      }}>
        <h2 style=${{ fontSize: 16, fontWeight: 600, marginBottom: 16 }}>✏️ ${atom.label}</h2>
        <div style=${field}><label style=${lbl}>ID</label>
          <input value=${atom.atom_id} disabled style=${{ ...inp, opacity: .5 }} /></div>
        <div style=${field}><label style=${lbl}>Título</label>
          <input value=${title} onChange=${(e) => setTitle(e.target.value)} style=${inp} /></div>
        <div style=${field}><label style=${lbl}>5WH1+</label>
          <select value=${fiveWh} onChange=${(e) => setFiveWh(e.target.value)} style=${inp}>
            ${['', 'what', 'when', 'where', 'who', 'how', 'why'].map((v) =>
              html`<option key=${v} value=${v}>${FIVEWH[v] || '—'} ${v}</option>`)}
          </select></div>
        <div style=${field}><label style=${lbl}>Tags (uno por línea)</label>
          <textarea value=${tagsText} onChange=${(e) => setTagsText(e.target.value)}
            style=${{ ...inp, minHeight: 64, resize: 'vertical', fontFamily: "'JetBrains Mono',monospace", fontSize: 12 }} /></div>
        <div style=${field}><label style=${lbl}>Summary</label>
          <textarea value=${summary} onChange=${(e) => setSummary(e.target.value)}
            style=${{ ...inp, minHeight: 80, resize: 'vertical', fontFamily: "'JetBrains Mono',monospace", fontSize: 12 }} /></div>
        <div style=${{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginTop: 18 }}>
          <button onClick=${onClose} style=${btn(false)}>Cancelar</button>
          <button onClick=${() => onSave({ atom_id: atom.atom_id, title, five_wh: fiveWh, tags: tagsText.split('\n').filter(Boolean), summary })}
            style=${btn(true)}>Guardar</button>
        </div>
      </div>
    </div>
  `;
}

/* ── Popover de comentario (anclado con NodeToolbar sería ideal; aquí flotante controlado) ── */
function CommentPopover({ atom, pos, onClose, onSave }) {
  const [text, setText] = useState('');
  const ref = useRef(null);
  useEffect(() => { ref.current?.focus(); }, []);
  return html`
    <div style=${{
      position: 'fixed', zIndex: 150, left: pos.x, top: pos.y,
      background: '#111a2e', border: '1px solid rgba(212,165,116,.3)', borderRadius: 12,
      padding: 12, width: 280, boxShadow: '0 16px 44px rgba(0,0,0,.55)',
    }}>
      <div style=${{ fontFamily: "'JetBrains Mono',monospace", fontSize: 9, textTransform: 'uppercase', letterSpacing: '.08em', color: 'rgba(245,240,232,.5)', marginBottom: 6 }}>📝 Comentario · ${atom.atom_id}</div>
      <textarea ref=${ref} value=${text} onChange=${(e) => setText(e.target.value)}
        placeholder="Nota para el agente reflector…"
        style=${{ width: '100%', background: '#0a0a0f', border: '1px solid rgba(245,240,232,.1)', borderRadius: 8, padding: 8, color: '#f5f0e8', fontSize: 12, outline: 'none', resize: 'vertical', minHeight: 56 }} />
      <div style=${{ display: 'flex', gap: 6, justifyContent: 'flex-end', marginTop: 8 }}>
        <button onClick=${onClose} style=${btn(false, true)}>Cerrar</button>
        <button onClick=${() => onSave(atom.atom_id, text)} style=${btn(true, true)}>Guardar</button>
      </div>
    </div>
  `;
}

function btn(primary, small) {
  return {
    padding: small ? '5px 12px' : '8px 18px', borderRadius: small ? 8 : 10,
    border: `1px solid ${primary ? '#d4a574' : 'rgba(245,240,232,.14)'}`,
    background: primary ? '#d4a574' : 'transparent',
    color: primary ? '#0a0a0f' : '#f5f0e8',
    fontSize: small ? 11 : 12, fontWeight: 600, cursor: 'pointer',
  };
}

/* ── Leyenda (JSX) ── */
function Legend() {
  return html`
    <div style=${{ position: 'fixed', top: 58, right: 22, zIndex: 30, display: 'flex', gap: 14 }}>
      ${Object.entries(FAM).map(([k, v]) => html`
        <div key=${k} style=${{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: "'JetBrains Mono',monospace", fontSize: 10, textTransform: 'uppercase', letterSpacing: '.06em', color: 'rgba(245,240,232,.55)' }}>
          <span style=${{ width: 9, height: 9, borderRadius: 3, background: v.color }}></span>${v.icon} ${k}
        </div>`)}
    </div>
  `;
}

/* ── App ── */
function App() {
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [hover, setHover] = useState(null);       // { atom, pos }
  const [editing, setEditing] = useState(null);   // atom data
  const [comment, setComment] = useState(null);   // { atom, pos }
  const { fitView } = useReactFlow();

  useEffect(() => {
    fetch('/api/taxonomy').then((r) => r.json()).then((tax) => {
      NID = 0;
      const { nodes: rn, edges: re } = buildGraph(tax);
      setNodes(layout(rn, re));
      setEdges(re);
      setTimeout(() => fitView({ padding: 0.1, duration: 400 }), 150);
    }).catch((err) => console.error('No se pudo cargar taxonomy', err));
  }, [setNodes, setEdges, fitView]);

  /* handlers nativos de React Flow */
  const onNodeMouseEnter = useCallback((e, node) => {
    if (node.data.kind !== 'atom') return;
    setHover({ atom: node.data, pos: { x: e.clientX + 16, y: e.clientY + 8 } });
  }, []);
  const onNodeMouseLeave = useCallback(() => setHover(null), []);
  const onNodeDoubleClick = useCallback((e, node) => {
    if (node.data.kind !== 'atom') return;
    setHover(null); setComment(null);
    setEditing(node.data);
  }, []);
  const onNodeClick = useCallback((e, node) => {
    if (node.data.kind !== 'atom') return;
    setHover(null);
    setComment({ atom: node.data, pos: { x: e.clientX + 12, y: e.clientY + 8 } });
  }, []);
  const onPaneClick = useCallback(() => { setHover(null); setComment(null); }, []);

  const saveEdit = useCallback((patch) => {
    // TODO: POST /api/atom/save (persistir en SLDB)
    console.log('save edit', patch);
    setEditing(null);
  }, []);
  const saveComment = useCallback((atomId, text) => {
    // TODO: POST /api/atom/comment (metadata para reflector)
    console.log('save comment', atomId, text);
    setComment(null);
  }, []);

  return html`
    <div style=${{ width: '100vw', height: '100vh' }}>
      <div style=${{ position: 'fixed', top: 58, left: 22, zIndex: 30 }}>
        <div style=${{ fontSize: 16, fontWeight: 600 }}><em style=${{ color: '#d4a574', fontStyle: 'italic' }}>Taxonomía</em> · Mindmap</div>
        <div style=${{ fontFamily: "'JetBrains Mono',monospace", fontSize: 10, letterSpacing: '.06em', color: 'rgba(245,240,232,.45)' }}>doble-click edita · click comenta</div>
      </div>
      <${Legend} />
      <${ReactFlow}
        nodes=${nodes} edges=${edges}
        onNodesChange=${onNodesChange} onEdgesChange=${onEdgesChange}
        nodeTypes=${nodeTypes}
        onNodeMouseEnter=${onNodeMouseEnter}
        onNodeMouseLeave=${onNodeMouseLeave}
        onNodeClick=${onNodeClick}
        onNodeDoubleClick=${onNodeDoubleClick}
        onPaneClick=${onPaneClick}
        fitView minZoom=${0.1} maxZoom=${2}
        proOptions=${{ hideAttribution: true }}
      >
        <${Background} color="rgba(212,165,116,.06)" gap=${28} />
        <${Controls} showInteractive=${false} />
        <${MiniMap} nodeColor=${(n) => FAM[n.data?.family]?.color || '#555'}
          maskColor="rgba(10,10,15,.7)" style=${{ background: '#0d1526', border: '1px solid rgba(212,165,116,.2)' }} />
      </${ReactFlow}>
      ${hover && html`<${Tooltip} atom=${hover.atom} pos=${hover.pos} />`}
      ${comment && html`<${CommentPopover} atom=${comment.atom} pos=${comment.pos} onClose=${() => setComment(null)} onSave=${saveComment} />`}
      ${editing && html`<${EditModal} atom=${editing} onClose=${() => setEditing(null)} onSave=${saveEdit} />`}
    </div>
  `;
}

createRoot(document.getElementById('root')).render(
  html`<${ReactFlowProvider}><${App} /></${ReactFlowProvider}>`
);
</script>
</body>
</html>
