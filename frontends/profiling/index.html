<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/static/theme.css">
</head><body class="page-users">
<div id="appNavMount"></div>

<main class="app-main users-layout">

  <div class="users-userbar" id="userbar" data-testid="users-list"><div class="loading"><span class="spinner"></span>Cargando…</div></div>

 <div class="wrap users-detail">

 </div>
</main>

<script src="/static/nav.js"></script>
