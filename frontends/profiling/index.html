<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Users</title>
<link rel="stylesheet" href="/static/theme.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0a0a0f;--panel:#0d1526;--panel2:#111a2e;--border:rgba(245,240,232,.08);--border2:rgba(245,240,232,.14);--text:#f5f0e8;--muted:rgba(245,240,232,.45);--accent:#d4a574;--mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.layout{display:flex;flex:1;min-height:0}
.col-left{width:360px;min-width:360px;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.col-right{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column}
.col-head{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin-bottom:14px;padding:0 20px}
.col-head span{color:var(--muted)}
.userbar{display:flex;flex-direction:column;flex-wrap:nowrap;gap:6px;padding:14px 20px;overflow-y:auto;flex:1}
.user-chip{width:100%;font-family:var(--mono);font-size:11px;padding:10px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--panel2);color:var(--muted);cursor:pointer;transition:all .15s;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.user-chip:hover{border-color:var(--accent);color:var(--text);background:rgba(212,165,116,.06)}
.user-chip.active{border-color:var(--accent);background:rgba(212,165,116,.12);color:var(--accent)}
.user-chip .chip-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.user-chip .chip-name{font-weight:600;font-size:12px;line-height:1.3;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .chip-id{font-size:8px;line-height:1.3;color:rgba(245,240,232,.3);font-family:var(--mono)}
.user-chip .chip-meta{font-size:9px;line-height:1.4;color:var(--muted);text-align:right;white-space:nowrap;flex-shrink:0}
.user-chip.active .chip-meta{color:var(--accent)}
.view-selector{display:flex;gap:4px;padding:14px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.view-btn{font-family:var(--mono);font-size:10px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.view-btn:hover{border-color:var(--accent);color:var(--text)}
.view-btn.active{background:rgba(212,165,116,.12);border-color:var(--accent);color:var(--accent)}
.panel-detail{display:flex;gap:24px;flex:1;min-height:0}
.panel-detail.as-list{display:block;overflow-y:auto}
.panel-kpi{flex:1;max-width:420px}
.panel-traits{flex:2}
.kpi-card{border:1px solid var(--border2);border-radius:14px;padding:16px;background:var(--panel);margin-bottom:14px}
.kpi-label{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:300;color:var(--text);line-height:1.1}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi-chart{border:1px solid var(--border2);border-radius:14px;padding:16px;background:var(--panel);margin-bottom:14px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.events-chart{min-height:260px}
.chart-card{border:1px solid var(--border2);border-radius:14px;padding:16px;background:var(--panel);margin-bottom:14px}
.chart-title{font-family:var(--mono);font-size:9px;line-height:1.4;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:10px}
.chart-svg{width:100%;height:auto;display:block}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.conv-item{border:1px solid var(--border2);border-radius:12px;padding:12px 16px;margin-bottom:8px;cursor:pointer;transition:.15s;background:var(--panel);display:flex;justify-content:space-between;align-items:center}
.conv-item:hover{border-color:var(--accent);background:rgba(212,165,116,.04)}
.conv-date{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:2px}
.conv-summary{font-size:13px;color:var(--text)}
.conv-meta{font-family:var(--mono);font-size:9px;color:var(--muted);text-align:right}
.ficha{border:1px solid var(--border2);border-radius:12px;padding:12px;background:var(--panel);margin-bottom:8px;transition:.15s}
.ficha:hover{border-color:var(--accent)}
.ficha-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ficha-title{font-size:14px;font-weight:600;line-height:1.2}
.ficha-cat{margin-left:auto;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border:1px solid rgba(212,165,116,.35);border-radius:6px;padding:2px 6px}
.ficha-id{font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:6px}
.conf-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.conf-bar{flex:1;height:5px;border-radius:3px;background:rgba(245,240,232,.08);overflow:hidden}
.conf-fill{height:100%;background:linear-gradient(90deg,#d4a574,#e6a85c);border-radius:3px}
.conf-val{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:34px;text-align:right}
.empty{color:var(--muted);font-size:13px;padding:40px 0;text-align:center}</style>
</head><body>
<header class="app-topbar" data-testid='nav-topbar'>
<a class="app-topbar-brand" data-testid="nav-brand" href="/" id="appBrand">Agente</a>
<nav class="app-nav" id="appNav">
<a data-testid="nav-chat" href="/">Chat</a><a data-testid="nav-flow" href="/flow">Flow</a><a data-testid="nav-mindmap" href="/mindmap">Mindmap</a><a data-testid="nav-users" href="/users">Users</a>
</nav>
<div class="app-topbar-meta"><span class="app-topbar-chip" id="kbLabel">KB</span><span class="app-topbar-chip" id="healthLabel">—</span></div></header>
<script>
(function(){var p=location.pathname.replace(/\/$/,'')||'/';document.querySelectorAll('#appNav a').forEach(function(a){var h=a.getAttribute('href').replace(/\/$/,'')||'/';var ac=h===p;a.classList.toggle('active',ac);if(ac)a.setAttribute('data-active','true');else a.removeAttribute('data-active')});
Promise.all([fetch('/api/config').then(function(r){return r.json()}).catch(function(){return{}}),fetch('/api/health').then(function(r){return r.json()}).catch(function(){return{}})]).then(function(r){var c=r[0]||{},h=r[1]||{},b=document.getElementById('appBrand'),kb=document.getElementById('kbLabel'),hl=document.getElementById('healthLabel');if(b)b.textContent=c.name||c.runtime_title||'Agente';if(kb)kb.textContent=c.kb_label||c.name||'KB';if(hl)hl.textContent=h.status||'unknown';var lm={chat:document.querySelector('[data-testid="nav-chat"]'),flow:document.querySelector('[data-testid="nav-flow"]'),mindmap:document.querySelector('[data-testid="nav-mindmap"]'),users:document.querySelector('[data-testid="nav-users"]')};var nl=c.nav_labels||{};if(lm.chat)lm.chat.textContent=nl.chat||'Chat';if(lm.flow)lm.flow.textContent=nl.flow||'Flow';if(lm.mindmap)lm.mindmap.textContent=nl.mindmap||'Mindmap';if(lm.users)lm.users.textContent=nl.users||'Users'})})();</script>

<div class="layout">
 <div class="col-left">
  <div class="col-head" style="padding-top:20px">Usuarios <span>· SQL</span></div>
  <div class="userbar" id="userbar" data-testid="users-list"></div>
 </div>
 <div class="col-right">
  <div class="view-selector" data-testid="users-view-selector">
   <button class="view-btn active" data-view="profile" data-testid="view-profile">Perfil</button>
   <button class="view-btn" data-view="events" data-testid="view-events">Eventos</button>
   <button class="view-btn" data-view="conversations" data-testid="view-conversations">Conversaciones</button>
  </div>
  <div class="col-head" id="userDetailHeader">Selecciona un usuario <span>·</span></div>
  <div id="detailPanel" class="panel-detail"><div class="empty">Selecciona un usuario de la lista izquierda.</div></div>
 </div>
</div>

<script>
const FICHAS={},USER_DATA=[],FAM_COLORS={self:'#7cba7c',domain:'#7fb3d5',conversation:'#e6a85c',user:'#c97db9'};
let CURRENT_USER=null,CURRENT_VIEW='profile';

async function load(){
 try{
  var resp=await fetch('/api/profiles'),data=await resp.json();
  (data.users||[]).forEach(u=>{USER_DATA.push(u)});
  Object.assign(FICHAS,data.fichas||{});
  renderUserbar();
  if(USER_DATA.length)select(0);
 }catch(e){document.getElementById('userbar').innerHTML='<span class="empty">Error al cargar: '+e.message+'</span>'}}
load();

function renderUserbar(){
 var bar=document.getElementById('userbar');bar.innerHTML='';
 USER_DATA.forEach((u,i)=>{
  var el=document.createElement('div');el.className='user-chip'+(i===CURRENT_USER?' active':'');el.dataset.idx=i;el.setAttribute('data-testid','user-item-'+u.user_id);el.setAttribute('data-user-id',u.user_id);
  el.innerHTML='<div class="chip-main"><div class="chip-name">'+esc(u.external_id||'User #'+u.user_id)+'</div><div class="chip-id">#'+u.user_id+(u.last_active?' · '+u.last_active.slice(0,10):'')+'</div></div><div class="chip-meta">'+(u.traits_count||u.traits?.length||0)+' traits<br/>'+(u.total_turns||0)+' turnos</div>';
  el.onclick=()=>select(i);bar.appendChild(el)})}

function select(i){
 CURRENT_USER=i;renderUserbar();var u=USER_DATA[i];if(!u){document.getElementById('userDetailHeader').textContent='Selecciona un usuario';document.getElementById('detailPanel').innerHTML='<div class="empty">Sin datos.</div>';return}
 // innerHTML, no textContent: la cadena lleva un <span> de markup. El
 // external_id va escapado con esc() y el resto son numeros.
 document.getElementById('userDetailHeader').innerHTML=esc(u.external_id||'User #'+u.user_id)+' <span>· '+(u.traits?.length||0)+' traits · '+(u.conversations?.length||0)+' conversations</span>';
 switchView(CURRENT_VIEW)}

function switchView(view){
 CURRENT_VIEW=view;document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view))
 // El panel es flex-row solo para el perfil (columna KPIs + columna traits).
 // Eventos y conversaciones inyectan una lista vertical: sin esto cada item
 // se vuelve una columna estirada a toda la altura.
 document.getElementById('detailPanel').classList.toggle('as-list',view!=='profile')
 var u=USER_DATA[CURRENT_USER];if(!u)return;
 if(view==='profile')renderProfile(u);
 else if(view==='events')renderEvents(u);
 else if(view==='conversations')renderConversations(u)}

// ---- datos aleatorios pero deterministas por usuario (seed = user_id) ----
function rndSeries(u,salt,n,min,max){
 var seed=((u.user_id||1)*7+(salt||0))>>>0;
 var out=[];
 for(var i=0;i<n;i++){
  seed=(seed*9301+49297)%233280;
  var r=seed/233280;
  out.push(Math.round(min+r*(max-min)));
 }
 return out;
}
// ---- grafico de barras SVG inline ----
function svgBars(vals,opts){
 opts=opts||{};
 var W=opts.w||280,H=opts.h||110,pad=opts.pad||18,gap=opts.gap||6;
 var n=vals.length,max=Math.max.apply(null,vals.concat([1]));
 var innerW=W-pad*2,innerH=H-pad*2;
 var bw=(innerW-gap*(n-1))/n;
 var labels=opts.labels||[];
 var bars='';
 for(var i=0;i<n;i++){
  var bh=Math.max(2,Math.round(vals[i]/max*innerH));
  var x=pad+i*(bw+gap),y=pad+innerH-bh;
  bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh+'" rx="2" fill="url(#barGrad)"></rect>';
  bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(pad+innerH+11)+'" font-size="7" font-family="JetBrains Mono,monospace" fill="rgba(245,240,232,.4)" text-anchor="middle">'+esc(labels[i]||(i+1))+'</text>';
 }
 return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a85c"></stop><stop offset="1" stop-color="#d4a574"></stop></linearGradient></defs>'+bars+'</svg>';
}
// ---- grafico de linea SVG inline ----
function svgLine(vals,opts){
 opts=opts||{};
 var W=opts.w||280,H=opts.h||120,pad=opts.pad||18;
 var n=vals.length,max=Math.max.apply(null,vals.concat([1])),min=Math.min.apply(null,vals.concat([0]));
 var innerW=W-pad*2,innerH=H-pad*2,rng=(max-min)||1;
 var labels=opts.labels||[];
 var pts=[];
 for(var i=0;i<n;i++){
  var x=pad+(n>1?i/(n-1):0)*innerW;
  var y=pad+innerH-((vals[i]-min)/rng)*innerH;
  pts.push([x,y]);
 }
 var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
 var area='M '+pad+' '+(pad+innerH)+' L '+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' L ')+' L '+(pad+innerW)+' '+(pad+innerH)+' Z';
 var dots='',lbls='';
 for(var j=0;j<n;j++){
  dots+='<circle cx="'+pts[j][0].toFixed(1)+'" cy="'+pts[j][1].toFixed(1)+'" r="2.5" fill="#d4a574"></circle>';
  lbls+='<text x="'+pts[j][0].toFixed(1)+'" y="'+(pad+innerH+11)+'" font-size="7" font-family="JetBrains Mono,monospace" fill="rgba(245,240,232,.4)" text-anchor="middle">'+esc(labels[j]||(j+1))+'</text>';
 }
 return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="lineArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(212,165,116,.28)"></stop><stop offset="1" stop-color="rgba(212,165,116,0)"></stop></linearGradient></defs><path d="'+area+'" fill="url(#lineArea)"></path><polyline points="'+poly+'" fill="none" stroke="#d4a574" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>'+dots+lbls+'</svg>';
}
var WK=['S1','S2','S3','S4','S5','S6'];

function renderProfile(u){
 var panel=document.getElementById('detailPanel');var traits=u.traits||[];
 var byCat={};traits.forEach(t=>{var f=FICHAS[t.trait_id];var cat=(f&&f.category)||'general';(byCat[cat]||=[]).push(t)});
 panel.innerHTML='<div class="panel-kpi" data-testid="profile-kpis"><div class="kpi-card"><div class="kpi-label">Turnos</div><div class="kpi-value">'+(u.total_turns||0)+'</div><div class="kpi-sub">total conversaciones</div></div><div class="kpi-card"><div class="kpi-label">Traits</div><div class="kpi-value">'+(traits.length)+'</div><div class="kpi-sub">rasgos aprendidos</div></div><div class="kpi-card"><div class="kpi-label">Última actividad</div><div class="kpi-value" style="font-size:16px">'+(u.last_active?u.last_active.slice(0,10):'—')+'</div></div><div class="chart-card"><div class="chart-title">Actividad semanal</div>'+svgBars(rndSeries(u,11,6,2,12),{labels:WK})+'</div><div class="chart-card"><div class="chart-title">Mensajes por semana</div>'+svgBars(rndSeries(u,29,6,1,9),{labels:WK})+'</div></div><div class="panel-traits" data-testid="profile-traits">'+
 (traits.length?traits.map(t=>{var f=FICHAS[t.trait_id];var pct=Math.round((t.confidence||.5)*100);return'<div class="ficha"><div class="ficha-top"><span class="ficha-title">'+esc((f&&f.title)||t.trait_id)+'</span>'+(f&&f.category?'<span class="ficha-cat">'+esc(f.category)+'</span>':'')+'</div><div class="ficha-id">'+esc(t.trait_id)+'</div><div class="conf-row"><div class="conf-bar"><div class="conf-fill" style="width:'+pct+'%"></div></div><div class="conf-val">'+(t.confidence||.5).toFixed(2)+'</div></div><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">source: '+esc(t.source||'extractor')+'</div>'+(f&&f.description?'<div style="margin-top:6px;font-size:12px;color:rgba(245,240,232,.6)">'+esc(f.description)+'</div>':'')+'</div>'}).join(''):'<div class="empty">Sin traits todavía.</div>')+'</div>';}

function renderEvents(u){
 var panel=document.getElementById('detailPanel');
 var adher=rndSeries(u,3,6,40,100);
 var freq=rndSeries(u,17,6,1,10);
 var mood=rndSeries(u,41,6,2,9);
 panel.innerHTML='<div class="events-chart" data-testid="users-events" style="display:block;padding:0;border:0;background:transparent;min-height:0"><div class="chart-card"><div class="chart-title">Adherencia semanal (%)</div>'+svgLine(adher,{labels:WK,w:600,h:150})+'</div><div class="chart-grid"><div class="chart-card"><div class="chart-title">Frecuencia de contacto</div>'+svgBars(freq,{labels:WK})+'</div><div class="chart-card"><div class="chart-title">Mood estimado</div>'+svgBars(mood,{labels:WK})+'</div></div></div><div class="col-head" style="margin-top:4px">Eventos recientes <span>·</span></div>'+
 ((u.conversations||[]).slice(0,5).map(c=>'<div class="conv-item" style="cursor:default"><div><div class="conv-date">'+esc(c.created_at||'')+'</div><div class="conv-summary">'+esc(c.summary||'—')+'</div></div><div class="conv-meta">chat</div></div>').join('')||'<div class="empty">Sin eventos todavía.</div>')}

function renderConversations(u){
 var panel=document.getElementById('detailPanel');
 panel.innerHTML='<div class="col-head" style="padding:0;margin-bottom:14px">Conversaciones <span>· '+((u.conversations||[]).length||0)+'</span></div>'+
 ((u.conversations||[]).length?u.conversations.map(c=>{
   var href=c.session_id?('/?session='+encodeURIComponent(c.session_id)):('/?user='+encodeURIComponent(u.external_id||''));
   var metaExtra=c.session_id?'':' · sin sesión';
   return '<div class="conv-item" data-testid="conversation-'+esc(c.session_id||c.legacy_group||'')+'" onclick="window.location.href=\''+href+'\'"><div><div class="conv-date">'+esc(c.created_at||'')+'</div><div class="conv-summary">'+esc(c.summary||'—')+'</div></div><div class="conv-meta">'+(c.n_turns||0)+' turnos'+esc(metaExtra)+'<br/>'+esc(c.result||'')+'</div></div>'
 }).join(''):'<div class="empty">Sin conversaciones guardadas.</div>')}

document.querySelectorAll('.view-btn').forEach(b=>b.addEventListener('click',function(){switchView(this.dataset.view)}));
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
</script>
<script src="/static/demo-tour.js"></script>
<script>if(window.DemoTour)DemoTour.run();</script>
</body></html>
