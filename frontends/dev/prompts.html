<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>System Prompts — Dev Console</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg-page);color:var(--text-primary);font-family:var(--font-sans);display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1;overflow-y:auto;padding:24px 28px 60px}
h1{font-size:20px;font-weight:600;margin-bottom:2px}
.sub{color:var(--text-muted);font-size:12px;margin-bottom:20px}
.agent-tabs{display:flex;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.agent-tab{padding:7px 14px;border-radius:8px;border:1px solid var(--border-strong);font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--text-muted-2);transition:var(--transition)}
.agent-tab:hover{border-color:var(--accent);color:var(--text-primary)}
.agent-tab.active{background:rgba(212,165,116,.12);border-color:rgba(212,165,116,.35);color:var(--accent)}
.prompt-panel{display:none;border:1px solid var(--border-accent);border-radius:14px;background:var(--bg-panel);overflow:hidden}
.prompt-panel.active{display:block}
.prompt-header{padding:14px 18px;border-bottom:1px solid var(--border-strong);display:flex;justify-content:space-between;align-items:center}
.prompt-role{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prompt-meta{font-size:11px;color:var(--text-muted-2)}
.prompt-body{padding:0}
.prompt-section{border-bottom:1px solid var(--border-strong)}
.prompt-section:last-child{border-bottom:none}
.prompt-section-header{padding:10px 18px;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid rgba(245,240,232,.06);cursor:pointer;user-select:none;transition:var(--transition)}
.prompt-section-header:hover{color:var(--text-primary)}
.prompt-section-header .toggle{float:right;transition:transform .2s}
.prompt-section-header.collapsed .toggle{transform:rotate(-90deg)}
.prompt-section-content{padding:12px 18px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-x:auto;font-family:var(--font-mono);font-size:12px;color:rgba(245,240,232,.85)}
.prompt-section-content code{background:rgba(212,165,116,.08);border:1px solid rgba(212,165,116,.15);border-radius:4px;padding:1px 5px;font-size:11px}
.prompt-section-content.collapsed{display:none}
.criteria-list{padding:10px 18px;list-style:none}
.criteria-item{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(245,240,232,.06);font-size:12px}
.criteria-item:last-child{border-bottom:none}
.criteria-id{font-family:var(--font-mono);font-size:10px;color:var(--family-conversation);min-width:160px}
.criteria-text{color:var(--text-muted-2)}
.empty{color:var(--text-muted);font-size:13px;padding:24px 0;text-align:center}
.loading{color:var(--text-muted);font-size:12px;padding:24px 0;text-align:center}
.error{color:var(--danger);font-size:13px;padding:16px}
.copy-btn{background:transparent;border:1px solid var(--border-strong);border-radius:6px;color:var(--text-muted);font-family:var(--font-mono);font-size:9px;padding:4px 10px;cursor:pointer;transition:var(--transition);margin-left:auto}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head><body>

<div id="appNavMount"></div>

<div class="wrap">
  <h1>📜 System Prompts</h1>
  <p class="sub" id="kbLabel">Cargando...</p>

  <div class="agent-tabs" id="agentTabs"></div>
  <div id="promptPanels"></div>
  <div class="empty" id="loadingState">Cargando prompts de cada agente...</div>
  <div class="error" id="errorState" style="display:none"></div>
</div>

<script>
const ROLE_LABELS = {
  conversador: 'Conversador', router: 'Ruteador',
  orchestrator: 'Orquestador', gate: 'Gate'
};
const ROLE_COLORS = {
  conversador: '#e6a85c', router: '#7fb3d5',
  orchestrator: '#7cba7c', gate: '#c97db9'
};

async function boot(){
  const tabsEl = document.getElementById('agentTabs');
  const panelsEl = document.getElementById('promptPanels');
  const loading = document.getElementById('loadingState');
  const error = document.getElementById('errorState');

  let data;
  try{
    const res = await fetch('/api/system-prompts');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  }catch(e){
    loading.style.display = 'none';
    error.style.display = 'block';
    error.textContent = 'Error cargando prompts: ' + e.message;
    return;
  }

  document.getElementById('kbLabel').textContent = 'KB: ' + (data.kb_root || '—');
  const agents = data.agents || {};
  const roles = Object.keys(agents);
  if(!roles.length){
    loading.textContent = 'No hay agentes configurados en esta KB.';
    return;
  }

  loading.style.display = 'none';

  // Tabs
  roles.forEach((role, i) => {
    const tab = document.createElement('button');
    tab.className = 'agent-tab' + (i===0 ? ' active' : '');
    tab.textContent = ROLE_LABELS[role] || role;
    tab.style.setProperty('--tab-accent', ROLE_COLORS[role] || 'var(--accent)');
    tab.dataset.role = role;
    tabsEl.appendChild(tab);
  });

  // Panels
  roles.forEach((role, i) => {
    const a = agents[role];
    const panel = document.createElement('div');
    panel.className = 'prompt-panel' + (i===0 ? ' active' : '');
    panel.dataset.role = role;

    // Header
    const header = document.createElement('div');
    header.className = 'prompt-header';
    const left = document.createElement('div');
    left.innerHTML = '<span class="prompt-role">' + (ROLE_LABELS[role]||role) + '</span>';
    if(a.step_count !== undefined) left.innerHTML += '<span class="prompt-meta" style="margin-left:10px">' + a.step_count + ' steps</span>';
    if(a.criteria) left.innerHTML += '<span class="prompt-meta" style="margin-left:10px">' + a.criteria.length + ' criterios</span>';
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copiar';
    copyBtn.onclick = function(){ copyAllPrompt(panel); };
    header.appendChild(left);
    header.appendChild(copyBtn);
    panel.appendChild(header);

    // Framing section
    if(a.framing){
      panel.appendChild(section('Encuadre de negocio', null, a.framing));
    }

    // Static instruction
    if(a.static_instruction){
      panel.appendChild(section('Instrucción estática', null, a.static_instruction));
    }

    // Gate criteria
    if(a.criteria && a.criteria.length){
      const div = document.createElement('div');
      div.className = 'prompt-section';
      const sh = document.createElement('div');
      sh.className = 'prompt-section-header';
      sh.innerHTML = 'Criterios del gate <span class="toggle">▼</span>';
      div.appendChild(sh);
      const list = document.createElement('ul');
      list.className = 'criteria-list';
      a.criteria.forEach(c => {
        const li = document.createElement('li');
        li.className = 'criteria-item';
        li.innerHTML = '<span class="criteria-id">' + (c.id||'—') + '</span><span class="criteria-text">' + (c.criterion||'') + '</span>';
        list.appendChild(li);
      });
      div.appendChild(list);
      // Toggle collapse
      sh.onclick = function(){
        sh.classList.toggle('collapsed');
        list.style.display = list.style.display === 'none' ? '' : 'none';
      };
      panel.appendChild(div);
    }

    panelsEl.appendChild(panel);
  });

  // Tab switching
  tabsEl.querySelectorAll('.agent-tab').forEach(tab => {
    tab.addEventListener('click', function(){
      tabsEl.querySelectorAll('.agent-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      panelsEl.querySelectorAll('.prompt-panel').forEach(p => p.classList.remove('active'));
      const panel = panelsEl.querySelector('.prompt-panel[data-role="' + tab.dataset.role + '"]');
      if(panel) panel.classList.add('active');
    });
  });
}

function copyAllPrompt(panel){
  const texts = [];
  panel.querySelectorAll('.prompt-section-content').forEach(el => {
    if(el.style.display !== 'none') texts.push(el.textContent.trim());
  });
  navigator.clipboard.writeText(texts.join('\n\n'));
}

function section(label, meta, content){
  const div = document.createElement('div');
  div.className = 'prompt-section';
  const sh = document.createElement('div');
  sh.className = 'prompt-section-header';
  sh.innerHTML = (label || '') + ' <span class="toggle">▼</span>';
  div.appendChild(sh);
  const sc = document.createElement('div');
  sc.className = 'prompt-section-content';
  sc.textContent = content;
  div.appendChild(sc);
  sh.onclick = function(){
    sh.classList.toggle('collapsed');
    sc.classList.toggle('collapsed');
  };
  return div;
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body></html>
