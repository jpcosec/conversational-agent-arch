name: ci

# Dos capas:
#   static  -> gate liviano sin deps (compila, config, no-hardcode).
#   suite   -> suite offline real (unit + integration) instalando las 3 deps
#              locales (sldb, kgdb, deskops) por git. Se pudo habilitar al
#              publicar kgdb (jpcosec/kgdb); antes no habia remoto y solo
#              corria el gate estatico.
#
# El gate AUTORITATIVO de release (suite + deploy Modal + tag + rama
# production) sigue en deploy/release.sh: corre en el entorno del dev, unica
# fuente de verdad de "que hay arriba".
on:
  push:
    branches: [main, dev, production]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sintaxis (todo el arbol compila)
        run: python -m compileall -q kb_agent knowledge_base frontends deploy

      - name: project.config.yaml es YAML valido y declara negocio activo
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml, sys
          cfg = yaml.safe_load(open("project.config.yaml"))["project"]
          assert cfg.get("name"), "falta project.name"
          assert cfg.get("kb_root"), "falta project.kb_root"
          assert cfg.get("tools"), "falta project.tools"
          print(f"negocio activo: {cfg['name']} (kb_root={cfg['kb_root']})")
          PY

      - name: No hay hardcodes de negocio en el runtime
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          MARKERS = ("don peppe", "donpeppe", "antonia")
          def docstring_nodes(tree):
              ids = set()
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Module, ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      body = getattr(node, "body", [])
                      if body and isinstance(body[0], ast.Expr) and isinstance(body[0].value, ast.Constant) and isinstance(body[0].value.value, str):
                          ids.add(id(body[0].value))
              return ids
          hits = []
          for p in pathlib.Path("kb_agent").rglob("*.py"):
              tree = ast.parse(p.read_text(encoding="utf-8"))
              ds = docstring_nodes(tree)
              for node in ast.walk(tree):
                  if isinstance(node, ast.Constant) and isinstance(node.value, str) and id(node) not in ds:
                      if any(m in node.value.lower() for m in MARKERS):
                          hits.append(f"{p}:{node.lineno}: {node.value!r}")
          if hits:
              print("ERROR: nombre de negocio hardcodeado en un string-literal vivo de kb_agent/")
              print("       (debe venir de la KB o de project.config.yaml)")
              print("\n".join(hits))
              sys.exit(1)
          print("ok: kb_agent/ no hardcodea negocios (comentarios y docstrings se ignoran)")
          PY

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar deps locales del ecosistema (git, repos publicos)
        run: |
          python -m pip install --upgrade pip
          pip install \
            "git+https://github.com/jpcosec/sldb.git" \
            "git+https://github.com/jpcosec/kgdb.git" \
            "git+https://github.com/jpcosec/opsys.git#egg=deskops"

      - name: Instalar deps de runtime
        run: |
          pip install \
            "fastapi==0.135.2" "starlette==1.3.1" "uvicorn[standard]==0.42.0" \
            "python-multipart==0.0.26" "twilio==9.10.9" "python-dotenv==1.0.1" \
            "networkx==3.6.1" "numpy==2.1.3" "PyYAML==6.0.3" \
            "SQLAlchemy==2.0.49" "pydantic==2.13.4" \
            "httpx" "pytest" "pytest-asyncio"

      - name: Suite offline (unit + integration, sin LLM)
        env:
          SKIP_LLM_TESTS: "1"
        run: python -m pytest tests/unit tests/integration -q
