namespaces:
  domain:
    do_not_use_when: A more specific system, topic, layer, or pattern tag applies.
    examples:
    - domain:knowledge-management
    - domain:task-execution
    meaning: Problem domain or durable area of concern.
    use_when: The atom belongs to a reusable problem domain.
  gate:
    do_not_use_when: The tag describes a conversation step, user trait, or general topic instead of a post-draft validation criterion.
    examples:
    - gate:regulatorio.dosis
    - gate:corpus
    meaning: Post-draft policy-gate criterion evaluated over the agent response.
    use_when: The atom defines a validation or rejection criterion for the gate family.
  layer:
    do_not_use_when: The tag names only a broad topic or system.
    examples:
    - layer:document-model
    - layer:runtime
    - layer:cli
    meaning: Architectural layer where the atom applies.
    use_when: The atom is scoped to a layer of the system.
  source:
    do_not_use_when: The tag expresses the atom subject instead of where it originated.
    examples:
    - source:reflector
    meaning: Provenance channel or producer that originated the atom draft.
    use_when: The atom is machine- or workflow-generated and needs source attribution.
  system:
    do_not_use_when: The tag is only a general topic.
    examples:
    - system:deskops
    - system:sldb
    meaning: System, project, or tool the atom belongs to.
    use_when: The atom is about a specific system.
  topic:
    do_not_use_when: The atom describes a reusable implementation shape.
    examples:
    - topic:atoms
    - topic:composition
    meaning: Subject area discussed by the atom.
    use_when: The atom is about a conceptual topic.
