# Configuración del proyecto/negocio activo del runtime.
#
# Doctrina: una KB = un negocio. Este archivo define QUÉ negocio corre el
# runtime y sus rutas/marca/tools, para no hardcodear nombres ni paths en el
# código ni en las UIs. Cambiar de negocio = cambiar este archivo (o la env
# PROJECT_CONFIG).
#
# Cada valor admite override por variable de entorno (ver kb_agent/project_config.py):
#   KB_ROOT, PROFILING_DB, CHAT_DB, GEMINI_MODEL, HOST, PORT, PROJECT_CONFIG

project:
  # Identidad del negocio
  name: "Antonia"                   # nombre visible en las UIs
  slug: antonia                     # identificador corto (sin espacios)

  # KB del negocio (una KB = un negocio; el editor de flujo y el compilador
  # leen SIEMPRE este mismo store).
  #
  #   kb_root      -> store REAL del negocio, usado al SERVIR el runtime.
  #                   Apunta aqui al store externo/productivo del negocio.
  #   test_kb_root -> store de PRUEBA del repo, usado bajo pytest (auto) o
  #                   con mode="test". Mantiene los tests aislados del real.
  kb_root: knowledge                # KB REAL del negocio desplegado (Antonia)
  test_kb_root: tests/knowledge     # KB de prueba del repo (Don Peppe, atoms tipados)

  chat_db: runs/ui-chat.sqlite      # SQLite del orquestador (sesión + traits)
  profiling_db: runs/ui-chat.sqlite # SQLite que lee el visualizador de perfiles

  # Modelo LLM (Conversador + Perfilador)
  model: gemini-2.5-flash

  # Fallback de ultimo recurso si la KB no declara un FallbackRule.
  # (La KB de Antonia SI lo declara: fallback-antonia. Esto solo aplica si falta.)
  # fallback_message: "No tengo esa información a mano."

  # Tools del negocio: {nombre declarado en el ToolAtom: "modulo:funcion"}.
  # El ToolAtom de la KB define el schema; aqui se registra quien lo ejecuta.
  # Un handler registrado pero no declarado por la KB activa simplemente no se
  # usa (Don Peppe declara crear_reserva; Antonia declara agendar_recordatorio).
  tools:
    agendar_recordatorio: kb_agent.tools.recordatorios:agendar_recordatorio
    crear_reserva: kb_agent.tools.reservas:crear_reserva
    registrar_enrolamiento: kb_agent.tools.enrolamiento:registrar_enrolamiento

  # Servidor HTTP (frontends/chat)
  server:
    host: 127.0.0.1
    port: 8000

  # Presentación (UIs)
  ui:
    runtime_title: "Auditable Agent Runtime"
    kb_label: "Antonia · KB"
    input_placeholder: "Escribe tu mensaje..."
    # Este saludo lo lee la paciente: nada de vocabulario del runtime (atoms,
    # contexto compilado, auditoría de turnos). La trazabilidad se inspecciona
    # en el Turn Inspector, que es superficie de desarrollo, no de producto.
    greeting: >-
      Hola. Soy **Antonia**, del Programa de Acompañamiento de Selfix.
      Pregúntame sobre tu tratamiento, cómo aplicarte o agenda un recordatorio
      de aplicación. Tu médico tratante sigue siendo tu referente clínico.

  # Parámetros de tuning del runtime (antes hardcodeados en el código).
  # Cada uno admite override por env: MAX_BUNDLE_SIZE, HISTORY_LIMIT,
  # ROUTER_MAX_RESULTS, TOOL_TIMEOUT_MS.
  tuning:
    max_bundle_size: 12       # tope de documentos en el bundle del turno
    history_limit: 6          # mensajes recientes que entran al contexto
    router_max_results: 10    # default de explore_multi del ruteador
    tool_timeout_ms: 15000    # timeout de una tool call

  # Infra de despliegue (Modal). NO es config de negocio; es plataforma.
  # modal_app_name admite override por env MODAL_APP_NAME (app + volumen
  # <app>-data). El resto lo lee deploy/modal_app.py desde aquí.
  deploy:
    modal_app_name: kb-agent-runtime
    gcp_secret_name: kb-agent-runtime-gcp   # ADC de Vertex AI (Modal Secret)
    twilio_secret_name: null                # Secret con TWILIO_AUTH_TOKEN (si existe)
    min_containers: 1
    serve_timeout_s: 600

  # Demo mode - habilita el orquestador ligero y LLM sin carga de producción
  demo_mode: true
